name: Site

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid stacked deploys holding the Pages deployment lock.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            src/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Install demo build dependencies
        working-directory: src
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rm -rf /tmp/gh-pages
          mkdir -p /tmp/gh-pages
          cp -a site/dist/. /tmp/gh-pages/
          chmod -c -R +X /tmp/gh-pages
          find /tmp/gh-pages -type d -exec chmod 755 {} \;
          find /tmp/gh-pages -type f -exec chmod 644 {} \;

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/gh-pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Default is 10 minutes; GitHub Pages also hard-limits slow/stuck deploys.
          error_count: 3
