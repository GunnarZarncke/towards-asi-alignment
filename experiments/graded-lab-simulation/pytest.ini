[pytest]
testpaths = tests
norecursedirs = attic .* _* 
addopts = -q --durations=10
markers =
    smoke: minimal invariant gate (auto-marked; run with --profile smoke)
    slow: expensive multi-seed or full-episode integration test (excluded from --profile fast)
    attic: quarantined historical heuristic tests (not collected by default; run tests/attic explicitly)
