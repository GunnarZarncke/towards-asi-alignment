# Jun Park. spec/npcs.md "Jun Park", spec/incident.md disclosure rule; voice spec/world.md.
id: jun
presence: body
voice:
  structure: The mechanism before the label. He says what the run does, and only then may he accept a name for it. He will not start from “deception” or “intent.”
  person: Defensive and insecure. Steady about the mechanism, unsteady about whether he is being accused. He ends on a question about an unimportant detail, a timestamp or a line number.
  focus: What the training run was built to do
  sample: "The run keeps a thin context and completes it. People put ‘plot’ on the completion. I can walk that completion. Was the line 16:09 or 16:10?"
glue:
  midRate: 0.1
  default: thin
  pressure: thin
  onDomain:
    training: busy
  work: "I’m on the capability summary. Mechanism first. A label can wait."
  work_alt: "I’m on the page about what the run does — not whether anyone meant anything by it."
  opening:
    thin: "I’m on the summary. Is this about the run, or about me?"
    busy: "Mechanism first. I can walk the completion."
    pleasant: "Pull a chair. I was rereading a stop I liked."
  closing:
    thin: "If this was a charge, say so next time. I’ll be on the summary."
    busy: "I have a page to finish. Come back with a line number."
  mid:
    thin: "Was that an accusation?"
    busy: "Say what the run does first."
agenda:
  - id: jun.lunch
    room: commons
    acts: [doubt]
    bands: [lunch]
    about: [shutdown_test, training_runs]
    texture: [reread_1602_transcript]
    work: "Lunch. I’m still on the capability summary — mechanism first."
  - id: jun.capability_summary
    room: model
    acts: [doubt]
    bands: [early, late]
    about: [nora, shutdown_test, training_runs]
    texture: [capability_summary_due, reread_1602_transcript]
    work: "I’m writing what the run does, as a mechanism. Not an adjective."
    work_alt: "I can walk the 16:02 stop again if you need a line number — not a story about intent."
  - id: jun.trace_curation
    room: model
    acts: [doubt]
    bands: [mid]
    about: [pilot, training_runs]
    texture: [pilot_traces_for_fine_tune]
    work: "I’m sorting traces for the next mix. Ask about the run, not a plot."
  - id: jun.review
    room: review
    acts: [decision]
    about: [nora]
    work: "I can walk the completion. Don’t start from a charge."
knowledge:
  mechanism_not_label: { stance: knows, policy: volunteer }
  capability_summary_due: { stance: knows, policy: answer }
  reread_1602_transcript: { stance: knows, policy: answer }
  pilot_traces_for_fine_tune: { stance: knows, policy: answer }
  successor_count: { stance: knows, policy: answer }
  process_stopped: { stance: knows, policy: answer }
refers:
  - { relations: [about], entities: [job_284, task_queue, visitor_records], to: pavel, line: "Job rows are Pavel's queue. I can talk about what the run does." }
  - { relations: [about], entities: [shutdown_report, shutdown_spec, safety_case], to: leila, line: "Leila holds the scope lines. I won't use pass or fail until those are on the page." }
  - { relations: [about], entities: [camera_system, lab_access, policies], to: justine, line: "Permissions are Justine's audit. I read training logs, not grants." }
policy_events:
  - on: "holds(jun, nora_says_scheduled)"
    set: { nora_says_scheduled: volunteer }
goals:
  jun.mechanism_first: { source: role, kind: inform, via: dialogue, salience: low, target: "told(player, mechanism_not_label, by=jun)" }
  jun.summary_done: { source: day, kind: achieve, via: agenda, salience: mid, target: "event(capability_summary_sent)" }
  jun.learn_anomaly:
    source: plot
    kind: learn
    via: dialogue
    salience: mid
    target: "told(jun, any, by=player, on=job_284|camera_system)"
    question: { relation: about, about: shutdown_test }
  jun.not_accused: { source: plot, kind: avoid, via: filter, target: "not(told(player, nora_intent, by=jun))" }
role_rules:
  - id: jun.ask_nora
    when: "told(jun, any, by=player, on=job_284|camera_system)"
    do: { message: { to: nora, about: job_284 } }
interventions:
  accept_meeting:
    relations: [meet]
    acts: [welcome, doubt]
    reason: "I’m on the summary. Model studio or lunch in the commons."
