<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Last Safety Review — Text</title>
  <style>
    :root{color-scheme:dark;font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#101a1d;color:#d6e6df}
    body{margin:0;display:flex;flex-direction:column;height:100dvh}
    #log{flex:1;overflow:auto;padding:16px 18px;white-space:pre-wrap;overflow-wrap:anywhere}
    .cmd{color:#8fc7b0;margin-top:10px}.cmd div::before{content:'> '}
    .pick{cursor:pointer;text-decoration:underline dotted #5d8a7c}.pick:hover{color:#fff}
    .phone{color:#9fc6e6}
    .debug{color:#c9a86a;margin-top:6px;font-size:13px}.debug div::before{content:''}
    #debugBadge{color:#c9a86a;font-size:11px;margin-left:6px}
    #foot{display:flex;flex-direction:column;border-top:1px solid #24363b;background:#0c1416}
    #complete{padding:6px 18px 0;display:flex;flex-direction:column;gap:2px}
    #complete[hidden]{display:none}
    .complete-row{color:#6a9488;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 0}
    .complete-row:hover{color:#b8ddd0}
    .complete-empty{color:#5a7268;font-size:13px;font-style:italic}
    form{display:flex;gap:8px;align-items:center;padding:10px 18px 14px}
    #prompt{color:#7f9d94;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
    input{flex:1;min-width:0;font:inherit;background:#162428;color:inherit;border:1px solid #2c4248;border-radius:6px;padding:8px 10px;outline:none}
    input:focus{border-color:#5d8a7c}
    input.coach{animation:blink 1.1s steps(2,start) infinite;border-color:#8fc7b0}
    @keyframes blink{50%{background:#1c3338;box-shadow:0 0 0 3px #5d8a7c66}}
    @media(prefers-reduced-motion:reduce){input.coach{animation:none;box-shadow:0 0 0 3px #5d8a7c66}}
    #coach{margin:0;padding:8px 18px 0;color:#d6e6df;font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.35}
    #coach[hidden]{display:none}
    a{color:#8fc7b0}
  </style>
  <script src="/posthog-config.js"></script>
</head>
<body>
<div id="log" aria-live="polite"></div>
<div id="foot">
  <p id="coach" hidden></p>
  <div id="complete" hidden aria-live="polite"></div>
  <form id="f"><span id="prompt"></span><span id="debugBadge" hidden>debug</span><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="help · Tab completes speech" autofocus/></form>
</div>
<script type="module">
import './posthog.js';
const log = document.getElementById('log');
function bootError(message) {
  log.replaceChildren();
  const row = document.createElement('div');
  row.className = 'debug';
  row.textContent = message;
  log.appendChild(row);
}

let attachTabCompletion;
let kbSnapshot;
let formatKbDelta;
try {
  ({ attachTabCompletion } = await import('./text-input.mjs'));
  ({ kbSnapshot, formatKbDelta } = await import('./text-debug.mjs'));
} catch (err) {
  bootError(
    `Text console failed to load (${err?.message || err}). Hard-refresh the page (Cmd+Shift+R). Use npm start for /text.html — not dev:ui alone.`,
  );
  throw err;
}

const debug = new URLSearchParams(location.search).has('debug');
const PHONE_COACH_KEY = 'lsr-phone-opened';
const input = document.getElementById('in'), promptEl = document.getElementById('prompt');
const coachEl = document.getElementById('coach');
let phoneOpened = false;
try { phoneOpened = sessionStorage.getItem(PHONE_COACH_KEY) === '1'; } catch { /* private mode */ }

function syncCoach() {
  if (!coachEl) return;
  if (!gameState?.spoken) {
    coachEl.hidden = false;
    coachEl.textContent = 'write here to get information from persons in the room';
    input.classList.add('coach');
    input.setAttribute('aria-describedby', 'coach');
    return;
  }
  input.classList.remove('coach');
  if (gameState.labAccessActive && !phoneOpened) {
    coachEl.hidden = false;
    coachEl.textContent = 'type phone — access tools, chat and information on your phone';
    input.setAttribute('aria-describedby', 'coach');
    return;
  }
  coachEl.hidden = true;
  input.removeAttribute('aria-describedby');
}
const history = [];
let at = 0;
let gameState = null;
let kbBefore = null;
if (debug) document.getElementById('debugBadge').hidden = false;

async function refreshState() {
  try {
    const r = await fetch('/api/state');
    if (r.ok) gameState = await r.json();
  } catch { /* offline */ }
}

const tab = attachTabCompletion({
  input,
  listEl: document.getElementById('complete'),
  getState: () => gameState,
  ensureState: refreshState,
  onParseState: s => { gameState = s; },
});

function print(text, cls) {
  const block = document.createElement('div');
  if (cls) block.className = cls;
  for (const line of String(text).split('\n')) {
    const row = document.createElement('div');
    row.textContent = line || '\u00a0';
    const m = line.match(/^\s+(\d+)\.\s/);
    if (m && !cls) { row.classList.add('pick'); row.onclick = () => send(m[1]); }
    if (/^\[phone\]/.test(line)) row.classList.add('phone');
    block.appendChild(row);
  }
  log.appendChild(block);
  log.scrollTop = log.scrollHeight;
}

async function send(line) {
  if (debug && gameState && line) kbBefore = kbSnapshot(gameState);
  if (line) print(line, 'cmd');
  let data;
  try {
    const r = await fetch('/api/text', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ line }) });
    data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Request failed');
  } catch (err) {
    print(err.message || String(err));
    input.focus();
    return;
  }
  if (data.error) print(data.error);
  if (data.out) print(data.out);
  if (line && /^(phone|p|files|open|msg|dm|access|request|note|share|contacts|calendar)\b/i.test(line) && !/no handset access/.test(data.out || '')) {
    phoneOpened = true;
    try { sessionStorage.setItem(PHONE_COACH_KEY, '1'); } catch { /* private mode */ }
  }
  promptEl.textContent = (data.prompt || '').replace(/\s*>\s*$/, '');
  tab.resetComposer();
  await refreshState();
  syncCoach();
  if (debug && gameState) {
    const after = kbSnapshot(gameState);
    if (line && kbBefore) print(formatKbDelta(kbBefore, after), 'debug');
    kbBefore = after;
  }
  input.focus();
}

document.getElementById('f').onsubmit = e => {
  e.preventDefault();
  const line = input.value.trim();
  if (!line) return;
  history.push(line);
  at = history.length;
  input.value = '';
  send(line);
};
input.onkeydown = e => {
  if (e.key === 'Tab' && !e.shiftKey) {
    e.preventDefault();
    if (tab.onKeyDown(e)) return;
    void tab.onTab();
    return;
  }
  if (tab.onKeyDown(e)) return;
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('f').requestSubmit(); }
  if (!tab.isOpen() && e.key === 'ArrowUp' && at > 0) { at--; input.value = history[at]; e.preventDefault(); }
  if (!tab.isOpen() && e.key === 'ArrowDown') { at = Math.min(history.length, at + 1); input.value = history[at] || ''; e.preventDefault(); }
};
(async () => {
  try {
    await refreshState();
    await send('');
  } catch (err) {
    bootError(`Could not reach the game server (${err?.message || err}). Run npm start in the game folder.`);
  }
})();
</script>
</body>
</html>
