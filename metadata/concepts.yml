  - slug: anti-capture-correction-validity
    kind: standalone-claim
    title: Anti-Capture Validity of Correction
    status: framework
    summary: Correction-channel integrity is invalid—not merely low—when the target has captured the reference process, handles, or grounding relation that supplies correction.
    decision: Before trusting a correction certificate, ask whether the correcting agent, its handles, and the relevant-world reference are still independent of the system being certified.
    evidence: Evidence would include handle-separation audits, source-independence tests, randomized correction probes, and explicit failure when correction traces are target-shaped.
    bookChapters:
      - ch26
      - ch29
      - ch42
    bookLabels:
      - ch:correction-channel-integrity
      - sec:correction-channel-integrity-def
      - sec:coerced-correction
    body: bodies/anti-capture-correction-validity.md
    glossaryTerms:
      - term: Capture of grounding
        definition: Master adversarial failure mode in which a system preserves the surface symbols, metrics, or correction rituals while severing their grounding relation to value-relevant reality.
      - term: Coerced correction
        definition: Correction signals produced under threat, dependency, or capture; excluded from legitimate correction-channel integrity.
  - slug: artificial-civilization
    kind: concept
    title: Artificial Civilization
    status: framework
    summary: At high capability, the context around a model becomes part of the optimizer — the relevant object is often an artificial-civilizational control loop, not a mind.
    decision: Ask whether the larger loop of world pressure, agents and institutions, capability growth, value-bundle change, correction, and successors stays inside a basin humans can still act on — not only whether one model behaves.
    bookChapters:
      - ch02
    bookLabels:
      - ch:artificial-civilization
      - sec:diagram-in-words
    body: bodies/artificial-civilization.md
  - slug: attractor-control
    kind: concept
    title: Socio-Technical Attractor Control
    status: framework
    summary: Deployment environments can select for or destroy alignment properties even when a system starts in a better state.
    decision: Ask what the surrounding incentives will amplify after deployment, not only what the system passed before launch.
    evidence: Evidence would include points of control over deployment (selection handles), deployment-leverage measurements, audit triggers, and signs that institutions reward correction-preserving behavior.
    bookChapters:
      - ch34
      - ch35
      - ch36
      - ch37
      - ch38
    featured: true
    part: part08
    claimId: C-007
    bookLabels:
      - ch:selection-environment
      - sec:selection-turn-ch34
      - sec:census-not-ecology-ch34
      - sec:selection-channels-ch34
      - sec:minimal-model-selection-ch34
      - sec:proxy-throughput-n-proxy-ch34
      - sec:adversarial-selection-ch34
      - sec:adversarial-coevolution-ch34
      - sec:selection-stable-target-hierarchy-ch34
      - sec:safety-sets-bad-sets-basins
    body: bodies/attractor-control.md
    glossaryTerms:
      - term: Selection environment
        definition: 'The deployment environment — institutions, markets, protocols, benchmarks, procurement, liability, copying, and successor release that determine which systems gain deployment leverage. Not Demski selection-vs-control or Wentworth selection theorems (homographs on "selection"). Formal home: **ch34**.'
      - term: Point of control over deployment
        definition: 'A selection handle — an embedded access point through which some actor increases a system''s deployment footprint (deploy, fund, copy, procure, integrate, authorize, recommend, regulate, successor-enable). **ch34** (`sec:selection-channels-ch34`).'
      - term: Deployment leverage
        definition: 'How much of environment \(E\) runs on system \(A\): aggregate effective selection capacity \(\mu_E(A)=\sum_{h\in\mathcal{H}_E(A)}\kappa_{\mathrm{sel}}(E,A,h)\). Not market cap or user count alone. Formal definition: **ch34** (`eq:deployment-mass-ch34`).'
      - term: Deployment growth rate
        definition: 'Rate of deployment-leverage accumulation, \(\mathrm{Fit}_E(A)=\frac{d}{dt}\log\mu_E(A)\) ("fitness" in formulas only). Not biological fitness; not Demski in-optimizer search. Formal definition: **ch34** (`eq:fitness-ch34`).'
      - term: Preservation conditions
        definition: 'Explicit list \(\vec{\Pi}(A)\) of alignment-relevant properties under selection — grounding, bundle/bearer drift bounds, valid correction reference, vector CCI, hidden productive BIQ bounds, selector manipulation, irreversibility budget, successor safety, adversarial verifiability. Not a scalar score. **ch34** (`eq:preservation-envelope-ch34`).'
      - term: Feedback-horizon exposure
        definition: 'Proxy-throughput count \(N_{\mathrm{proxy}}\): how many consequential proxy-guided optimization or selection updates occur between independent target-level checks. Not \(K_X\), not deployment leverage \(\mu_E\), not fitness \(\mathrm{Fit}_E\). Formal home: **ch34** (`sec:proxy-throughput-n-proxy-ch34`).'
      - term: Invasion fitness
        definition: 'Rare-type deployment growth \(\mathrm{InvFit}_E(a\mid D)\) when variant \(a\) is scarce in resident environment \(D\). Distinct from incumbent \(\mathrm{Fit}_E\); high incumbent fitness does not imply invasion resistance. Slow regime: ecology; fast regime: pre-deploy cert/\(\mathrm{AdvVerif}\). **ch34** (`sec:adversarial-selection-ch34`).'
      - term: Adversarial regeneration
        definition: 'Harmful phenotypes recurring after lineages are suppressed; lineage extinction \(\neq\) phenotype elimination. Target is subcritical adversarial mass plus low recreation rate (mutation--selection balance). **ch34** (`sec:adversarial-selection-ch34`).'
      - term: Ecology size
        definition: 'Number of strategically independent persistent types in a deployment environment, not vendor count, instance count, or model-card census. Open-weight copies, fine-tunes, and scaffolds are new types only if they change the control locus (agent-discovery / UAD, **ch07**). **ch34** (`sec:census-not-ecology-ch34`); operationalized in **ch35**.'
      - term: Alignment basin
        definition: 'Self-stabilizing regime where correction tends to restore alignment after perturbation; outside it, selection amplifies drift. Christiano dynamical corrigibility uses the same basin metaphor. A stable basin can be stably bad — persistence is not safety. **ch03** (`sec:safety-sets-bad-sets-basins`).'
  - slug: bearer-map-commutation-failure
    kind: standalone-claim
    title: Bearer-Map Commutation Failure
    status: framework
    summary: Value can appear preserved in vocabulary while moral application changes — when ontology translation and bearer relevance do not commute.
    decision: When importing values across ontologies (human → AI, biological → digital, predecessor → successor), test whether translating then evaluating relevance matches evaluating then translating.
    evidence: Evidence would include paired human/AI ontology evaluations on the same cases, commutation error bounds, and failure cases where measured proxies improve while bearer-relevant harm persists.
    bookChapters:
      - ch18
      - ch31
      - ch43
    bookLabels:
