    kind: concept
    title: Conserved Properties under Growth, Split, and Merge
    status: framework
    summary: Agent identity must be treated as a relation across transformations, not a fixed set of variables — the real question is which control-relevant properties survive growth, splitting, or merging.
    decision: When a system grows, delegates, is copied, or merges, do not ask whether it is 'the same system.' Ask which control-relevant properties were conserved.
