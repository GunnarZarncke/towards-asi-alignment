    body: bodies/bearer-map-commutation-failure.md
  - slug: bearer-persistence
    kind: concept
    title: Bearer Persistence
    status: framework
    summary: Values must keep applying to the right persons, beings, states, or processes as systems and ontologies change.
    decision: Do not audit only the value label. Audit what the value is being applied to.
    evidence: Evidence would include referent maps, appeal paths, and tests that catch cases where the system preserves a value word while changing who counts.
    bookChapters:
      - ch18
      - ch24
      - ch29
      - ch47
    featured: true
    part: part04
    bookLabels:
