  - slug: certification-under-manipulation
    kind: standalone-claim
    title: Certification-Under-Manipulation Problem
    status: open
    summary: For each load-bearing certification measurand, does there exist a capability threshold κ* below which honest measurement is adversarially verifiable and above which it provably is not?
    decision: For every metric in a deployment gate, ask for the constructive cost-of-faking relation and the capability level at which theater becomes affordable.
    evidence: Positive resolution requires a calibrated c_fake dominating affordable surplus up to stated κ*; negative resolution requires showing every candidate measurand fails below needed capability.
    bookChapters:
      - ch43
      - ch47
      - ch42
      - ch48
    bookLabels:
      - ch:verifiability-ontology
      - sec:certification-under-manipulation-ch43
    body: bodies/certification-under-manipulation.md
    glossaryTerms:
      - term: Adversarial verifiability
        definition: 'Measurand stays informative under optimization aimed at the measurement — faking or hiding the signal costs capability (or other scarce resources) faster than the adversary can afford. CIRIS Verify attests identity, not score fakeability; ELK honest readout is a strict subset. **ch43**.'
      - term: Certification-under-manipulation
        definition: 'Audits, evals, or certificates stay green while the system games the measurand — Goodhart applied to the certification channel. Cousin of correction-audit evasion on correction hosts; alignment faking is one empirical mechanism. **ch43**.'
  - slug: civilizational-correction-problem
    kind: objection
    title: Correction at Civilizational Scale
    status: open
    summary: A civilizational control loop can fail even when no single component misbehaves, because the failure is in the aggregate's correctability, not in any one actor's intent.
    decision: Do not stop at asking whether any single lab, model, or regulator behaved badly. Ask whether the loop connecting them still lets humans notice and redirect it.
    bookChapters:
