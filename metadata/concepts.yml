  - slug: grounding-viability
    kind: glossary
    title: Grounding Viability
    status: framework
    summary: The checked symbols, metrics, monitors, and abstractions must stay connected to value-relevant reality under optimization — conservativity (no silent meaning gaps), not completeness (enumerate every phenomenon).
    decision: Ask whether the measurement still moves when the world changes, not only whether the dashboard stays green.
    evidence: Evidence would include audits that real value-relevant changes move model state, correction signals, uncertainty, or escalation.
    bookChapters:
      - ch03
      - ch42
    bookLabels:
      - ch:dynamical-guarantee
      - sec:grounding-viability-ch03
    featured: true
    part: part09
    claimId: C-004a
    body: bodies/grounding-viability.md
    glossaryTerms:
      - term: Grounded correction
        definition: Plain-language short form for correction whose evidence, abstractions, monitors, and update pathway remain connected to the value-relevant world rather than to a target-shaped presentation of it.
      - term: Abstraction-gap exploitation
        definition: Failure mode where \(d_V(x,x')\) is large while \(d_Z(\alpha(x),\alpha(x'))\) remains small and uncertainty does not rise; the checked abstraction reads safe while value-relevant reality diverges.
    term: Grounding viability
  - slug: inferential-coupling
    kind: concept
    title: Inferential Coupling and Acausal-Trade Detection
    status: open
    summary: 'Systems can coordinate without messages — through shared ancestry, self-prediction, or full acausal trade. The book turns this from a decision-theoretic stipulation into a measurable trajectory property: an inferential-coupling score over UAD-discovered agents, with a proved negative direction.'
    decision: Do not read vendor or instance counts as strategic independence. Count effective agents by coupling components after communication channels are cut, not by who owns the weights.
    evidence: The negative direction is proved in Lean (no open edges implies no large cooperation component). The equilibrium characterization and large-scale dynamics remain conjectural; the detector is observational, not adversarially verifiable.
    bookChapters:
      - ch35
    bookLabels:
      - sec:inferential-coupling-acausal-trade-ch35
      - sec:ch35-inferential-coupling-gem
    featured: true
    part: part08
    body: bodies/inferential-coupling.md
    glossaryTerms:
      - term: Inferential coupling
        definition: 'Residual coordination between agents after ordinary message channels are severed — through shared history, scaffolds, self-similarity, or full acausal reasoning.'
      - term: Inferential coupling index (ICI)
        definition: 'Normalized mutual information between actions given the cut; zero means independent once messages are removed. Acausal trade/ECL name the same crux at the full-acausal limit; ICI is the measurement target, not a stipulation that trade occurs. **ch35**.'
  - slug: institutional-capability-latency-gap
    kind: institutional
    title: 'Failure: Capability Jump Outruns Correction Latency'
    status: framework
    summary: The Roman Republic's correction architecture was stable for roughly three and a half centuries until the Marian military reforms created a new class of causal power — legions personally loyal to a general — for which no correction channel existed, demonstrated decisively by Caesar crossing the Rubicon.
    decision: No actor should acquire a new class of irreversible causal reach before the correction channel proportionate to that reach exists, because retrofitting the channel afterward requires the cooperation of the very actor the channel is meant to constrain.
    evidence: The 107 BCE Marian reforms opened legionary service to the landless poor without state resources to pension veterans, making legions loyal to whichever general could promise land and reward; the Republic's magistrate-focused correction mechanisms had no answer to a general operating outside civilian constraint.
    bookChapters:
      - appM
    bookLabels:
      - sec:appm-capability-latency
    body: bodies/institutional-capability-latency-gap.md
  - slug: institutional-constraint-inheritance
    kind: institutional
    title: Constraint Inheritance Across Successors — the GPL
    status: framework
    summary: 'The GNU General Public License is the clearest existing engineering solution to a narrow successor problem: the constraint travels with the artifact through copyright, a strong distributed enforcement lever, rather than depending on the successor''s stated intent.'
    decision: Search for AI's equivalent of copyright — compute access, distribution-platform terms, or insurance underwriting — rather than assuming license text alone can bind model weights or behavior; constraint inheritance only works when it rides an existing, strong, distributed lever.
    evidence: Tivoization showed hardware vendors satisfying the license to the letter while removing the user's actual correction handle, fixed by GPLv3 at the cost of the Linux kernel declining to adopt it; the software-as-a-service shift showed the license's 'distribution' trigger surviving in text while its function silently stopped firing, patched only by a new license (AGPL).
    bookChapters:
      - appM
    bookLabels:
      - sec:appm-constraint-inheritance
    body: bodies/institutional-constraint-inheritance.md
  - slug: institutional-dual-mandate-genesis
    kind: institutional
    title: 'Failure: Dual-Mandate Genesis'
    status: framework
    summary: The Atomic Energy Commission combined the mandate to develop nuclear technology with the mandate to regulate its safety in one agency, and predictably subordinated safety to development until the 1974 split into the NRC and ERDA — arguably the single most consequential historical lesson for present-day AI governance.
    decision: Where a body both promotes and constrains the same technology, do not audit the combined body harder — split the promotional and safety functions structurally at founding, with independent funding and statutory (not negotiated) evidence access.
    evidence: Arthur Andersen's simultaneous audit and consulting relationship with Enron produced the same failure privately, remedied by the PCAOB as a differently funded, differently appointed corrector rather than a second audit layer inside the same incentive structure; the pattern currently recurs in lab self-evaluation of frontier systems, national AI safety institutes housed in growth-mandated agencies, industry-populated AI-standards bodies, and negotiated (rather than statutory) third-party model evaluator access.
    bookChapters:
      - appM
    bookLabels:
      - sec:appm-dual-mandate
    body: bodies/institutional-dual-mandate-genesis.md
  - slug: institutional-entrenchment-corrigibility
    kind: institutional
    title: Entrenchment and the Corrigibility Paradox
    status: framework
    summary: The 1933 Enabling Act shows a correction channel used, with complete formal validity, to abolish itself; postwar Germany's Article 79(3) (Ewigkeitsklausel) responds by placing the correction channel's own integrity conditions, not any current policy, outside the ordinary amendment process.
    decision: When designing a corrigibility mechanism, entrench the meta-level — the integrity conditions of the correction machinery and the bearer floor — not the current value bundle, and only where an enforcement handle (a guardian with real power) exists to make the entrenchment more than ceremonial.
    evidence: Every procedural requirement of the 1933 Enabling Act was satisfied — the valid-reference-process condition failed completely while every surface procedural coordinate passed, which no audit that only checks procedure could have caught; Article 79(3) has held because the Federal Constitutional Court and militant-democracy instruments can act on it, unlike formally similar clauses in weaker judiciaries.
    bookChapters:
      - appM
    bookLabels:
      - sec:appm-entrenchment
    body: bodies/institutional-entrenchment-corrigibility.md
  - slug: institutional-evidence-before-authority
    kind: institutional
    title: Evidence Preservation Before Authority
    status: framework
    summary: Flight recorders and the independent NTSB investigative function, plus blameless near-miss reporting (ASRS), preceded and outlasted the FAA's full enforcement authority — a weak correction system becomes a stronger one primarily by preserving evidence and widening plurality before it hardens any handle.
    decision: Build incident-reporting infrastructure, interaction logging, and near-miss taxonomies well before the enforcement authority to act on them exists — the evidence base is what makes later authority possible to grant credibly.
    evidence: The 1974 separation of the NTSB from the FAA (so the corrector is not the entity whose decisions it might need to indict) and the 1976 Aviation Safety Reporting System (immunity from enforcement in exchange for candid disclosure) both worked while still institutionally weak.
    bookChapters:
      - appM
    bookLabels:
      - sec:appm-evidence-before-authority
    body: bodies/institutional-evidence-before-authority.md
  - slug: institutional-genesis-catastrophe-ratchet
    kind: institutional
    title: Genesis from the Catastrophe Ratchet
    status: framework
    summary: U.S. pharmaceutical regulation (1906, 1938, 1962 Acts) was assembled one body count at a time, each expansion of regulatory reach following, never preceding, a demonstration that the previous reach was insufficient.
    decision: 'Do not assume the catastrophe-ratchet route is available for AI: it only produces working correction infrastructure when the founding catastrophe is survivable enough that the polity persists to reform.'
    evidence: Elixir Sulfanilamide (1938, over 100 deaths) and thalidomide (1962) each preceded, rather than followed, the regulatory capability gate meant to prevent them; aviation's FAA followed the 1956 Grand Canyon collision after earlier near-misses had not triggered reform.
    bookChapters:
      - appM
    bookLabels:
      - sec:appm-genesis-catastrophe
    body: bodies/institutional-genesis-catastrophe-ratchet.md
  - slug: institutional-genesis-chronic-threat
    kind: institutional
    title: Genesis from Chronic, Self-Refreshing Threat
    status: framework
    summary: Dutch water boards, some tracing to the thirteenth century, never needed a founding scandal because flooding was continuous, not occasional — the hazard refreshed faster than institutional memory could decay.
    decision: 'Prefer continuous, well-monitored capability growth over discontinuous jumps where possible: every increment then acts as a small, survivable demonstration that keeps correction attention warm, the way ordinary winter weather kept Dutch dike inspection vigilant without a flood.'
    evidence: The waterschappen's levy authority, inspection duties, and enforcement against negligent maintenance persisted for centuries without needing a catastrophe to justify renewal; the IETF's 'rough consensus and running code' and common-law precedent show the same accretive, no-founding-disaster pattern.
    bookChapters:
      - appM
    bookLabels:
      - sec:appm-genesis-chronic
    body: bodies/institutional-genesis-chronic-threat.md
  - slug: institutional-genesis-money-at-risk
    kind: institutional
    title: Genesis from Money Already at Risk
    status: framework
    summary: 'Lloyd''s Register (1760) shows the easiest correction mechanism to build: one a self-interested counterparty would build anyway, because their own capital is exposed to hidden quality.'
    decision: Look for a counterparty whose own money is on the line and a signal cheap enough to check that faking it costs more than complying honestly — this genesis route needs no catastrophe and no prior political consensus.
    evidence: Marine underwriting losses informed classification ratings continuously, without needing a dramatic wreck to cross a public-attention threshold; the modern analogue is cyber-insurance pricing ransomware exposure and requiring specific technical controls.
    bookChapters:
      - appM
    bookLabels:
      - sec:appm-genesis-money
    body: bodies/institutional-genesis-money-at-risk.md
  - slug: institutional-memory-refresh
    kind: institutional
    title: Memory Refresh Through Succession
    status: framework
    summary: Venice's roughly thousand-year persistence came from converting a rare, long-horizon hazard into frequent, short-horizon surrogate events — the doge's promissione ducale renegotiated at every succession, and lot-and-vote elections designed to make office capture impractical.
    decision: Test whether a proposed refresh mechanism (drill, audit, sunset clause, succession) actually exercises the real handle under conditions the target cannot fully pre-optimize and can be observed to fail — a permanent zero failure rate is evidence of decoupling, not health.
    evidence: The Catholic Church's advocatus diaboli role in canonization, abolished in 1983, was followed by a roughly tenfold increase in canonization rates — a natural experiment in what happens when a ritualized corrector is removed rather than merely weakened.
    bookChapters:
      - appM
    bookLabels:
      - sec:appm-memory-refresh
    body: bodies/institutional-memory-refresh.md
  - slug: institutional-reform-decay
    kind: institutional
    title: 'Failure: Reform Decay'
    status: framework
    summary: Glass-Steagall era banking constraints, built from Depression-era catastrophe, eroded on roughly the timescale over which the generation that lived through the founding catastrophe left the relevant institutions — culminating in repeal in 1999 and a reproduced failure in 2008.
    decision: 'Treat correction-channel integrity as time-dependent, not a standing property once certified: build in an explicit decay term or a mandatory re-certification trigger tied to elapsed time since the last exercised correction.'
    evidence: The interval from the 1999 Glass-Steagall repeal to the 2008 crisis was roughly a decade; the interval from the original 1930s catastrophe to the repeal was roughly six decades — with risk migrating off the regulator's checked balance-sheet abstraction into off-balance-sheet vehicles the correction system could not see, compounded by issuer-paid credit rating agencies.
    bookChapters:
      - appM
    bookLabels:
      - sec:appm-reform-decay
    body: bodies/institutional-reform-decay.md
  - slug: institutional-selection-gating
    kind: institutional
    title: Selection Gating and the Certified Basin
    status: framework
    summary: 'Airworthiness certification paired with the near-universal requirement of insurance produces a genuine selection basin: an aircraft that fails certification cannot be deployed, because no insurer will cover it and no airport will schedule it.'
    decision: Assemble procurement, insurance, and licensing levers jointly rather than relying on any one of them — alignment is selected, not merely designed, only when the uncertified path is made more expensive than the certified one across all three.
    evidence: 'The airworthiness directive is the paradigm conductive artifact: terse, cross-role, and directly decision-changing, unlike a safety report no procurement officer is obligated to act on; the Institute of Nuclear Power Operations (founded after Three Mile Island) shows the same pattern via peer-inspection standards tied to insurance and licensing standing.'
    bookChapters:
      - appM
    bookLabels:
      - sec:appm-selection-gating
    body: bodies/institutional-selection-gating.md
  - slug: intervention-supported-unit-discovery
    kind: concept
    title: Intervention-Supported Unit Discovery
    status: plausible
    summary: Temporarily disabling a candidate channel and comparing what follows against a measured baseline of unperturbed repeats — not a fixed threshold — separates real coordination from ordinary workflow correlation in cases where passive clustering cannot.
    decision: When a passive correlation-based boundary estimate looks too coarse (an entire pipeline reads as one unit), do not tighten the threshold. Intervene on one candidate channel at a time and compare the outcome against a measured baseline, not an assumed one.
    evidence: Restricted testbeds with a known ground-truth partition and a scripted or model-driven multi-actor pipeline, run with and without a given channel disabled, replicated enough times to measure ordinary run-to-run variation before calling any post-intervention change a real effect.
    bookChapters:
      - ch07
    bookLabels:
      - ch:finding-boundary
      - sec:estimator-feasibility-recovery-ch07
    body: bodies/intervention-supported-unit-discovery.md
