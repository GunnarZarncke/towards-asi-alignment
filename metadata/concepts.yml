  - slug: scaffold-misuse
    kind: concept
    title: Scaffold Misuse
    status: framework
    summary: A model can refuse harm when asked bluntly and still be embedded in a scaffold that misrepresents the world and repurposes its honest output — so model-only evaluation passes while the composite loop does damage.
    decision: Before certifying a model, ask what the scaffold feeds it and what happens to its output afterward; a sound model inside a misaligned loop is still a boundary error.
    bookChapters:
      - ch01
    bookLabels:
      - ch:wrong-object
    body: bodies/scaffold-misuse.md
  - slug: scope-and-correction-capacity
    kind: concept
    title: Scope and the Correction-Capacity Assumption
    status: framework
    summary: The framework applies only while civilization still has enough capacity to notice, evaluate, and constrain frontier systems — this is a scope condition, not a guarantee.
    decision: Before applying any tool from this project, ask whether society can still notice relevant changes, interpret evidence, contest it, constrain deployment, and recover from a failed correction attempt.
    bookChapters:
      - ch05
    bookLabels:
