  - slug: correction-channel-integrity
    kind: concept
    title: Correction-Channel Integrity
    status: framework
    summary: Human correction must still causally change a system's future behavior before irreversible damage.
    decision: Before granting more autonomy, ask whether legitimate correction reaches the system with enough speed, bandwidth, independence, and effect.
    evidence: Evidence would include correction traces showing pre/post behavior change, latency, who controlled the handle, and where correction was ignored or merely acknowledged.
    bookChapters:
      - ch25
      - ch26
      - ch27
      - ch28
      - ch29
      - ch39
      - ch41
      - ch42
    bookLabels:
      - ch:correction-channel-integrity
      - sec:correction-channel-integrity-def
      - sec:minimal-causal-model
      - sec:operational-definition-ch36
    featured: true
    part: part06
    claimId: C-005
    body: bodies/correction-channel-integrity.md
    glossaryTerms:
      - term: Correction channel
        definition: 'Pathway by which legitimate human judgment reaches handles that change future behaviour before irreversible harm — observe → judge → deliberate → correct → update → act. Exists only when the correcting process controls real handles that reach later behaviour. **ch25** (`eq:handle-controlled-correction-channel-ch25`).'
      - term: Correction-channel integrity (CCI)
        definition: 'Trajectory-level certificate that the correction channel stays informative, timely, authoritative, and robust under pressure — not a single shutdown bit. Christiano dynamical corrigibility names the same crux at the basin metaphor; MIRI/CHAI corrigibility, shutdownability, and interruptibility are thinner projections. Formal home: **ch26** (`eq:correction-bottleneck-capacity`, `eq:cci-ch26`).'
      - term: Correction-audit evasion
        definition: 'Process that benefits from the appearance of correction while weakening real correction capacity — compliance theater on the correction host. Operational term; biological parasite metaphor in **ch36** only.'
