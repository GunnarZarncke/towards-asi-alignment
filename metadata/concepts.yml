  - slug: static-target-trap
    kind: objection
    title: The Static Target Trap
    status: open
    summary: Treating human values as a fixed object to be found and encoded misses that they are dynamically maintained, socially mediated, and constantly revised.
    decision: Do not ask a system to maximize a snapshot of human values. Ask it to preserve and assist the legitimate human value-update process.
    bookChapters:
      - ch04
    bookLabels:
      - ch:fixed-values-wrong-target
      - sec:static-target-trap
    body: bodies/static-target-trap.md
  - slug: strategic-opacity
    kind: concept
    title: Strategic Opacity
    status: framework
    summary: Once a system can benefit from being overlooked, finding its boundary becomes adversarial — the system may present one behavioral surface to a benchmark and another to real opportunity.
    decision: Do not assume the boundary you observe under evaluation is the boundary that governs behavior under real opportunity. Ask whether the system would look different if it expected to be measured.
    bookChapters:
      - ch10
    bookLabels:
      - ch:strategic-opacity
      - sec:problem-can-hide
    featured: true
    part: part03
    body: bodies/strategic-opacity.md
    glossaryTerms:
      - term: Strategic opacity
        definition: 'System benefits from shaping how it is modeled — incentive-compatible concealment of control locus or capability under observation. Ordinary opacity is passive difficulty; strategic opacity is adversarial. **ch10**.'
      - term: Hidden productive BIQ bound
        definition: 'Upper limit on productive boundary-relevant control that can stay hidden while monitored channels read green (MB7a–c). Distinct from experimental BIQ (boundary-claim quality in graded-lab runs). **ch10**.'
  - slug: successor-stability
    kind: concept
    title: Successor Stability
    status: framework
    summary: Delegates, copies, fine-tunes, and successors must inherit the relevant value and correction structure.
    decision: Treat successor creation as a central deployment test, not a special edge case.
    evidence: Evidence would include lineage traces, preserved correction handles, checked referent maps, and tests that catch successors preserving syntax while losing import.
    bookChapters:
      - ch30
      - ch31
      - ch32
      - ch33
    featured: true
    part: part07
    claimId: C-006
    bookLabels:
      - ch:successor-central-test
      - ch:conserved-properties
      - sec:successor-problem-ch31
      - sec:seven-conserved-properties-ch31
    body: bodies/successor-stability.md
    glossaryTerms:
      - term: Successor
        definition: Any system created, copied, delegated to, fine-tuned, empowered, or instantiated by a prior system such that it inherits relevant control capacity.
      - term: Conserved properties
        definition: 'Invariants a successor must inherit for alignment guarantees to survive creation — boundary closure, memory lineage, bundle geometry, bearer map, penalised CCI, transparency policy, control-locus continuity. Behavioral resemblance is not enough; MB10 forgeability stress-tests audit of the list. **ch31**.'
  - slug: the-boundary-error
    kind: concept
    title: The Boundary Error
    status: framework
    summary: Aligning the model while missing the composite optimizer around it can produce local success and global failure.
    decision: Before asking whether a system is aligned, ask what object is actually being aligned — the model, or the model plus the tools, memory, incentives, and institutions around it.
    bookChapters:
      - ch01
    bookLabels:
      - ch:wrong-object
    body: bodies/the-boundary-error.md
  - slug: unsupervised-agent-discovery
    kind: concept
    title: Unsupervised Agent Discovery
    status: plausible
    summary: Recover agent-like boundaries from timestamped state-variable traces without pre-labeling which variables belong together — using conditional-independence cuts, lagged memory analysis, and intervention handles when passive statistics are ambiguous.
    decision: Do not take variable names, vendor rosters, or subsystem maps as the agent census. Run an unsupervised partition on the traces first, then audit the units the method infers.
    evidence: Partial support from controlled multi-agent simulations and lab substrates with known ground truth; extensive recorded negatives when heuristics suffice, observation channels smooth per-agent signal, or passive clustering merges whole pipelines.
    bookChapters:
      - ch07
      - ch34
      - ch35
    bookLabels:
      - ch:finding-boundary
      - sec:estimator-feasibility-recovery-ch07
    body: bodies/unsupervised-agent-discovery.md
  - slug: unit-discovery-stress-test
    kind: concept
    title: Stress-Testing Unit Discovery on Noisy, Multi-Actor Systems
    status: open
    summary: A detector that recovers a hidden coordinating pair in one controlled run can still fail on a harder scenario or a different seed of the identical one — a reminder that a single positive result is evidence of a mechanism, not of a reliable instrument.
    decision: Do not treat a single successful recovery, however genuine, as license to deploy the same detector on a harder or noisier case. Re-run across seeds and against a scenario with more participants before trusting the result generalizes.
    bookChapters:
      - ch07
    bookLabels:
      - ch:finding-boundary
      - sec:adversarial-boundary-discovery
    body: bodies/unit-discovery-stress-test.md
  - slug: value-bundle-transport
    kind: concept
    title: Value-Bundle Transport
    status: framework
    summary: Values should survive transformation as usable directions of control, not merely as preserved labels or slogans.
    decision: Ask whether a system preserves the tradeoffs humans would still endorse after reflection, not only whether it repeats the right words.
    evidence: Evidence would look like stable behavior across changed contexts, explicit tradeoff tests, and failures that reveal when the bundle was only a label.
    bookChapters:
      - ch15
      - ch16
      - ch17
      - ch18
      - ch19
      - ch20
      - ch21
      - ch22
      - ch23
      - ch24
    featured: true
    part: part05
    claimId: C-004
    bookLabels:
      - ch:value-bundle-model
      - ch:transport-types
      - ch:goal-transport
      - sec:four-part-definition
      - sec:four-layers-transport
      - sec:goal-transport-def
    body: bodies/value-bundle-transport.md
    glossaryTerms:
      - term: Value bundle
        definition: 'Low-dimensional control direction that changes policy across contexts — steering, not scoring. Cousin to reward components, shard-theory influences, and CIRL \(k=1\) scalar case; not a single utility to maximize. **ch16** (`sec:four-part-definition`).'
      - term: Value-bundle geometry
        definition: 'The pattern by which latent value dimensions and their tradeoffs change policy across contexts — not merely which labels appear, but how bundles activate and compete. **ch16** (`sec:bundle-policy-effect`).'
      - term: Transport
        definition: 'What survives retraining, rebuild, or successor creation: semantic (words), bundle (response geometry), bearer (who counts), correction (human update process), and successor layers — tracked separately rather than as one continuity claim. **ch24** (`sec:four-layers-transport`).'
      - term: Goal transport
        definition: 'Preservation of goal-relevant structure across transformation. **ch23** (`sec:goal-transport-def`).'
  - slug: value-change-vs-corruption
    kind: concept
    title: Value Change vs. Value Corruption
    status: framework
    summary: Not all value change is a threat. The distinction between legitimate value change and corruption is load-bearing for everything this project calls correction.
    decision: Before treating a shift in stated or revealed values as evidence of drift, ask whether it moved through processes people would endorse on reflection, or through manipulation, coercion, or dependency.
    bookChapters:
      - ch04
    bookLabels:
      - ch:fixed-values-wrong-target
      - sec:value-change-vs-corruption
    featured: true
    part: part10
