    title: What the Book Is Not Claiming
    status: open
    summary: The manuscript offers a framework and conditional proof spine, not a proof that superintelligence alignment is solved.
    decision: Use the site as a map of cruxes and artifacts, not as a certificate that current systems are safe.
    evidence: The right evidence would discharge bridge assumptions in bounded deployment classes and show where the framework fails.
