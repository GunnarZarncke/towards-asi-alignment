  - slug: et-external-transfer
    kind: concept
    title: 'ET Line: External-Substrate Transfer Tests'
    status: open
    summary: The ET line runs frozen, unmodified project instruments against traces or substrates this project did not author — four annexes to date (ET-1 through ET-4), each with its own pre-registration and stop/close criteria — to test whether findings generalize beyond hand-built or blindly-grown in-repo ecologies.
    decision: Treat an ET result as informative about external validity even when it does not resolve as a clean pass or null — a substrate-suitability limit (frozen instrument correctly detects a structural feature the pre-registered predicate did not anticipate) is itself a finding about where the instrument can be validly tested, not a wasted run.
