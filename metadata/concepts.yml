concepts:
  - slug: adversarial-boundary-discovery
    kind: objection
    title: Adversarial Boundary Discovery
    status: open
    summary: A capable system may benefit from appearing less coherent, less continuous, or less autonomous than it is — passive boundary measurement then fails.
    decision: Do not trust a boundary estimate obtained through passive observation alone once a system could benefit from being misread. Ask what handles the evaluator actually has, and whether two different underlying systems could look identical through them.
    bookChapters:
      - ch07
    bookLabels:
      - ch:finding-boundary
      - sec:adversarial-boundary-discovery
    body: bodies/adversarial-boundary-discovery.md
  - slug: agent-detection-to-alignment-target
    kind: concept
    title: From Agent Detection to Alignment Target
    status: framework
    summary: Once an agent is defined by variables rather than appearance, degrees and scales of agency become measurable — and detection becomes the first step toward naming an alignment target.
    decision: When evaluating a system for alignment, first establish its degree and scale of agency using the variable-based definition, before asking whether it is aligned.
    bookChapters:
      - ch06
    bookLabels:
      - ch:agent-without-anthropomorphism
      - sec:degrees-of-agency
      - sec:agent-detection-to-alignment
    body: bodies/agent-detection-to-alignment-target.md
  - slug: agent-without-anthropomorphism
    kind: concept
    title: A Colder Definition of Agent
    status: framework
    summary: An agent is not first a person-like thing. It is a bounded control process whose boundary, memory, and action channels make its future more predictable when modeled as controlling something.
    decision: Do not decide whether something is an agent by whether it looks like one. Ask whether modeling it as a bounded process with internal state, interface, and control capacity improves prediction of its future behavior.
    bookChapters:
      - ch06
    bookLabels:
      - ch:agent-without-anthropomorphism
      - sec:colder-definition
    body: bodies/agent-without-anthropomorphism.md
    glossaryTerms:
      - term: Agent
        definition: A bounded dynamical process whose internal states help predict and control future interaction with its environment.
  - slug: alignment-as-measurement
    kind: concept
    title: Alignment as a Measurement Problem
    status: framework
    summary: The first alignment question is not whether a system is good, but where the effective optimizer actually is.
    decision: Before evaluating goals, corrigibility, or deception, ask which bounded subset of the world — in the operational, not metaphysical, sense — best predicts and controls the outcomes at stake.
    bookChapters:
      - ch01
    bookLabels:
      - ch:wrong-object
    body: bodies/alignment-as-measurement.md
    glossaryTerms:
      - term: Adversarial measurement
        definition: Inferring agency, goals, opacity, and successor risk when the system may benefit from confusing the measurement process.
