    part: part02
    claimId: C-003
    body: bodies/boundary-discovery.md
    glossaryTerms:
      - term: Boundary
        definition: 'Discoverable partition of internal, sensory, active, and external variables with approximate conditional independence at the interface (ε-MI cut). Friston Markov blanket is often theoretical; here the cut is a measurable audit object. Real boundaries leak.'
  - slug: boundary-residual
    kind: concept
    title: The Boundary Residual
    status: framework
    summary: How much information still leaks between the deep inside and deep outside of a candidate system once its sensory-active interface is fixed — low leakage means the interface actually screens inside from outside.
    decision: When auditing a candidate boundary, measure the leakage directly rather than accepting a boundary defined by convenience — a low residual means the interface actually screens inside from outside.
    bookChapters:
      - ch07
    bookLabels:
      - ch:finding-boundary
      - sec:boundary-residual
    body: bodies/boundary-residual.md
    glossaryTerms:
      - term: Boundary residual
        definition: Conditional mutual information between deep internal and external dynamics given the current sensory-active interface; the operational score for whether a candidate boundary actually separates inside from outside.
  - slug: capability
    kind: glossary
    status: framework
    term: Capability
    summary: The degree to which a system can predict and control relevant future states through its boundary, after accounting for memory cost and surprise.
    bookLabels:
