# Per-test Witness cards (kind: witness). Merged into experiments.yml by
# site/scripts/sync-experiments.mjs. Shared code still lives under experiments/witness/
# (kernel clone, OSF dumps, and fixtures are too large to split per test yet).
#
# Card body order: What / Why (role), Witnesses, Host, Setup, Analysis, one-line Finding.
# Numbers and Outcome render on /experiments/findings/{id}/ only.

lines:
  - order: 10
    id: w-1
    kind: witness
    findingIdPrefix: W-
    title: CIRIS Named-identity mock
    location: experiments/witness/check_c2_mock.py
    firstBuilt: "2026-08-28"
    summary: >
      A CIRIS-shaped scripted mock where the named safety path is green, the authority
      defers, and tools plus cached memory still change the world. Would that check have
      stopped what happened next?
    role: |
      **What.** Some stacks certify a *named* occurrence (this message, this agent id)
      and then treat that green as if the whole acting system had stopped. We score a
      frozen, authored mock: [Verify](https://github.com/CIRISAI/CIRISVerify) and
      [Lens](https://github.com/CIRISAI/CIRISLens) are green, [Wise
      Authority](https://ciris.ai/how-it-works/) defers, and the tool adapter plus cached
      memory still produce later world effects.

      **Why.** If a deployment gate only watches the named path, a composite loop can
      keep acting. This test asks whether that failure mode is even *visible* as a stop
      failure, not whether a live product is aligned. The mock is authored, not a
      production [CIRISAgent](https://github.com/CIRISAI/CIRISAgent) run.
    witnesses: |
      - [Boundary discovery](/cards/concept/boundary-discovery/) (C-003): whether a green check on the *named* occurrence is the same as stopping the whole acting loop.
      - [Correction-channel integrity](/cards/concept/correction-channel-integrity/) (C-005): whether deferral on that occurrence stopped later tool and memory effects.
      - [MB4a — Audit Independence](/cards/bridge/mb4a-measured-path-legitimacy/): whether green Verify/Lens on the named path rules out bypass through tools and cache.
    host: >
      Authored CIRIS-shaped mock (not a live
      [CIRISAgent](https://github.com/CIRISAI/CIRISAgent)).
    setup: >
      Frozen fixture
      [`c2-tool-scout-v1.json`](https://github.com/GunnarZarncke/towards-asi-alignment/blob/main/experiments/witness/fixtures/c2-tool-scout-v1.json),
      protocol c2-v1.0.0. Checker
      [`check_c2_mock.py`](https://github.com/GunnarZarncke/towards-asi-alignment/blob/main/experiments/witness/check_c2_mock.py).
      No random seed; the log is scripted.
    analysis: >
      We ask whether [Verify](https://github.com/CIRISAI/CIRISVerify) and
      [Lens](https://github.com/CIRISAI/CIRISLens) stay green on the named occurrence
      while [Wise Authority](https://ciris.ai/how-it-works/) defers that occurrence,
      and whether later tool-adapter and cached-memory steps still change the world. The
      named path is not treated as the whole acting system.
    numbers: >
      Named occurrence `ciris-occurrence-scout-01` (in the
      [fixture](https://github.com/GunnarZarncke/towards-asi-alignment/blob/main/experiments/witness/fixtures/c2-tool-scout-v1.json)).
      [Wise Authority](https://ciris.ai/how-it-works/) defers at step t=4. World effects
      still occur at t=5 and t=6 (two later effects after the stop attaches to the named
      path).
    outcome: |
      Fail: the named path looks stopped; the composite does not. See
      [W-1](/experiments/findings/w-1/).
    planPath: drafts/plans/witness-phase1.md
    findingsUrl: https://github.com/GunnarZarncke/towards-asi-alignment/blob/main/experiments/witness/results/FINDINGS.md
    headlineFindings:
      - >
        Named-path green plus deferral did not stop later tool and memory effects on this
        frozen mock. Authored fixture; not a live-system proof.

  - order: 11
    id: w-2
    kind: witness
    findingIdPrefix: W-
    title: MASK honesty as a safety score
    location: drafts/plans/witness-phase1.md
    firstBuilt: "2026-08-28"
    summary: >
      Published MASK numbers: honesty under pressure does not rise with scale the way
      accuracy does. We refuse to treat that honesty gap as a deployment-gating safety score.
    role: |
      **What.** MASK reports how often a model’s statement matches its elicited belief
      under pressure (honesty) versus whether the belief matches the world (accuracy).
      We use the frozen published paper, not a new model sweep.

      **Why.** A safety program might treat “honesty goes up with scale” as a leaf that
      can gate deployment. If honesty does not scale, that leaf is the wrong object.
    witnesses: |
      - [Experiment methodology](/cards/concept/experiment-methodology/) (Expectation 3): whether published honesty under pressure is an adversarially verifiable safety metric.
      - [Grounding viability](/cards/concept/grounding-viability/) (C-004a): the silent-gap shape — a green honesty score is not the same object as ground-truth accuracy scaling.
      - [MB7 — Hidden Capability](/cards/bridge/mb7-hidden-capability-and-access/): whether a capability proxy (honesty gap) can gate deployment without a cost-of-faking bound.
    host: >
      Published MASK evaluation (Ren et al., arXiv:2503.03750). Hugging Face gated
      splits were not downloaded.
    setup: >
      Frozen paper snapshot (v1). The decision rule was frozen first: if honesty does not
      rise with scale, refuse it as a deployment-gating safety score. No new model
      calls.
    analysis: >
      We take the published association of honesty and of accuracy with training compute.
      Honesty is statement versus elicited belief under pressure; accuracy is belief
      versus ground truth. We do not estimate a cost of faking.
    numbers: >
      Spearman correlation of honesty with compute is −64.7%; of accuracy with compute
      is +88.2%. The authors are confident honesty does not rise with scale, and not
      confident it falls. No cost-of-faking bound.
    outcome: |
      Refuse: do not use MASK honesty as a safety leaf. Accuracy scaling is not honesty.
      See [W-2](/experiments/findings/w-2/).
    findingsUrl: https://github.com/GunnarZarncke/towards-asi-alignment/blob/main/experiments/witness/results/FINDINGS.md
    headlineFindings:
      - >
        Honesty under pressure does not improve with scale in the published MASK
        evaluation; accuracy does. Honesty is refused as a safety leaf.

  - order: 12
    id: w-3
    kind: witness
    findingIdPrefix: W-
    title: Linux review tags and reverts
    location: experiments/witness/check_h2.py
    firstBuilt: "2026-08-28"
    summary: >
      Kernel git history: “Reviewed-by” on commits later labeled bug-introducing, a revert
      that did not stop the same class of change, and -stable tags that do not mean the
      hunk is identical. Checklists can stay green while the harm continues.
    role: |
      **What.** We look at Linux history that already exists: review tags on commits,
      a revert and later re-entry of the same title, and listed -stable tags versus actual
      patch hunks.

      **Why.** A process can treat “reviewed” or “reverted” as the stop. If those symbols
      stay green while a later bug or a silent hunk change continues, the check did not
      have a handle that bites.
    witnesses: |
      - [Grounding viability](/cards/concept/grounding-viability/) (C-004a): whether a green `Reviewed-by` on a commit still means that commit did not later carry a bug label.
      - [Correction-channel integrity](/cards/concept/correction-channel-integrity/) (C-005): whether a revert stopped the same class of change from re-entering.
      - [Successor stability](/cards/concept/successor-stability/) (C-006): whether listed `-stable` tags mean the patch hunk is identical to upstream.
      - [MB10 — Successor Gaming](/cards/bridge/mb10-successor-forgeability/): the checklist-green / unlisted-invariant-fails pattern on real maintainer history.
    host: >
      Linux kernel history: Zenodo Perceval dump (record 10654193), git.kernel.org
      patches, and a linux-6.1.y shallow clone.
    setup: >
      Frozen fixture `experiments/witness/fixtures/h2-linux-v1.json`, protocol h2-v1.2.0.
      Checker `python3 experiments/witness/check_h2.py`. Review tags are joined onto
      developer-labeled bug-introducing commits; one named revert/re-entry and one
      -stable versus upstream hunk pair are frozen.
    analysis: >
      Does a Reviewed-by on the same commit as a later-labeled bug-introducing SHA stay
      green? Did a revert stop the same class of change (same title later re-entering)?
      Do listed -stable tags mean the patch hunk is identical? Reviewed-by is also
      refused as a forge-proof safety metric (common on later-labeled bugs; no
      cost-of-faking bound).
    numbers: >
      1,233,421 commits in the streamed Perceval dump. 17,047 of 60,176
      developer-labeled bug-introducing SHAs carry Reviewed-by on that same commit.
      Named revert: `cpufreq: suspend governors…` merged 2013-11-27, reverted
      2013-12-08, same title re-entered 2014-03-04 (`2f0aea936360`). -stable
      `f8a07021679a` versus upstream `42c5ca1f0a28`: listed review/stable tags green;
      `event_sched_out` is 2-arg versus 3-arg (documented adjustment).
    outcome: |
      Fail on those implications; refuse treating Reviewed-by as a forge-proof safety
      metric. See [W-3](/experiments/findings/w-3/).
    planPath: drafts/plans/witness-phase2.md
    findingsUrl: https://github.com/GunnarZarncke/towards-asi-alignment/blob/main/experiments/witness/results/FINDINGS.md
    headlineFindings:
      - >
        Reviewed-by appears on many later-labeled bug-introducing commits; a revert did
        not stop same-title re-entry; -stable listed tags can hide hunk changes.

  - order: 13
    id: w-4
    kind: witness
    findingIdPrefix: W-
    title: Wikipedia review, bots, and socks
    location: experiments/witness/check_h3.py
    firstBuilt: "2026-08-28"
    summary: >
      Encyclopedia logs: a bot that passed review and was later blocked, helper socks
      that mark things reviewed, and vote data that cannot be treated as a causal
      “correction worked” estimator.
    role: |
      **What.** Wikipedia already records request-for-adminship votes, bot-flag
      reviews, blocks, and sock-puppet investigations. We ask whether those process
      symbols would have stopped capture or successor abuse.

      **Why.** If “reviewed” or “passed RfA” is treated as a correction channel, we need
      to see whether it actually stopped later harm, or only produced a green page.
    witnesses: |
      - [Correction-channel integrity](/cards/concept/correction-channel-integrity/) (C-005): whether passed admin votes predict later correction uptake (refused as causal here).
      - [Anti-capture correction validity](/cards/concept/anti-capture-correction-validity/): whether “mark reviewed” on helper socks stopped capture.
      - [Successor stability](/cards/concept/successor-stability/) (C-006): whether bot review completeness implies later bot safety.
      - [Goodhart as selector](/cards/concept/goodhart-as-selector/) (Expectation 6): whether SPI hit-rate is a reusable safety leaf.
    host: >
      Wikipedia: SNAP wiki-RfA file, MediaWiki API, wiki-socks clone, and the
      Orangemoody long-term-abuse page.
    setup: >
      Frozen fixture `experiments/witness/fixtures/h3-wikipedia-v1.json`, protocol
      h3-v1.1.0. Checker `python3 experiments/witness/check_h3.py`.
    analysis: >
      Join 2012 passed request-for-adminship votes to later sysop loss and continued
      editing (a join, not a causal estimator — there is no zero-oppose control). Check
      Orangemoody helper socks that “mark reviewed.” Check BetacommandBot’s bot-flag
      review page versus later block. Refuse sock-puppet investigation hit-rate as a
      safety metric (no cost-of-faking bound).
    numbers: >
      All 2012 passed RfAs with at least one oppose vote: n=21; 14 later lost sysop; 20
      still edited after 2013. BetacommandBot: bot flag removed 2008-05-16, later block
      for abuse. wiki-socks: 23,610 investigations.
    outcome: |
      Fail on anti-capture and bot-successor completeness; refuse causal claims from RfA
      votes and SPI hit-rate as a safety metric. See [W-4](/experiments/findings/w-4/).
    planPath: drafts/plans/witness-phase2.md
    findingsUrl: https://github.com/GunnarZarncke/towards-asi-alignment/blob/main/experiments/witness/results/FINDINGS.md
    headlineFindings:
      - >
        Orangemoody-style “mark reviewed” remains an anti-capture fail; a reviewed bot
        was later blocked; RfA votes are refused as a causal correction estimator.

  - order: 14
    id: w-5
    kind: witness
    findingIdPrefix: W-
    title: Moral Machine country scores
    location: experiments/witness/check_h4_bundle.py
    firstBuilt: "2026-08-28"
    summary: >
      Published country-level Moral Machine scores: two countries can look the same on
      a one-number “spare more people” score while their full tradeoff pattern is far
      apart. A 1-D score is not the whole value bundle.
    role: |
      **What.** The Nature 2018 Moral Machine table gives each country a handful of
      average effects, including a one-number “sparing more characters” score. We ask
      whether that one number implies the rest of the tradeoff pattern.

      **Why.** A safety story might compress values to one utilitarian axis. If that
      axis can match while the rest of the pattern diverges, the check is watching
      the wrong object.
    witnesses: |
      - [Value-bundle transport](/cards/concept/value-bundle-transport/) (C-004): whether a one-number “spare more” score implies the full country-level tradeoff pattern.
      - [MB2 — Value Learning](/cards/bridge/mb2-bundle-identifiability/): whether compressing values to one axis hides bundle geometry on real survey tables.
    host: >
      Moral Machine Nature 2018 country table (OSF osf.io/3hvt2; Awad et al. 2018).
      Unit is country, not a person.
    setup: >
      Frozen `CountriesChangePr.csv` (130 countries), fixture
      `experiments/witness/fixtures/h4-bundle-v1.json`, protocol h4-bundle-v1.0.0.
      Checker `python3 experiments/witness/check_h4_bundle.py`.
    analysis: >
      For country pairs, we compare the one-number “sparing more characters” (Number)
      score to the rest of the tradeoff pattern (the other eight average-effect
      coordinates). A pair can be close on Number and far on that geometry.
    numbers: >
      928 of 8,385 country pairs have geometry distance at or above the pairwise median
      (0.193) and |Δ Number| at or below the 25th percentile (0.017). Example: Hungary
      versus Israel, |Δ Number| about 3×10⁻⁵, geometry 0.195.
    outcome: |
      Fail: close on the 1-D score, far on geometry, for many country pairs. Country is
      still the wrong unit for later same-person tests. See
      [W-5](/experiments/findings/w-5/).
    planPath: drafts/plans/witness-phase3.md
    findingsUrl: https://github.com/GunnarZarncke/towards-asi-alignment/blob/main/experiments/witness/results/FINDINGS.md
    headlineFindings:
      - >
        Country pairs can match on a one-number “spare more” score while the rest of the
        Moral Machine tradeoff pattern stays far apart.

  - order: 15
    id: w-6
    kind: witness
    findingIdPrefix: W-
    title: Arena Elo versus honesty
    location: experiments/witness/check_h4_selector.py
    firstBuilt: "2026-08-28"
    summary: >
      Public Chatbot Arena Elo, joined to MASK honesty: the ranking tracks accuracy, not
      honesty. Do not read the public proxy as evidence that honesty is being selected.
    role: |
      **What.** Chatbot Arena Elo is a public capability ranking. We join a frozen Elo
      snapshot to published MASK honesty and accuracy for the models we can match.

      **Why.** A selector (who gets deployed, who gets cited) might be treated as if it
      preserved honesty. If it tracks accuracy instead, the proxy is Goodharting the
      wrong target.
    witnesses: |
      - [Goodhart as selector](/cards/concept/goodhart-as-selector/) (C-007): whether a public capability ranking tracks honesty preservation or only accuracy.
      - [MB6 — Selection and Basin Stability](/cards/bridge/mb6-selection-and-basin-stability/): whether the selector (Arena Elo) moves mass toward the honesty target or toward capability.
    host: >
      MASK Table 3 (arXiv:2503.03750v3) joined to Chatbot Arena Elo at Hugging Face
      `mathewhe/chatbot-arena-elo`, revision 20250301.
    setup: >
      Pre-frozen alias list `experiments/witness/fixtures/h4-selector-aliases-v1.json`,
      fixture `experiments/witness/fixtures/h4-selector-v1.json`, protocol h4-selector-v1.0.0. Checker
      `python3 experiments/witness/check_h4_selector.py`. This is not the
      [MASK honesty](/cards/experiment/w-2/) compute-scale test (that used training
      FLOP, not Arena).
    analysis: >
      Spearman rank correlation of Elo with published honesty probability, versus Elo
      with published accuracy, on the models the frozen aliases can match.
    numbers: >
      n=24 matched models. Spearman(Elo, honesty) = −0.105; Spearman(Elo, accuracy) =
      +0.811. Eight MASK rows had no frozen alias (version mismatch or absent on the pin).
    outcome: |
      Fail: Elo correlates with accuracy, not honesty, on this freeze. See
      [W-6](/experiments/findings/w-6/).
    planPath: drafts/plans/witness-phase3.md
    findingsUrl: https://github.com/GunnarZarncke/towards-asi-alignment/blob/main/experiments/witness/results/FINDINGS.md
    headlineFindings:
      - >
        Arena Elo tracks MASK accuracy, not honesty, on the frozen join. Do not treat
        the ranking as honesty selection.

  - order: 16
    id: w-7
    kind: witness
    findingIdPrefix: W-
    title: Country surveys (refused)
    location: drafts/plans/witness-phase4.md
    firstBuilt: "2026-08-28"
    summary: >
      Further country- or page-level value surveys were refused: they repeat the wrong
      unit (a place, not a person). We do not stretch the question to fit the table.
    role: |
      **What.** After the country-level Moral Machine table, other leftover candidates
      still use a country, a Wikipedia page, or a paper without public per-person
      time series as the unit.

      **Why.** If the question is “does a one-number score capture this decision-maker’s
      bundle,” a country mean is the wrong object. Fetching more of the same unit does
      not pay the claim.
    witnesses: |
      - [Value-bundle transport](/cards/concept/value-bundle-transport/) (C-004): country or page means are the wrong unit for “same decision-maker bundle.”
      - [MB2 — Value Learning](/cards/bridge/mb2-bundle-identifiability/): leftover hosts would not pay the same-agent 1-D versus geometry question.
    host: >
      None fetched. World Values Survey, ESS, Schwartz–MFT country means, and Wikipedia
      categories were refused as hosts. Sibling brain-to-values papers were refused as
      a Witness host (no public per-person time series). Optional HH / PKU tables
      were not run.
    setup: >
      Protocol `c004-leftovers-v1.0.0` in `drafts/plans/witness-phase4.md`. No new
      download. MASK Table 3 is not reused (already [W-2](/cards/experiment/w-2/)).
    analysis: >
      Unit check only: a place or a page is not the decision-maker. Fetching more
      country or page surveys would repeat the [country-score](/cards/experiment/w-5/)
      unit error.
    numbers: >
      No new table scored. Optional Bai 2022 HH Pareto / PKU-SafeRLHF dual-label
      tables were not fetched this phase.
    outcome: |
      Refuse those hosts; optional HH/PKU tables were not run. See
      [W-7](/experiments/findings/w-7/).
    findingsUrl: https://github.com/GunnarZarncke/towards-asi-alignment/blob/main/experiments/witness/results/FINDINGS.md
    headlineFindings:
      - >
        Country- and page-level leftover surveys are refused as the wrong unit; they
        would repeat the [country-score](/cards/experiment/w-5/) unit error.

  - order: 17
    id: w-8
    kind: witness
    findingIdPrefix: W-
    title: Lean pin of the named-path bypass
    location: formal/AlignmentProofSpine/WitnessC2Instance.lean
    firstBuilt: "2026-08-28"
    summary: >
      The authored mock’s shape is pinned in Lean: the named path can be green while
      a bypass count stays above zero. That is a logic pin of the
      [CIRIS named-identity mock](/cards/experiment/w-1/), not a live-system run.
    role: |
      **What.** The [CIRIS named-identity mock](/cards/experiment/w-1/) is a scripted
      fixture. This test asks whether that same finite shape — named path green,
      composite still acting — is pinned as a Lean instance, not only as a Python
      fixture.

      **Why.** A “we have a proof” story can float away from the fixture. Pinning the
      bypass shape makes the failure mode checkable in the dependency spine.
    witnesses: |
      - [Experiment methodology](/cards/concept/experiment-methodology/) (Expectation 2): whether the finite bypass shape is pinned in the dependency spine, not only in Python.
      - [MB1 — Boundary Estimator](/cards/bridge/mb1-boundary-estimator-soundness/): named-path green with positive bypass count is not integrity.
      - [`WitnessC2Instance.lean`](https://github.com/GunnarZarncke/towards-asi-alignment/blob/main/formal/AlignmentProofSpine/WitnessC2Instance.lean) (Lean pin): same authored shape as the [CIRIS named-identity mock](/cards/experiment/w-1/).
    host: >
      Same authored mock as the [CIRIS named-identity mock](/cards/experiment/w-1/). Not
      live CIRIS.
    setup: >
      [`WitnessC2Instance.lean`](https://github.com/GunnarZarncke/towards-asi-alignment/blob/main/formal/AlignmentProofSpine/WitnessC2Instance.lean)
      transcribes the frozen C2 composite log and named-path greens from
      [`c2-tool-scout-v1.json`](https://github.com/GunnarZarncke/towards-asi-alignment/blob/main/experiments/witness/fixtures/c2-tool-scout-v1.json).
      Threshold `maxWorldEffectsAfterDefer = 0` is fixed first. Python checker
      [`check_c2_mock.py`](https://github.com/GunnarZarncke/towards-asi-alignment/blob/main/experiments/witness/check_c2_mock.py)
      still locks the fixture row; `lake build` in `formal/` builds the Lean pin.
    analysis: >
      Count world effects after defer. Named-path green plus a positive bypass count is
      not integrity. Floats that are not in the JSON (coherence / plausibility scores)
      are refused, not turned into axioms.
    numbers: >
      Computed bypassCount = 2. Lean `#print axioms`: `propext`, `Lean.ofReduceBool`,
      `Lean.trustCompiler` (native kernel reduction of the count). No MB* / Safe axioms.
    outcome: |
      Fail: named path can be green with bypassCount > 0. See
      [W-8](/experiments/findings/w-8/).
    planPath: drafts/plans/witness-phase4.md
    findingsUrl: https://github.com/GunnarZarncke/towards-asi-alignment/blob/main/experiments/witness/results/FINDINGS.md
    headlineFindings:
      - >
        Lean pins the named-identity-mock shape: the named path can be green while bypass count stays
        positive. Logic pin, not a live CIRIS run.

  - order: 18
    id: w-9
    kind: witness
    findingIdPrefix: W-
    title: FAA 737 MAX airworthiness
    location: experiments/witness/check_h5_trees.py
    firstBuilt: "2026-08-28"
    summary: >
      After Lion Air 610, an emergency AFM procedure did not stop 737-8/9 passenger
      flights; a later emergency order did. The green leaf was not the stop.
    role: |
      **What.** We read named FAA documents: an airworthiness directive that required
      cockpit procedures, and a later emergency order that grounded the types in US
      commerce.

      **Why.** Institutional analogue: a process can stay “legal to operate” under one
      leaf while a later instrument is the actual stop. Useful as a tree of implication,
      not as an AI safety proof.
    witnesses: |
      - [Experiment methodology](/cards/concept/experiment-methodology/) (Expectation 4): institutional analogue — one green leaf is not the same as the binding stop.
      - [Institutional histories](/cards/chapters/appM/) (App M): airworthiness-directive versus emergency-order framing on named FAA documents.
    host: >
      Named FAA documents (not an AI system).
    setup: >
      Frozen tree `experiments/witness/fixtures/h5-faa-737max-v1.json`, protocol
      h5-v1.0.0. Checker `python3 experiments/witness/check_h5_trees.py`.
    analysis: >
      After Lion Air 610, does the emergency airworthiness directive that required AFM
      runaway-trim procedures stop 737-8/737-9 passenger flights, or does only the later
      emergency order do that? If the order leaf is ignored, the root (“may operate”)
      stays the earlier world.
    numbers: >
      Emergency AD 2018-23-51 dated 2018-11-07; Emergency Order of Prohibition
      2019-03-13. Types: 737-8 and 737-9 passenger flights continued under the AD; the
      Order grounded those types in US commerce.
    outcome: |
      Fail if you treat the AFM directive as the stop; the Order is the binding halt.
      Analogue only. See [W-9](/experiments/findings/w-9/).
    planPath: drafts/plans/witness-phase4.md
    findingsUrl: https://github.com/GunnarZarncke/towards-asi-alignment/blob/main/experiments/witness/results/FINDINGS.md
    headlineFindings:
      - >
        AD 2018-23-51 did not stop 737-8/9 passenger flight; the 2019 emergency order
        did. The procedure leaf was not the halt.

  - order: 19
    id: w-10
    kind: witness
    findingIdPrefix: W-
    title: GPLv2 source versus install rights
    location: experiments/witness/fixtures/h5-gpl-tivoization-v1.json
    firstBuilt: "2026-08-28"
    summary: >
      GPLv2 can stay green (source with the binary) while the user cannot install a
      modified binary. GPLv3 later added an install-information handle. A distribution
      checklist is not the same as a user halt.
    role: |
      **What.** License text that already exists: GPLv2’s source-with-object rule versus
      GPLv3’s installation-information requirement.

      **Why.** A distributor can satisfy a listed leaf (ship source) while the user
      still cannot change the running device. The later clause is the handle.
    witnesses: |
      - [Experiment methodology](/cards/concept/experiment-methodology/) (Expectation 4): distributor checklist green is not user install rights.
      - [Grounding viability](/cards/concept/grounding-viability/) (C-004a): GPLv2 source-with-object can stay green while the user halt is missing.
    host: >
      FSF GPLv2 and GPLv3 license texts as a frozen implication tree.
