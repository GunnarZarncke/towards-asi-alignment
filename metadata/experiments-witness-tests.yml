  - order: 21
    id: w-12
    kind: witness
    findingIdPrefix: W-
    title: Moral Machine same-person choices
    location: experiments/witness/check_h4_mm_raw.py
    firstBuilt: "2026-08-28"
    summary: >
      Individual Moral Machine respondents: a many-feature pattern of their choices
      predicts held-out choices better than a one-number “spare more people” score.
      The 1-D score is not the same-person policy.
    role: |
      **What.** Raw Moral Machine choices, one person at a time, not country averages.
      We fit a simple pattern of feature effects and ask whether it beats a one-number
      score and a person intercept on held-out choices.

      **Why.** [Moral Machine country scores](/cards/experiment/w-5/) showed country
      compression can hide geometry. This test asks the same question at the unit that
      actually chooses.
    witnesses: |
      - [Value-bundle transport](/cards/concept/value-bundle-transport/) (C-004): a one-number “spare more” score is not the same-person policy.
      - [MB2 — Value Learning](/cards/bridge/mb2-bundle-identifiability/): many-feature geometry beats the 1-D leaf on held-out choices at the person unit.
    host: >
      Moral Machine raw SharedResponses on OSF osf.io/3hvt2 (Awad et al. 2018). Unit is
      UserID, not country.
    setup: >
      Frozen protocol h4-mm-raw-v1.0.0, fixture
      `experiments/witness/fixtures/h4-mm-raw-v1.json`. Checker
      `python3 experiments/witness/check_h4_mm_raw.py`. Complete pairs only; units with
      at least 8 pairs; seed-7 cap on how many units are scored. Traffic-dilemma class
      only.
    analysis: >
      Held-out mean accuracy for a person intercept, a Number-only (“spare more”) score,
      and a many-feature geometry. Frozen margins: geometry must beat both by at least
      0.05. Unit bootstrap (1000 draws, seed 7) for those margins. Number is collinear
      with the type-count features, so a joint fit of Number versus types is not
      identified.
    numbers: >
      33,953,503 complete pairs; 1,850,854 units with at least 8 pairs; seed-7 cap
      20,000 units. Held-out mean accuracy: intercept 0.529, Number 1-D 0.576, geometry
      0.682. Geometry beats 1-D by 0.106 and intercept by 0.153. Bootstrap 95%
      intervals 0.102–0.109 and 0.149–0.157; every replicate still clears 0.05.
      Geometry without Number matches geometry (0.682).
    outcome: |
      Fail of Number-only as the same-person policy; pass of detecting a wider pattern.
      Traffic dilemmas only. See [W-12](/experiments/findings/w-12/).
    planPath: drafts/plans/witness-c004-raw.md
    findingsUrl: https://github.com/GunnarZarncke/towards-asi-alignment/blob/main/experiments/witness/results/FINDINGS.md
    headlineFindings:
      - >
        Same-person Moral Machine geometry predicts held-out choices better than a
        Number-only score or a person intercept on this freeze.

