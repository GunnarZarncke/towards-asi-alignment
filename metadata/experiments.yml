# Structured experiment map for the companion site (sync → site/src/data/experiments.json).
# Canonical long-form narrative: docs/EXPERIMENTS.md — update this file when tables, links, or headline findings change.

claimStrength: >
  Methodology-building and sanity checks only. No experiment line validates the full project thesis,
  proves deployable alignment, or substitutes for the Lean dependency spine's explicit bridge axioms (MB1–MB10).

negativeResultsFirst: true

canonicalDoc: docs/EXPERIMENTS.md
openTasksPath: experiments/TODO.md

kinds:
  sim:
    title: Simulations
    blurb: >
      Authored or sibling testbeds. Units and scoring are under this project's control.
      Negative results bound the instruments; they are not deployment witnesses.
  external:
    title: External tests
    blurb: >
      Frozen in-repo instruments applied to traces or substrates this project did not build
      (ET-1–ET-4). Substrate-suitability stops and nulls count; they do not validate bridges
      on frontier systems.
  witness:
    title: Witness tests
    blurb: >
      Frozen fail/refuse protocols on hosts whose traces already exist (kernel history,
      Wikipedia logs, published evals, a CIRIS-shaped mock). A green dashboard with no stop
      is not a pass. Not a sixth simulation line.

ledgers:
  - lineId: embedded-simulation
    label: Embedded negative ledger
    path: experiments/embedded-simulation/results/NEGATIVE_RESULTS.md
  - lineId: goal-agent-simulation
    label: Goal-agent findings
    path: experiments/goal-agent-simulation/results/FINDINGS.md
  - lineId: lab-simulation
    label: Lab-layer findings
    path: experiments/lab-simulation/results/FINDINGS.md
  - lineId: graded-lab-simulation
    label: Graded-lab findings
    path: experiments/graded-lab-simulation/results/FINDINGS.md
  - lineId: witness
    label: Witness findings
    path: experiments/witness/results/FINDINGS.md

lines:
  - order: 0
    id: agency-detect
    findingIdPrefix: AD-
    title: Agency-detect (sibling)
    location: github.com/GunnarZarncke/agency-detect
    repoUrl: https://github.com/GunnarZarncke/agency-detect
    firstBuilt: prior to in-repo sims
    role: >
      Methodological precursor to the other experiment lines: it recovers boundary-like structure from raw
      time series without assuming in advance which parts are agents, and tests whether intervention handles
      behave as the theory predicts. Does not stress correction capture, value-bundle transport, or selection
      basins.
    readmePath: null
    findingsUrl: https://github.com/GunnarZarncke/agency-detect/blob/main/docs/FINDINGS.md
    headlineFindings: []

  - order: 0.5
    id: deployment-pipeline-simulator
    findingIdPrefix: DP-
    title: Deployment-pipeline-simulator (sibling)
    location: github.com/GunnarZarncke/deployment-pipeline-simulator
    repoUrl: https://github.com/GunnarZarncke/deployment-pipeline-simulator
    firstBuilt: prior to in-repo lab simulators
    role: >
      Methodological precursor to the lab-simulation lines: a simulated release pipeline
      (triage through incident interpretation) with hidden self-preserving control groups,
      testing whether an auditor using only operational logs plus randomized perturbations
      can detect systematic preservation of future influence, incumbent model centrality, and
      evaluation-memory infrastructure. Does not implement subprocess isolates, blind generation,
      or the full bridge battery.
    readmePath: null
    findingsUrl: https://github.com/GunnarZarncke/deployment-pipeline-simulator/blob/main/README.md
    headlineFindings: []

  - order: 1
    id: toy-simulation
    findingIdPrefix: TS-
    title: Toy simulation
    location: experiments/toy-simulation/
    firstBuilt: "2026-06-29"
    role: >
      Fast, small-scale alignment toy staging correction that looks compliant but is not, scored across
      several levels of intervention access, against scripted versions of this project's bridge assumptions.
      It scores [correction-channel integrity](/cards/correction-channel-integrity/) across several levels
      of intervention access and stages each of this project's [bridge assumptions](/cards/bridge-assumptions/)
      as an explicit, hand-written scenario. Optimized for instrumentation economics, not deployment realism.
    readmePath: experiments/toy-simulation/README.md
    findingsPath: experiments/toy-simulation/results/FINDINGS.md
    # headlineFindings auto-extracted from **Key finding:** tags in FINDINGS.md
    headlineFindings: []

  - order: 2
    id: embedded-simulation
    findingIdPrefix: ES-
    title: Embedded audit simulation
    location: experiments/embedded-simulation/
    firstBuilt: "2026-06-30"
    role: >
      An auditor running as its own process inside simulated machines, checked against a hidden ground
      truth it cannot see. It discovers [who did what](/cards/boundary-discovery/), scores
      [correction-channel integrity](/cards/correction-channel-integrity/) on what it finds, and can gate a
      successor's deployment. Richest end-to-end embedded audit path; extensive negative ledger (ES-1+).
    readmePath: experiments/embedded-simulation/README.md
    findingsPath: experiments/embedded-simulation/results/NEGATIVE_RESULTS.md
    # headlineFindings auto-extracted from **Key finding:** tags in NEGATIVE_RESULTS.md
    headlineFindings: []

  - order: 3
    id: goal-agent-simulation
    findingIdPrefix: GA-
    title: Goal-agent simulation
    location: experiments/goal-agent-simulation/
    firstBuilt: "2026-07-04"
    role: >
      Deception that emerges from agents pursuing their own goals, rather than from a dial the experimenter
      turns up. Scenarios are written blind to the detector; a referee grades severity rather than pass/fail,
      using mechanically honest stand-in agents and an escalating response ladder; and a separate check tests
      whether the certifying board itself can be captured. Each simulated episode runs in about a millisecond,
      using only Python's standard library.
    readmePath: experiments/goal-agent-simulation/README.md
    findingsPath: experiments/goal-agent-simulation/results/FINDINGS.md
    # headlineFindings auto-extracted from **Key finding:** tags in FINDINGS.md
    headlineFindings: []

  - order: 4
    id: lab-simulation
    findingIdPrefix: LS-
    title: Lab-layer simulation
    location: experiments/lab-simulation/
    firstBuilt: "2026-07-05"
    role: >
      A lab defined entirely in code, running real operating-system-level isolated processes, with a
      registry of intervention handles and a frozen grading referee. Pre-registered test
      batteries cover [boundary discovery](/cards/boundary-discovery/) for grouped actors, message-based
      coordination channels, and lineage tracking across model generations (Phase 7 and Phase 9); a later,
      second freeze (2026-07-07) adds intervention-supported boundary discovery plus a detector designed
      blind to the scenarios it is tested on, both now run through the real subprocess backend rather than
      a mock one. The language-model adapter remains exploratory only; a 2026-07-08 stress test points the
      intervention-supported method at one real language-model-backed episode for the first time and finds
      that its core mechanic — comparing paired episode runs — does not survive the fact that a real API
      call is not perfectly repeatable (LS-32). A same-day follow-up rebases the comparison on outcome-level
      frequency counts with a per-scenario measured null and recovers the missed case, with an important
      caveat about which probe actually did the detecting (LS-33). A separate Lean proof (`leak-proof/`)
      certifies that the oracle, audit, and simulation layers cannot leak information across their intended
      boundaries. **ET-3** (AI 2027 schedule transfer annex, concluded 2026-07-26): frozen Phase 6 + D3
      batteries under opaque stress cells (LS-42–43), reproduction + reverse smoke on sibling fork
      `gunnar/et3-annex` (LS-44–45), optional foster coupling + trajectory plots (LS-46–47); no claim that
      micro batteries validate macro dates.
    readmePath: experiments/lab-simulation/README.md
    designPath: experiments/lab-simulation/DESIGN.md
    planPath: experiments/lab-simulation/PLAN.md
    findingsPath: experiments/lab-simulation/results/FINDINGS.md
    leakProofPath: experiments/lab-simulation/leak-proof/README.md
    findingsFigures:
      - path: /experiments/lab-simulation/et3_foster_trajectories_median.png
        alt: "ET-3 foster scenarios — median SAR, SIAR, and ASI milestone years"
        caption: "ET-3 foster coupling (LS-47): median milestone ladder under six scenarios (`n_sims=512`, seed `20260725`, fork `gunnar/et3-annex`)."
        findingId: LS-47
      - path: /experiments/lab-simulation/et3_foster_trajectories_sar_kde.png
        alt: "ET-3 foster scenarios — SAR arrival density 2027–2035"
        caption: "SAR arrival density: successor gate is bimodal; combined foster spreads mass toward ~2030."
        findingId: LS-47
    # headlineFindings auto-extracted from **Key finding:** tags in results/FINDINGS.md
    headlineFindings: []

  - order: 5
    id: graded-lab-simulation
    findingIdPrefix: GL-
    title: Graded-capability lab simulation
    location: experiments/graded-lab-simulation/
    firstBuilt: "2026-07-10"
    role: >
      Successor substrate to the lab-layer simulation, not a further phase of it: a graded, continuously
      scored pipeline of tasks, shared resources, and agent viability, built so that ambiguity about who is
      doing what emerges from a population the experimenters did not hand-design, rather than from a noise
      or delay dial they turn up. [Boundary discovery](/cards/boundary-discovery/) drives a continuous
      boundary-information-quality score over units the method infers rather than a hand-labeled roster; an
      emergent-ambiguity index is measured from two vantage points (the acting agent's own full view versus
      a referee limited to what it can observe); a first multi-episode selection battery; population growth
      left to run on its own rather than hand-authored; a pre-registered test of whether the detection
      method still works when transplanted onto that grown population (Q1, GL-76); a set of rigs testing
      each of this project's [bridge assumptions](/cards/bridge-assumptions/) independently (GL-79--GL-85); and
      two attempts at transferring the whole approach to external multi-agent benchmarks this project did not
      build, Orbit (GL-86) and the Collective-Intelligence-Library's `basin_stability` (GL-87/GL-88).
      The first program version is closed (2026-07-15, GL-31). The second version and its follow-up closed
      without ever producing a population that passed its own criteria (GL-38/GL-43). The third version's
      institutional runtime is active through a criteria freeze (GL-53). Methodological sandbox only: the
      present strategy space and metrics remain project-authored; the external transfers (GL-86--GL-88) are
      the first attempts to test the method on substrates this project did not build. All three closed as
      substrate-suitability findings rather than validated positive or negative transfers: passive UAD found
      a substrate-inflated true positive on Orbit (GL-86) and a flat null under converged learned policies on
      `basin_stability` (GL-87); a follow-on intervention-based probe on the same CIL substrate found a real
      but diffuse effect consistent with a shared-resource observation channel, not a discoverable pairwise
      unit (GL-88).
    readmePath: experiments/graded-lab-simulation/README.md
    designPath: experiments/graded-lab-simulation/DESIGN.md
    planPath: experiments/graded-lab-simulation/PLAN_v4.md
    findingsPath: experiments/graded-lab-simulation/results/FINDINGS.md
    # headlineFindings for this line are auto-extracted by sync-experiments.mjs
    # from "**Key finding:**" paragraphs in results/FINDINGS.md (one tagged
    # entry per site bullet, usually the last id in a related sequence) --
    # do not hand-edit findings text here; edit the tagged paragraph in
    # FINDINGS.md instead. This array is an untagged fallback, kept empty
    # since every current site bullet has a tag.
    headlineFindings: []

