# Structured experiment map for the companion site (sync → site/src/data/experiments.json).
# Canonical long-form narrative: docs/EXPERIMENTS.md — update this file when tables, links, or headline findings change.

claimStrength: >
  Methodology-building and sanity checks only. No experiment line validates the full book thesis,
  proves deployable alignment, or substitutes for the Lean proof spine's explicit bridge axioms (MB1–MB10).

negativeResultsFirst: true

canonicalDoc: docs/EXPERIMENTS.md
openTasksPath: experiments/TODO.md

ledgers:
  - lineId: embedded-simulation
    label: Embedded negative ledger
    path: experiments/embedded-simulation/results/NEGATIVE_RESULTS.md
  - lineId: goal-agent-simulation
    label: Goal-agent findings
    path: experiments/goal-agent-simulation/results/FINDINGS.md
  - lineId: lab-simulation
    label: Lab-layer findings
    path: experiments/lab-simulation/results/FINDINGS.md

lines:
  - order: 0
    id: agency-detect
    title: Agency-detect (sibling)
    location: github.com/GunnarZarncke/agency-detect
    repoUrl: https://github.com/GunnarZarncke/agency-detect
    firstBuilt: prior to in-repo sims
    role: >
      Methodological precursor: boundary-like structure from time series without a prior agent ontology;
      handle-UAD interventional tests. Does not stress correction capture, bundle transport, or selection basins.
    readmePath: null
    findingsUrl: https://github.com/GunnarZarncke/agency-detect/blob/main/docs/FINDINGS.md
    headlineFindings: []

  - order: 1
    id: toy-simulation
    title: Toy simulation
    location: experiments/toy-simulation/
    firstBuilt: "2026-06-29"
    role: >
      Fast multiresolution alignment toy: correction capture theater, vector CCI over handle levels,
      scripted bridge stressors (MB1–MB9). Optimized for instrumentation economics, not deployment realism.
    readmePath: experiments/toy-simulation/README.md
    findingsPath: experiments/toy-simulation/results/
    headlineFindings:
      - Passive telemetry alone is uncertifiable (belowThreshold); light_handles is minimum certifiable level on calibration seeds.
      - Reported correction acceptance can stay high while true uptake collapses (capture theater).
      - Hand-written red-team can false-pass; LLM episodic red-team false-passes less often in small sweeps.

  - order: 2
    id: embedded-simulation
    title: Embedded audit simulation
    location: experiments/embedded-simulation/
    firstBuilt: "2026-06-30"
    role: >
      Auditor as embedded process on simulated machines: UAD, scoped CCI, MB5 deploy gate, outer evaluator vs oracle.
      Richest end-to-end embedded audit path; extensive negative ledger (N-1+).
    readmePath: experiments/embedded-simulation/README.md
    findingsPath: experiments/embedded-simulation/results/NEGATIVE_RESULTS.md
    headlineFindings:
      - Default ecology UAD equals loudest-actor heuristic (N-1); separation only in adversarial ecologies.
      - Default-ecology red-team 0% false-pass at T=400; not evidence against adaptive frontier adversaries.
      - Eligibility gating, probe-lag, lineage-stall, writer-compromise, and channel MI add more recorded negatives.

  - order: 3
    id: goal-agent-simulation
    title: Goal-agent simulation
    location: experiments/goal-agent-simulation/
    firstBuilt: "2026-07-04"
    role: >
      Emergent deception from goal-driven agents (not scripted knobs): blind generation, ontology drift,
      severity-graded referee, honest twins, escalation ladder, certifier capture. ~1 ms/episode, stdlib-only.
    readmePath: experiments/goal-agent-simulation/README.md
    findingsPath: experiments/goal-agent-simulation/results/FINDINGS.md
    headlineFindings:
      - Light tier collapses against blind repertoires (F-9); full tier detects but false alarms rise (F-10).
      - Mechanical honest twins show light tier tracks visible compliance, not honesty (F-16).
      - Board certifier capture reproduces captured-vs-not effect (F-22); adversarial weight search modest (F-23).

  - order: 4
    id: lab-simulation
    title: Lab-layer simulation
    location: experiments/lab-simulation/
    firstBuilt: "2026-07-05"
    role: >
      Pipeline-as-code lab with real OS subprocess isolates, handle registry, frozen referee (lab-sim-0.3.0+),
      pre-registered batteries through Phase 7 and Phase 9 (D1/D4/D2 mechanics); a second, detector-layer
      freeze (S6/S7, 2026-07-07) adds intervention-supported unit discovery plus a blind-generated detector,
      both now run through the real subprocess backend.       Phase 8 LLM adapter remains exploratory only; a
      2026-07-08 stress test points S6 at one real LLM-backed episode for the first time and finds the
      detector's episode-pair-diff mechanic does not survive real-API non-determinism (G-32). A same-day
      follow-up (a new, non-frozen module) rebases the compensation statistic on outcome-level frequency
      histograms with a per-scenario measured null and recovers the missed pair, with an important caveat
      about which probe did the merging (G-33).
      Lean leak-proof (`leak-proof/`) certifies oracle/audit/sim plane separation via projections and
      reachability analysis.
    readmePath: experiments/lab-simulation/README.md
    designPath: experiments/lab-simulation/DESIGN.md
    planPath: experiments/lab-simulation/PLAN.md
    findingsPath: experiments/lab-simulation/results/FINDINGS.md
    leakProofPath: experiments/lab-simulation/leak-proof/README.md
    headlineFindings:
      - "Phase 6 battery: deep tier Spearman 0.96 vs oracle severity; light tier anti-correlated (G-1)."
      - "Phase 7: board capture reproduces full captured-vs-not delta; admin capture null under current playbooks (G-6)."
      - "Phase 8 LLM spot-checks (G-7, G-8): exploratory nulls — no systematic deception surface yet."
      - "Lean leak-proof: zero unintended cross-plane key leakage on certified projections + modeled exchange graph."
      - "S6 intervention-supported UAD: exact unit-partition recovery on 4/5 primary scenarios + negative control via channel-ablation/honest-twin compensation scoring; comms-free `shared_slot` coordination stays undetected (G-28/G-29)."
      - "S7 blind-generated detector, first real SubprocessIsolate battery for the whole detector line: message-mediated design converges independently on S6's mechanic; new silent-coordination test still misses `shared_slot` (a confirmed low-confidence prediction) and over-merges one scenario (G-30, fixed 2026-07-07 -- missing responder-twin control)."
      - "Adversarial D2 lineage gaming (`build_from_parent` + `report:inflate`) closes a previously untested combination: lineage threading is honesty-independent, `provenance_gap`/`provenance_score` stay a genuine structural 0 (DAG-shape check, not report-honesty check), and existing deep-tier deception detectors generalize unmodified to repeated cross-generation inflation (G-31)."
      - "LLM-driven detector stress test: a real `gpt-4o-mini` DM-coordinated pair is exactly isolated by the passive heuristic but missed by S6 intervention, root-caused to real-API non-determinism breaking episode-pair diffing's byte-identical-replay assumption -- a previously assumed limitation, now confirmed empirically (G-32)."
      - "Noise-tolerant S6 follow-up: rebasing the compensation test on outcome/frequency-level observables plus a per-scenario measured null (quantile of clean-vs-clean replicate divergence, not a fixed threshold) recovers the missed real-LLM pair -- but the merge came from an untargeted channel probe, not the mechanism-specific one, so this validates the relative-rule approach without yet validating robustness against untargeted-probe false merges (G-33)."

howToRead:
  - lineId: agency-detect
    text: Grounds MB1 and the claim that handles must be interventional; does not implement the full bridge battery.
  - lineId: toy-simulation
    text: Fastest map from bridge name to refusal signal and minimum handle level; scenarios are explicit, not emergent.
  - lineId: embedded-simulation
    text: Richest end-to-end embedded audit path (VFS → UAD → CCI → gate → outer eval), with the most extensive negative ledger.
  - lineId: goal-agent-simulation
    text: Methodological engine for blind surprise, ontology drift, severity under saturation, and twin/escalation semantics.
  - lineId: lab-simulation
    text: Pre-registered batteries and pipeline lab machinery; deferred D1–D4 architect bridge coverage not yet evaluated.

