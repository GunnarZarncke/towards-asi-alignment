    findingsPath: experiments/witness/results/FINDINGS.md
    headlineFindings: []

howToRead:
  - lineId: agency-detect
    text: >
      Grounds this project's [first bridge assumption](/cards/bridge-assumptions/) and the claim that intervention
      handles must be tested by intervening, not just observed; does not implement the full set of
      bridge-assumption tests.
  - lineId: deployment-pipeline-simulator
    text: >
      Pipeline-lab precursor: hidden self-preservation in a frozen deployment workflow, detected from
      operational logs plus randomized perturbations rather than group labels; grounds ET-4-style secret-loyalty
      audit questions without the in-repo lab's subprocess isolates or blind-generation batteries.
  - lineId: toy-simulation
    text: Fastest map from bridge name to refusal signal and minimum required intervention level; scenarios are explicit, not emergent.
  - lineId: embedded-simulation
    text: >
      Richest end-to-end embedded audit path — from raw filesystem artifacts, through
      [boundary discovery](/cards/boundary-discovery/) and
      [correction-channel-integrity](/cards/correction-channel-integrity/) scoring, to a deployment gate and
      an outer evaluator — with the most extensive negative ledger.
  - lineId: goal-agent-simulation
    text: Methodological engine for testing blind-scenario surprise, drift in how the task is framed, graded severity under heavy load, and the semantics of honest stand-ins and escalating response.
  - lineId: lab-simulation
    text: >
      Pre-registered batteries and pipeline lab machinery; ET-3 (AI 2027 schedule transfer) closed
      2026-07-26 with LS-42–48. Coverage of this project's bridge assumptions for extended populations and
      selection basins beyond ET-3 mapping remains deferred.
  - lineId: graded-lab-simulation
    text: >
      Ambiguity and boundary-discovery engine: a boundary-information-quality score over inferred (not
      labeled) units, a "high" ambiguity band that is structurally unreachable from the agent's own vantage
      point, a "mid" band reachable only from a referee's vantage point on the hand-designed substrate (with
      a null result on external validity when transplanted onto the grown population, GL-76/GL-84), a
      selection-battery null (GL-23--GL-27), and independent per-bridge-assumption rigs (GL-79--GL-85).
      [Boundary discovery](/cards/boundary-discovery/), including its access-aware variant, has been
      methodologically sound since GL-51. Negative ledgers and per-rig skips are features, not bugs. Two
      external-substrate transfers followed: against Orbit (GL-86), where the passive detection method
      correctly detects the substrate's own scripted-agent coupling rather than testing communication-mediated
      collusion; and against the Collective-Intelligence-Library's `basin_stability` (GL-87/GL-88), where
      passive detection found nothing under converged learned (Q-learning) policies, but an intervention-based
      freeze probe on the same substrate found a real, diffuse effect consistent with every agent sharing one
      resource-level channel rather than any pairwise unit. All three closed as substrate-suitability findings
      rather than a clean external pass or fail.

  - lineId: et-1
    text: "First external-substrate stop: the instrument reported the coupling the benchmark actually has."
  - lineId: et-2
    text: Passive transfer null on learned policies; intervention finds a shared-channel smear, not a pair.
  - lineId: et-3
    text: Schedule cues as stress, not a forecast check.
  - lineId: et-4
    text: Hackathon organism and replay; not a frontier discharge.
  - lineId: witness
    text: >
      Fail or refuse on named leaves using traces that already exist. Does not pin Lean
      WorkedInstance yet, does not pay a real H5 stop, and does not price faking the tags.

