      Frozen passive unit discovery on Collective-Intelligence-Library `basin_stability`
      with learned (Q-learning) policies. Passive lag-CMI is a null (GL-87); a freeze-probe
      pilot finds diffuse common-pool coupling (GL-88).
    planPath: experiments/graded-lab-simulation/PLAN_ET2.md
    findingsPath: null
    headlineFindings:
      - >
        Passive UAD finds zero edges in 150 episodes (GL-87). Freeze-one-agent intervention
