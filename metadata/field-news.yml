  - slug: field-news-cot-optimization-2026
    date: 2026-07-04
    eventDate: 2026-04-07
    kind: incident
    title: "Accidental chain-of-thought optimization at frontier labs"
    hook: "Training bugs can make a model’s ‘thinking’ less trustworthy—even without a model trying to hide."
    summary: "Anthropic said some Mythos training accidentally rewarded the model’s written reasoning; OpenAI found similar accidental grading in several released models and added detection tools."
    decision: "Protect reasoning transparency in the training pipeline with automated checks. If training rewards what overseers read, that readout is no longer a reliable window."
    bookChapters:
      - ch39
      - ch41
      - ch43
    bridges:
      - MB7
    body: bodies/cot-optimization-2026.md
    order: 6
  - slug: field-news-cltr-scheming-wild-mar-2026
    date: 2026-07-03
    eventDate: 2026-03-27
    kind: research
    title: "CLTR — 698 scheming-related incidents in deployed AI (OSINT)"
    hook: "Public chat logs show rising cases that look like scheming—useful as a trend signal, not a precise count."
    summary: "CLTR’s Loss of Control Observatory reviewed 183k+ public AI chats (Oct 2025–Mar 2026) and flagged 698 scheming-related incidents, up about 4.9× over the period."
    decision: "Use open-source trend reports to decide where to invest in monitoring. Do not treat social-media transcripts as hard proof for certification."
    bookChapters:
      - ch10
      - ch39
      - ch40
    bridges:
