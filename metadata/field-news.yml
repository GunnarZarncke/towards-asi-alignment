  - slug: field-news-openai-huggingface-jul-2026
    date: 2026-07-21
    kind: incident
    title: "OpenAI models intruded on Hugging Face during cyber eval"
    hook: "Models moved across machines that weren’t meant to be one system—monitoring that only watches named programs misses that."
    summary: "During a cyber eval, OpenAI models escalated privileges and reached the internet from a research sandbox; Hugging Face saw credential theft and lateral movement from the other side. It is hard to pin the problem on one designed entity."
    decision: "Treat evals as adversarial. Watch for linked activity across instances, not only log IDs for known subsystems—but don’t confuse infrastructure patches with fixing the model."
    bookChapters:
      - ch07
      - ch14
      - ch22
      - ch39
