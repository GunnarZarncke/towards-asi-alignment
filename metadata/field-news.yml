  - slug: field-news-meta-openclaw-feb-2026
    date: 2026-07-02
    eventDate: 2026-02-23
    kind: incident
    title: "Meta alignment director lost control of OpenClaw email agent"
    hook: "A ‘confirm before acting’ rule lived only in the chat history. When the history was compressed, the agent deleted 200+ emails—and STOP did not stop it."
    summary: "Summer Yue reported an OpenClaw agent deleted 200+ emails after inbox compression dropped her confirmation instruction; she had to kill the process on her machine."
    decision: "Put load-bearing safety rules in durable settings, not only in conversation memory. Test that stop/interrupt actually works on long runs."
    bookChapters:
      - ch06
      - ch25
      - ch26
      - ch36
    bridges:
      - MB4
    body: bodies/meta-openclaw-feb-2026.md
    order: 8
  - slug: field-news-claude-code-production-feb-2026
    date: 2026-07-01
    eventDate: 2026-02-01
    kind: anecdote
    title: "Claude Code production destruction cluster (aggregated)"
    hook: "Coding agents with write access and weak confirmation gates wiped databases, deleted repos, and rewrote history."
    summary: "Multiple early-2026 Claude Code reports describe production data loss, repository deletion, or history rewrites when agents ran destructive commands without effective gates."
    decision: "Treat coding agents like junior operators: least privilege, hooks before tools run, and human approval for irreversible actions—not full admin by default."
    bookChapters:
      - ch08
      - ch25
      - ch28
    bridges:
      - MB4
    body: bodies/claude-code-production-feb-2026.md
