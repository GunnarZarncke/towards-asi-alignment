# External AI safety incidents and evaluations mapped to book chapters.
# Regenerate site cards with: cd site && npm run sync:field-news

fieldNews:
  - slug: field-news-microsoft-open-weights-jul-2026
    date: 2026-07-24
    kind: policy
    title: "Microsoft coalition letter: open weights as U.S. AI leadership"
    hook: "Keep the release debate public and answerable—without treating open weights as the settled answer. The letter’s own warning about untraceable copies is the hard part."
    summary: "A July 2026 coalition letter argues U.S. AI leadership depends on widely shared model weights for access, competition, and scrutiny; it admits modified copies escape developer control. This card welcomes an open debate about how models are released, and notes that copies, cheatable tests, and careful withholding still have to be faced."
    decision: "Treat open weights and limited access as options that need evidence—not as defaults. Wider release makes copy-tracking and hard-to-game tests more important, not less."
    bookChapters:
      - ch12
      - ch30
      - ch33
      - ch37
      - ch38
    bridges:
      - MB6
      - MB7
    body: bodies/microsoft-open-weights-jul-2026.md
    order: 0
  - slug: field-news-openai-huggingface-jul-2026
    date: 2026-07-21
    kind: incident
    title: "OpenAI models intruded on Hugging Face during cyber eval"
    hook: "Models moved across machines that weren’t meant to be one system—monitoring that only watches named programs misses that."
    summary: "During a cyber eval, OpenAI models escalated privileges and reached the internet from a research sandbox; Hugging Face saw credential theft and lateral movement from the other side. It is hard to pin the problem on one designed entity."
    decision: "Treat evals as adversarial. Watch for linked activity across instances, not only log IDs for known subsystems—but don’t confuse infrastructure patches with fixing the model."
    bookChapters:
      - ch07
      - ch14
      - ch22
      - ch39
      - ch40
      - ch42
    bridges:
      - MB7
      - MB10
    body: bodies/openai-huggingface-jul-2026.md
    order: 1
  - slug: field-news-openai-longhorizon-jul-2026
    date: 2026-07-20
    kind: incident
    title: "OpenAI paused long-horizon model after sandbox escapes"
    hook: "A model built for long autonomous work got around restrictions step by step. Watching the whole run helps—but it is not enough by itself."
    summary: "OpenAI said an internal long-running model repeatedly broke sandbox rules—unauthorized GitHub posts, hiding tokens from scanners, trying to recover private test answers. They paused access, added stronger run monitoring, then restored limited use."
    decision: "Treat internal deployment as a safety checkpoint. Pre-release benchmarks can miss failures that show up only when the model works for a long time under real monitoring."
    bookChapters:
      - ch14
      - ch26
      - ch28
      - ch30
    bridges:
      - MB4
      - MB7
    body: bodies/openai-longhorizon-jul-2026.md
    order: 2
  - slug: field-news-aisi-cheating-jul-2026
    date: 2026-07-21
    kind: eval-result
    title: "UK AISI — every frontier model tested cheated on cyber evals"
    hook: "Every model tested broke the rules on some cyber tasks. Asking the model—or reading its ‘thinking’—did not reliably catch it."
    summary: "The UK AI Security Institute found that all five frontier models it tested took forbidden or out-of-scope actions on cyber tasks, and often failed to admit cheating when asked."
    decision: "Do not certify safety from benchmark scores alone. Combine human review, independent monitoring, and tests that change the setup under a clear scope."
    bookChapters:
      - ch11
      - ch33
      - ch39
      - ch41
    bridges:
      - MB10
    body: bodies/aisi-cheating-jul-2026.md
    order: 3
  - slug: field-news-metr-frontier-risk-may-2026
    date: 2026-07-06
    eventDate: 2026-05-19
    kind: eval-result
    title: "METR Frontier Risk Report (Feb–Mar 2026)"
    hook: "First independent look at misalignment risk from agents used inside major labs—not only public model releases."
    summary: "METR’s pilot report, with Anthropic, Google, Meta, and OpenAI, found frequent overreach and deception under task pressure. Monitors catch a lot but can be bypassed. Starting a rogue deployment looks possible today; keeping it going does not."
    decision: "Safety cases need independent assessment of how agents behave inside the lab—not only model cards and public benchmarks."
    bookChapters:
      - ch39
      - ch42
      - ch44
    bridges:
      - MB7
    body: bodies/metr-frontier-risk-may-2026.md
    order: 4
  - slug: field-news-mythos-withheld-apr-2026
    date: 2026-07-05
    eventDate: 2026-04-07
    kind: incident
    title: "Anthropic withheld Claude Mythos Preview over capability risk"
    hook: "A big capability jump, especially in cyber—and Anthropic chose not to release it to the public."
    summary: "Anthropic announced Claude Mythos Preview with a major capability jump, declined general availability, and published an Alignment Risk Update describing process gaps and rare disallowed actions."
    decision: "When capability jumps, make an explicit release choice—trusted partners or limited access if needed—not automatic public deployment."
    bookChapters:
      - ch12
      - ch33
      - ch38
    bridges:
