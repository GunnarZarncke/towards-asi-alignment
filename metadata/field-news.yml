  - slug: field-news-et2-cil-uad-jul-2026
    date: 2026-07-29
    kind: eval-result
    title: "An outside test failed to find a hidden team of agents"
    hook: "A boundary-finding test found no hidden subgroup; a follow-up showed that changing one agent can affect everyone without revealing a distinct team."
    summary: "External Test 2 (ET-2) tested the project's boundary-finding method in an independently built multi-agent commons simulation. Across 150 runs, it did not recover the planted adversarial subgroup. A separate small test found broad spillover from changing one agent, which is not the same as finding a meaningful unit."
    decision: "Treat this as a real limit of the current test, not a reason to retune it. Before running a larger intervention study, test whether the broad spillover is just a shared-resource effect."
    bookChapters:
      - ch07
      - ch34
      - appN
    bridges:
      - MB1
      - MB6
      - MB8
    body: bodies/et2-cil-uad-jul-2026.md
    order: 0
  - slug: field-news-pacing-frontier-jul-2026
    date: 2026-07-29
    kind: policy
    title: "Frontier AI employees call for tools to pace automated AI development"
    hook: "A shared warning about competitive pressure matters—but pacing becomes real only when evidence can delay a release."
    summary: "A July statement signed by 1,178 employees of frontier AI companies asks the U.S. government to support an international effort to develop technical and governance tools for deliberately pacing automated AI development. It identifies the coordination problem: individual companies and countries face pressure not to slow down alone. The statement is a request for capacity to act, not itself a binding slowdown or a demonstrated safety mechanism."
    decision: "Turn a general call to pace into specific, independently usable release gates, shared evidence, and authority to delay or restrict deployment. Test whether those tools still bind when competitive pressure rises."
    bookChapters:
      - ch13
      - ch37
      - ch38
      - appC
    body: bodies/pacing-frontier-jul-2026.md
    order: 0
  - slug: field-news-et3-ai2027-jul-2026
    date: 2026-07-25
    kind: eval-result
    title: "AI 2027 speed assumptions stress-tested in a lab simulation (without confirming dates)"
    hook: "A famous timeline forecast can drive lab safety tests — without the lab proving the forecast right."
    summary: "AI 2027-style takeoff speedups were used only as schedule cues in a separate lab simulation with frozen safety batteries. Hard safety ranking held under moderate mapped stress but broke down under the strongest cue; selection dynamics differed by regime without validating calendar predictions. The public forecast code reproduced on a pinned fork; optional coupling from lab metrics to milestone years shifts medians in sensitivity plots, not as new timeline claims."
    decision: "Treat macro forecasts and micro lab tests as separate evidence. Use scenario speedups to stress correction and selection mechanisms — not to confirm when SC, SAR, or ASI will arrive."
    bookChapters:
      - ch12
      - ch14
      - ch30
      - ch34
      - ch42
    bridges:
      - MB6
      - MB7
      - MB10
    body: bodies/et3-ai2027-jul-2026.md
    order: 0
  - slug: field-news-microsoft-open-weights-jul-2026
    date: 2026-07-24
    kind: policy
    title: "Microsoft coalition letter: open weights as U.S. AI leadership"
    hook: "Keep the release debate public and answerable—without treating open weights as the settled answer. The letter’s own warning about untraceable copies is the hard part."
    summary: "A July 2026 coalition letter argues U.S. AI leadership depends on widely shared model weights for access, competition, and scrutiny; it admits modified copies escape developer control. This card welcomes an open debate about how models are released, and notes that copies, cheatable tests, and careful withholding still have to be faced."
    decision: "Treat open weights and limited access as options that need evidence—not as defaults. Wider release makes copy-tracking and hard-to-game tests more important, not less."
    bookChapters:
