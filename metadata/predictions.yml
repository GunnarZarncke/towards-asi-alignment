# 2027 bridge prediction markets — site/catalog source (P1).
# Property and three-way rule: appendices/appP-bridge-predictions.tex.
# Numeric bars: claims registry. registrySite is the base URL (no trailing path).
# Versioned criteria pages: {registrySite}/markets/market-NN/vK/
# The manuscript macro \claimsbase is generated from registrySite.
# title = appendix/catalog noun. shortTitle / longTitle = Metaculus short and long titles.
# longTitle = listing lead (resolve-by is also in resolveBy).
# Optional metaculusEmbedId (numeric question id) turns on the forecast iframe.
# YES does not discharge any MB*; resolvesMB is always false on cards.
# Author (GZ) lists on the host platform and owns contract design. The registry
# maintainer adjudicates; a Metaculus admin reads the snapshot (eval-registry-split.md).
# Proposed advisors for other platforms: drafts/predictions/resolution-advisors.md (not published).
#
# primaryBridge + relatedBridges: keys in bridgeCardSlugs below only (not raw card slugs).
# Sync always links primaryBridge; relatedBridges = extra related cards (omit duplicates).
#
# Phase 2 audit fields (outputClass, evidenceTier, adapterVersion, sampleUnit)
# freeze reconstructibility and adapter scope. Bars live in the registry contract.
# Resolution-gap analysis (Phase 2b, CIRIS context): drafts/predictions/resolution-gap-analysis.md
# Listing-status vocabulary on cards is not wired yet; classes live in that file.

gapAnalysis: drafts/predictions/resolution-gap-analysis.md
safetyCaseModel: metadata/safety-case-model.yml
safetyCaseDemo: /predictions/safety-case/
