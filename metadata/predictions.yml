# 2027 bridge prediction markets — site/catalog source (P1).
# Public YES/NO spec lives in appendices/appP-bridge-predictions.tex.
# YES does not discharge any MB*; resolvesMB is always false on cards.

purpose: >
  Eighteen binary contracts on whether published methods meet frozen bars by
  31 December 2027. A YES is evidence about operationalization, not proof that
  a bridge holds on frontier systems. NO lumps failed bars, missing evals, and
  unresolved judgment calls.

resolveBy: "2027-12-31"

overview:
  title: "2027 bridge predictions"
  summary: >
