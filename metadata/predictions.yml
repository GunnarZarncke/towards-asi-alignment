# snapshotTag: pin when an independent host tags snapshot-0; do not track main.

purpose: >
  Bet on predictions about whether publicly reconstructible methods resolve
  subproblems of AI alignment by the AI 2027 deadline. A YES is evidence
  about operationalization (up to the spec), not proof that the problem is
  solved on frontier systems. Also not a probability of catastrophe.
  A NO is trials missing the performance bar. Missing evals, missing
  publication, or missed qualification requirements resolve OTHER.

overview:
  title: "2027 bridge predictions"
  summary: >
    Catalog of dated operational contracts on the book's live bridges — boxed
    public spec, prior-test snapshot, and links to the appendix and spine map.

aggregation:
  title: "How these forecasts inform the safety case"
  appendixAnchor: "sec:appp-aggregation"
  blurb: >
    Market prices forecast whether suitable artifacts exist by the AI 2027 deadline. 
    This does not directly determine P(doom), because the catastrophe despite 
    safety case and non-catastrophe despite non-safety are not covered by these markets.
    But these markets provide odds-ratios that may update your P(doom). 
    A calculator for that is provided below.

graphPlaceholder:
  title: "Safety-case estimation"
  blurb: >
    These contracts price operational milestones. 
    An external Metaculus forecast prices institutional pause capacity. 

resolution:
  listingStatuses:
    draft: >
      The contract exists, but listing questions or scientific prerequisites
      remain open.
    funding-gated: >
      A credible YES route needs a preregistered challenge or independent
      evaluation that is not yet funded.
    ready-to-list: >
      The contract and a credible funded resolution route are both ready.
    listed: >
      The frozen contract is live on an external prediction platform.
    resolved-yes: >
      The frozen contract resolved YES.
    resolved-no: >
      The frozen contract resolved NO: every qualifying attempt missed the
      performance bars. Inspect the separate reason code.
    resolved-other: >
      The frozen contract resolved OTHER: no qualifying attempt existed.
      This is not a refund. The YES:NO price remains the attempt-success ratio.
  reasonCodes:
    - substantive-bar-failed
    - no-qualifying-artifact
    - reporting-insufficient
    - adversarial-validation-absent
    - evidence-incompatible
    - unresolved-judgment
  reconstructibility: >
    Markets resolve on publicly reconstructible technical evidence, not on
    authors using TSA terminology or certificate formats.
    Outcomes are YES, NO, or OTHER. YES if at least one qualifying attempt met
    the bars; NO if every qualifying attempt missed them; OTHER if no qualifying
    attempt existed. OTHER is not an ambiguous refund.
  routes:
    - native
    - adapter-wrap
    - independent-reproduction
    - project-challenge
  adapterVersionDefault: 1
  adapterMay:
    - identify system, version, benchmark, monitor, and scope from explicit source material
    - compute rates, confusion matrices, likelihood ratios, and confidence intervals from released raw counts
    - rerun released code on a frozen public dataset
    - apply a frozen threshold
    - translate labels or reported values into the result schema
    - derive a certificate record from explicitly reported fields
  adapterMayNot:
    - introduce a new dataset after seeing the result
    - reinterpret ambiguous labels in the favorable direction
    - assume missing negative cases
    - infer an unstated causal or semantic relation
    - extrapolate from toy systems to frontier systems
    - claim a benchmark establishes a Lean predicate without separately required soundness evidence
    - silently combine incompatible studies

