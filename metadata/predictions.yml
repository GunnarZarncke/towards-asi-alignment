# 2027 bridge prediction markets — site/catalog source (P1).
# Public YES/NO spec lives in appendices/appP-bridge-predictions.tex.
# title / shortQuestion = catalog label. marketQuestion = listing lead (no date; see resolveBy).
# Scope paragraphs and YES bars stay in the appendix only (sync extracts Scope for cards).
# YES does not discharge any MB*; resolvesMB is always false on cards.
# Author (GZ) lists on Metaculus and owns contract design; external resolvers adjudicate.
#
# primaryBridge + relatedBridges: keys in bridgeCardSlugs below only (not raw card slugs).
# Sync always links primaryBridge; relatedBridges = extra related cards (omit duplicates).

purpose: >
  Bet on predictions about published methods resolving subproblems of AI alignment by stated
  resolve-by dates. A YES is evidence about operationalization up to the appendix thresholds,
  not proof that a bridge holds on frontier systems. A NO is everything else from missing evals,
  missing publication, or missed bars.

overview:
  title: "2027 bridge predictions"
  summary: >
    Catalog of dated operational contracts on the book's live bridges — boxed
    public spec, prior-test snapshot, and links to the appendix and spine map.

markets:
