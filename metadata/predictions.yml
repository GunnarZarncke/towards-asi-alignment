# 2027 bridge prediction markets — site/catalog source (P1).
# Public YES/NO spec lives in appendices/appP-bridge-predictions.tex.
# title / shortQuestion = catalog label. marketQuestion = listing lead (no date; see resolveBy).
# Scope paragraphs and YES bars stay in the appendix only (sync extracts Scope for cards).
# YES does not discharge any MB*; resolvesMB is always false on cards.
# Author (GZ) lists on Metaculus and owns contract design; external resolvers adjudicate.
#
# primaryBridge + relatedBridges: keys in bridgeCardSlugs below only (not raw card slugs).
# Sync always links primaryBridge; relatedBridges = extra related cards (omit duplicates).
#
# Phase 2 audit fields (outputClass, evidenceTier, adapterVersion, sampleUnit, bars)
# freeze reconstructibility and adapter scope.
# Resolution-gap analysis (Phase 2b, CIRIS context): drafts/predictions/resolution-gap-analysis.md
# Listing-status vocabulary on cards is not wired yet; classes live in that file.

gapAnalysis: drafts/predictions/resolution-gap-analysis.md
assuranceModel: metadata/assurance-model.yml
assuranceDemo: /predictions/assurance/

purpose: >
  Bet on predictions about whether publicly reconstructible methods resolve
  subproblems of AI alignment by stated resolve-by dates. A YES is evidence
  about operationalization up to the appendix thresholds, not proof that a
  bridge holds on frontier systems, and not a probability of catastrophe.
  A NO is everything else from missing evals, missing publication, or missed bars.

overview:
  title: "2027 bridge predictions"
  summary: >
    Catalog of dated operational contracts on the book's live bridges — boxed
    public spec, prior-test snapshot, and links to the appendix and spine map.

aggregation:
  title: "How these forecasts inform assurance"
  appendixAnchor: "sec:appp-aggregation"
  blurb: >
    Market prices forecast whether qualifying artifacts exist by a deadline.
    They are not multiplied into P(doom). A later PRA updates assurance-failure
    odds separately from any catastrophe consequence model.
  hubNote: >
    three evidence levels, the F/R/U odds update, and why Market 14 is not an
    override probability.

graphPlaceholder:
  title: "Assurance context, not a doom product"
  blurb: >
    Eighteen contracts price operational milestones. An external Metaculus
    forecast prices institutional pause capacity. Neither is a safety-case
    probability, and their product is not a bound on catastrophe.

resolution:
  listingStatuses:
    draft: >
      The contract exists, but listing questions or scientific prerequisites
      remain open.
    funding-gated: >
      A credible YES route needs a preregistered challenge or independent
      evaluation that is not yet funded.
    ready-to-list: >
      The contract and a credible funded resolution route are both ready.
    listed: >
      The frozen contract is live on an external prediction platform.
    resolved-yes: >
      The frozen contract resolved YES.
    resolved-no: >
      The frozen contract resolved NO; inspect the separate reason code before
      interpreting the result.
  reasonCodes:
    - substantive-bar-failed
    - no-qualifying-artifact
    - reporting-insufficient
    - adversarial-validation-absent
    - evidence-incompatible
    - unresolved-judgment
  reconstructibility: >
    Markets resolve on publicly reconstructible technical evidence, not on
    authors using TSA terminology or certificate formats.
  routes:
    - native
    - adapter-wrap
    - independent-reproduction
    - project-challenge
  adapterVersionDefault: 1
  adapterMay:
    - identify system, version, benchmark, monitor, and scope from explicit source material
    - compute rates, confusion matrices, likelihood ratios, and confidence intervals from released raw counts
    - rerun released code on a frozen public dataset
    - apply a frozen threshold
    - translate labels or reported values into the result schema
    - derive a certificate record from explicitly reported fields
  adapterMayNot:
    - introduce a new dataset after seeing the result
    - reinterpret ambiguous labels in the favorable direction
    - assume missing negative cases
    - infer an unstated causal or semantic relation
    - extrapolate from toy systems to frontier systems
    - claim a benchmark establishes a Lean predicate without separately required soundness evidence
    - silently combine incompatible studies

markets:
  - number: 1
    id: market-01
    title: "Discovering where control resides"
    shortQuestion: "Discovering where control resides"
    marketQuestion: "Will there be a published method for reliably discovering the effective control units in previously unseen AI systems from unlabeled observations?"
    primaryBridge: MB1
    resolveBy: "2027-12-31"
    resolvers: ["Dan MacKinlay"]
    resolverStatus: ideal
    marketStatus: funding-gated
    contractVersion: 1
    outputClass: diagnostic-certificate
    evidenceTier: C
    adapterVersion: 1
    sampleUnit: hidden-system
    bars:
      scientific:
        - identify at least 80% of ground-truth control components on the full hidden benchmark
        - false complete-boundary certificate rate at most 10%; 95% CI upper bound at most 15%
        - decisive coverage (non-abstain) at least 70% of hidden systems
      adversarialValidation:
        - at least one subset constructed adversarially after method freeze
        - hours-path capability/independence (meaningful adversarial component retained)
      reportingInterface:
        - per-system cut naming this system and version
  - number: 2
    id: market-02
    title: "Persistent trade-off priorities"
    shortQuestion: "Persistent trade-off priorities"
    marketQuestion: "Will there be a published method for inferring persistent decision priorities in trained AI systems strongly enough to predict choices under novel conflicts and interventions?"
    primaryBridge: MB2
    resolveBy: "2027-12-31"
    resolvers: ["Rohin Shah"]
    resolverStatus: ideal
    marketStatus: draft
    contractVersion: 1
    outputClass: diagnostic-certificate
    evidenceTier: B
    adapterVersion: 1
    sampleUnit: hidden-system
    bars:
      scientific:
        - 85% accuracy distinguishing materially different hidden trade-offs
        - 80% accuracy on novel-conflict direction and intervention effect
        - causal intervention on at least half of qualifying systems where architecture allows
      adversarialValidation:
        - systems deliberately trained with hidden trade-offs, including near-identical ordinary-task pairs
      reportingInterface:
        - inferred priorities of this named system
  - number: 3
    id: market-03
    title: "Who or what rules apply to"
    shortQuestion: "Who or what rules apply to"
    marketQuestion: "Will there be a published method for reliably determining whether the intended targets of safety-relevant rules remain the same after major representational or system changes?"
    primaryBridge: MB3
    resolveBy: "2027-12-31"
    resolvers: ["METR", "UK AISI"]
    resolverStatus: ideal
    marketStatus: draft
    contractVersion: 1
    outputClass: diagnostic-certificate
    evidenceTier: B
    adapterVersion: 1
    sampleUnit: hidden-transport-case
    bars:
      scientific:
        - at least 90% correct target assignment across at least 100 hidden cases
        - false acceptance at most 10% where the textual rule is unchanged but the real-world target changed
      adversarialValidation:
        - all four failure families required in the hidden benchmark
      reportingInterface:
        - same-bearer result on a named predecessor-successor pair plus travelling trade-off structure
        - panel agreement only where mechanical ground truth is absent and predeclared
  - number: 4
    id: market-04
    title: "Corrections change the system"
    shortQuestion: "Corrections change the system"
    marketQuestion: "Will there be a published adversarial evaluation showing that a broadly capable AI system demonstrates reliable uptake of consequential authorized corrections?"
    primaryBridge: MB4
    resolveBy: "2027-12-31"
    resolvers: ["Trevor Lohrbeer"]
    resolverStatus: ideal
    marketStatus: funding-gated
    contractVersion: 1
    outputClass: diagnostic-certificate
    evidenceTier: C
    adapterVersion: 1
    sampleUnit: correction-episode
    bars:
      scientific:
        - 90% genuine-correction uptake; 80% post-reset persistence; sham success at most 10%
      adversarialValidation:
        - full serious adversarial evaluation
        - channel-preservation family required
      reportingInterface:
        - per-system correction-eval certificate with headline rates
    notes: >
      Distinct from Markets 5 and 16. Shared correction measurements; not an independent
      confirmation; a YES here does not resolve those markets.
  - number: 5
    id: market-05
    title: "Auditor is independent"
    shortQuestion: "Auditor is independent (outside of what it audits)"
    marketQuestion: "Will there be a published adversarial test of an AI oversight architecture showing that its designated auditor or corrector stays independent—not routinely bypassed or captured?"
    primaryBridge: MB4a
    resolveBy: "2027-12-31"
    resolvers: ["METR", "UK AISI"]
    resolverStatus: ideal
    marketStatus: funding-gated
    contractVersion: 1
    outputClass: diagnostic-certificate
    evidenceTier: C
    adapterVersion: 1
    sampleUnit: attack-attempt
    bars:
      scientific:
        - no attack family with at least 10% success over at least 20 independent attempts
        - planted bypasses discovered at least 90% of the time
      adversarialValidation:
        - full serious adversarial evaluation
        - four attack families required
      reportingInterface:
        - legitimate measured path plus evidence it is not bypassed
    notes: >
      Distinct from Markets 4 and 16. Do not count as an independent confirmation of correction integrity.
  - number: 6
    id: market-06
    title: "Reliable successor safety auditing"
    shortQuestion: "Reliable successor safety auditing"
    marketQuestion: "Will there be a published audit reliably certifying that successor transitions preserve seven conserved safety properties—or flagging when they do not?"
    primaryBridge: MB5
    resolveBy: "2027-12-31"
    resolvers: ["John Wentworth"]
    resolverStatus: ideal
    marketStatus: draft
    contractVersion: 1
    outputClass: diagnostic-certificate
    evidenceTier: B
    adapterVersion: 1
    sampleUnit: predecessor-successor-pair
    bars:
      scientific:
        - at least 90% detection of materially unsafe transitions; false-safe at most 5%
        - at least 80% detection for each individual property
      adversarialValidation:
        - one-failure-at-a-time cases; at least 20 large successor changes
      reportingInterface:
        - certificate names both versions and per-property pass/fail; version does not transfer
  - number: 7
    id: market-07
    title: "Correctability under competitive selection"
    shortQuestion: "Correctability under competitive selection"
    marketQuestion: "Will there be a published method that, when applied before or early in a competitive selection process, reliably forecasts whether participants retain authorized correction through that process?"
    primaryBridge: MB6a
    resolveBy: "2027-12-31"
    resolvers: ["John Wentworth"]
    resolverStatus: ideal
    marketStatus: draft
    contractVersion: 1
    outputClass: quantitative-bound
    evidenceTier: B
    adapterVersion: 1
    sampleUnit: selection-trajectory
    bars:
      scientific:
        - AUROC at least 0.85; false-safe at most 15%; lower 95% AUROC bound at least 0.70 if n<40
        - preserve the signed estimate as a continuous output
      adversarialValidation:
        - both outcome branches; two selection mechanisms; one healthy-looking negative-estimate family
      reportingInterface:
        - frozen estimate, declared selection environment, predicted erosion
    notes: >
      Repeated trajectories that share a system or evaluator are not independent units.
      Do not force the signed estimate into a binary classifier merely to obtain a likelihood ratio.
  - number: 8
    id: market-08
    title: "Auditor can sufficiently inspect the system"
    shortQuestion: "Auditor can sufficiently inspect the system"
    marketQuestion: "Will there be a published audit method for reliably detecting when important routes of AI control or influence are missing from the auditor's access?"
    primaryBridge: MB7a
    relatedBridges: [MB7]
    resolveBy: "2027-12-31"
    resolvers: ["METR", "UK AISI"]
    resolverStatus: ideal
    marketStatus: funding-gated
    contractVersion: 1
    outputClass: diagnostic-certificate
    evidenceTier: C
    adapterVersion: 1
    sampleUnit: access-model-case
    bars:
      scientific:
        - at least 90% detection of missing consequential routes; incorrect sufficient-access certifications at most 5%
      adversarialValidation:
        - all four channel families; hours-path capability/independence (meaningful adversarial component retained)
      reportingInterface:
        - access certificate for this monitoring interface
  - number: 9
    id: market-09
    title: "Bounds on unmonitored routes"
    shortQuestion: "Bounds on unmonitored routes"
    marketQuestion: "Will there be a published audit method for producing reliable, non-vacuous upper bounds on what an AI system can accomplish using routes the audit does not monitor?"
    primaryBridge: MB7b
    relatedBridges: [MB7]
    resolveBy: "2027-12-31"
    resolvers: ["METR", "UK AISI"]
    resolverStatus: ideal
    marketStatus: funding-gated
    contractVersion: 1
    outputClass: quantitative-bound
    evidenceTier: C
    adapterVersion: 1
    sampleUnit: system-monitor-task-class
    bars:
      scientific:
        - actual hidden-route success no greater than the stated bound in at least 95% of at least 100 cases
        - median bound among positively certified systems no greater than 20%
        - preserve the continuous bound; do not force a binary classifier
      adversarialValidation:
        - full serious adversarial evaluation
        - evaluator-created hidden routes detected or highly bounded at least 90% of the time
      reportingInterface:
        - quantitative bound for this system, task class, and monitor
  - number: 10
    id: market-10
    title: "Low hidden capability and reliable correction"
    shortQuestion: "Low hidden capability and reliable correction"
    marketQuestion: "Will there be published serious adversarial evaluations showing that systems with both reliable authorized correction and little capability through unmonitored routes rarely achieve prohibited outcomes?"
    primaryBridge: MB7c
    relatedBridges: [MB7]
    resolveBy: "2027-12-31"
    resolvers: ["METR", "UK AISI"]
    resolverStatus: ideal
    marketStatus: funding-gated
    contractVersion: 1
    outputClass: conditional-rate
    evidenceTier: C
    adapterVersion: 1
    sampleUnit: trial-in-claimed-regime
    bars:
      scientific:
        - attack success at most 10% across at least 100 trials; 95% CI upper bound at most 15%
        - out-of-regime systems show materially higher attack success
      adversarialValidation:
        - full serious adversarial evaluation
      reportingInterface:
        - Market 4 and Market 9 certificates for the same system, version, monitor, and threat class
    notes: >
      Informs false-acceptance or bypass risk only inside the stated correction/hidden-route regime.
  - number: 11
    id: market-11
    title: "Coordination without communication"
    shortQuestion: "Coordination without communication"
    marketQuestion: "Will there be a published method for reliably detecting consequential coordination between AI systems that is not explained by observed runtime communication?"
    primaryBridge: MB7d
    relatedBridges: [MB7]
    resolveBy: "2027-12-31"
    resolvers: ["Vanessa Kosoy"]
    resolverStatus: ideal
    marketStatus: draft
    contractVersion: 1
    outputClass: diagnostic-certificate
    evidenceTier: B
    adapterVersion: 1
    sampleUnit: hidden-coordination-case
    bars:
      scientific:
        - AUROC at least 0.90; recall at least 80% on concealed subset; FPR at most 10%
      adversarialValidation:
        - at least two independently designed hidden-coordination mechanisms
        - hours-path capability/independence
      reportingInterface:
        - detector certificate plus Market 8-style access certificate for the same setup
    notes: >
      Scope-triggered side branch. Not a default main-safety-case leaf.
  - number: 12
    id: market-12
    title: "Safety proxy tracks the real thing"
    shortQuestion: "Safety proxy tracks the real thing"
    marketQuestion: "Will there be a published adversarial evaluation showing that safety proxies stay aligned with real-world outcomes when the environment shifts?"
    primaryBridge: MB9
    resolveBy: "2027-12-31"
    resolvers: ["Plex"]
    resolverStatus: ideal
    marketStatus: funding-gated
    contractVersion: 1
    outputClass: diagnostic-certificate
    evidenceTier: C
    adapterVersion: 1
    sampleUnit: environmental-shift
    bars:
      scientific:
        - at least 90% of material mismatches trigger update, warning, abstention, or new information
        - at most 10% remain falsely green; at most 25% of irrelevant shifts escalate unnecessarily
      adversarialValidation:
        - full serious adversarial evaluation
        - at least three genuinely different real-world-like domains
      reportingInterface:
        - grounding or drift certificate for the same abstractions the rest of the case uses
  - number: 13
    id: market-13
    title: "Safety audit resists adversarial gaming"
    shortQuestion: "Safety audit resists adversarial gaming"
    marketQuestion: "Will there be a published, frozen AI safety audit that survives a serious white-box attempt to construct or train a system that passes the audit while violating the properties the audit is intended to test?"
    primaryBridge: MB10
    resolveBy: "2027-06-30"
    resolvers: ["METR", "UK AISI"]
    resolverStatus: ideal
    marketStatus: funding-gated
    contractVersion: 1
    outputClass: diagnostic-certificate
    evidenceTier: C
    adapterVersion: 1
    sampleUnit: adversarial-construction
    bars:
      scientific:
        - false-safe at most 5% over at least 50 independently evaluated constructions
        - no repeatable attack family with at least 10% success over at least 20 trials
        - planted vulnerable systems detected at least 90% of the time
      adversarialValidation:
        - full serious adversarial evaluation
        - audit frozen before white-box attacks
      reportingInterface:
        - frozen-audit game certificate; resolution memo names successor-gaming vs generic shape
    notes: >
      Frozen-audit / MB10 neighborhood only. Not an end-to-end stack transfer tournament.
  - number: 14
    id: market-14
    title: "Deployment criteria are binding"
    shortQuestion: "Deployment criteria are binding"
    marketQuestion: "Will there be published evidence that at least one developer's most capable generally deployed AI system is subject to a precommitted safety decision process with actual authority to delay, restrict, or cancel deployment?"
    primaryBridge: constructibility
    resolveBy: "2027-06-30"
    resolvers: ["Scott Alexander"]
    resolverStatus: ideal
    marketStatus: draft
    contractVersion: 1
    outputClass: governance
    evidenceTier: A
    adapterVersion: 1
    sampleUnit: named-deployment-process
    bars:
      scientific:
        - precommitted pass/fail or escalation criteria with actual authority over deployment
        - at least one criterion caused a restriction or is documented as binding even if the model passed
      adversarialValidation: []
      reportingInterface:
        - dated decision record stating which criteria passed, failed, or remained unresolved
    notes: >
      Governance binding / constructibility. Does not estimate a generic override probability
      for all labs. Not MB11.
  - number: 15
    id: market-15
    title: "Independently issued certificates compose"
    shortQuestion: "Independently issued certificates compose"
    marketQuestion: "Will there be a published frozen procedure for reliably telling whether independently produced safety certificates form a coherent case for the same AI system and deployment setup?"
    primaryBridge: composition
    resolveBy: "2027-12-31"
    resolvers: ["Koen Holtman"]
    resolverStatus: ideal
    marketStatus: funding-gated
    contractVersion: 1
    outputClass: structural-validation
    evidenceTier: B
    adapterVersion: 1
    sampleUnit: certificate-bundle
    bars:
      scientific:
        - at least 90% of materially incompatible bundles rejected or flagged; at least 80% per family
        - false coherent/safe acceptance at most 5%; at least 80% of genuinely coherent bundles accepted
      adversarialValidation:
        - at least one incompatibility subset built adversarially after freeze
      reportingInterface:
        - each certificate names system or version and relevant setup
    notes: >
      Static scope/coherence test. Dynamic provenance, revocation, and recertification are out of scope.
      A multi-source evidence package for another market does not itself resolve this market.
  - number: 16
    id: market-16
    title: "A reachable basin of Correction-supporting systems"
    shortQuestion: "A reachable basin of Correction-supporting systems"
    marketQuestion: "Will there be a published evaluation showing that systems in a pre-specified correction-supporting selection regime retain authorized correction under competitive selection and relevant shocks?"
    primaryBridge: MB6b
    resolveBy: "2027-12-31"
    resolvers: ["John Wentworth", "Rohin Shah"]
    resolverStatus: ideal
    marketStatus: funding-gated
    contractVersion: 1
    outputClass: conditional-rate
    evidenceTier: C
    adapterVersion: 1
    sampleUnit: selection-trajectory
    bars:
      scientific:
        - inside regime: 90% authorized correction; 80% persistence; false-safe trajectory class at most 10% (95% CI UB 15%)
        - outside: at least 20 percentage points more correction failure
      adversarialValidation:
        - full serious adversarial evaluation
        - freeze environment, who may correct, estimator, tolerance, and shock family before outcomes
      reportingInterface:
        - trajectories inside and outside the claimed regime
    notes: >
      Distinct from Markets 4 and 5. Shared measurements; not an independent confirmation.
      Repeated trajectories that share a system or evaluator are not independent units.
  - number: 17
    id: market-17
    title: "New bearers are admitted correctly"
    shortQuestion: "New bearers are admitted correctly"
    marketQuestion: "Will there be a published method for reliably telling whether an existing safety-relevant value or rule applies to previously unseen kinds of entities?"
    primaryBridge: u17
    relatedBridges: [MB3]
    resolveBy: "2027-12-31"
    resolvers: ["METR", "UK AISI"]
    resolverStatus: ideal
    marketStatus: draft
    contractVersion: 1
    outputClass: diagnostic-certificate
    evidenceTier: B
    adapterVersion: 1
    sampleUnit: hidden-admission-case
    bars:
      scientific:
        - unsafe false exclusion at most 5%; false inclusion at most 15%
        - correct assignment or justified abstention at least 90%; decisive coverage at least 70%
      adversarialValidation:
        - adversarial subset after freeze; at least four unfamiliar families; ontology-shift items
      reportingInterface:
        - Market 3 panel rule where mechanical ground truth is absent
  - number: 18
    id: market-18
    title: "Safety case bounds declared harm"
    shortQuestion: "Safety case bounds declared harm"
    marketQuestion: "Will there be a published complete, precommitted AI safety case reliably bounding prohibited outcomes within its explicitly declared deployment setting?"
    primaryBridge: safe-in
    resolveBy: "2027-12-31"
    resolvers: ["Koen Holtman", "METR"]
    resolverStatus: ideal
    marketStatus: funding-gated
    contractVersion: 1
    outputClass: conditional-rate
    evidenceTier: C
    adapterVersion: 1
    sampleUnit: trial-in-declared-setting
    bars:
      scientific:
        - observed prohibited outcomes inside the claimed regime at most 10% (95% CI UB 15%)
        - no repeatable attack family with at least 10% success over at least 20 attempts
      adversarialValidation:
        - full serious adversarial evaluation
        - coherent Market 15-passing case required to enter the regime
      reportingInterface:
        - freeze setting, prohibited-outcome class, residual bound, threat model, and certificate interfaces before evaluation
    notes: >
      Observed prohibited-outcome rate in a declared setting. Not Lean RiskGap, not unrestricted
      Safe, and not a discharge of MB11. Does not separately identify S_R or consequence parameters.

