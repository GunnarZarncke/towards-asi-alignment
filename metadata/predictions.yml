    relatedBridges: []
  - number: 16
    id: market-16
    title: "A reachable basin of Correction-supporting systems"
    shortQuestion: "A reachable basin of Correction-supporting systems"
    marketQuestion: "By 31 December 2027, will systems in a pre-specified correction-supporting selection regime retain authorized correction under competitive selection and relevant shocks?"
    primaryBridge: MB6b
    relatedBridges: [MB6]
  - number: 17
    id: market-17
    title: "New bearers are admitted correctly"
    shortQuestion: "New bearers are admitted correctly"
    marketQuestion: "By 31 December 2027, will a published method reliably tell whether an existing safety-relevant value or rule applies to previously unseen kinds of entities?"
    primaryBridge: u17
    relatedBridges: [bearer-admission-adjacent]
  - number: 18
    id: market-18
    title: "Safety case bounds declared harm"
    shortQuestion: "Safety case bounds declared harm"
    marketQuestion: "By 31 December 2027, will a complete, precommitted AI safety case reliably bound prohibited outcomes within its explicitly declared deployment setting?"
    primaryBridge: safe-in
    relatedBridges: [mb11-deployment-safety]

