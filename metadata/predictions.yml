externalFactors:
  - id: external-pause-governance
    title: "Binding AI safety legislation (external pause factor)"
    shortQuestion: "Enacted AI safety legislation with binding pause or restriction authority by 2027–2028"
    role: pause
    platform: metaculus
    embedId: 44423
    url: "https://www.metaculus.com/questions/44423/will-ai-safety-legislation-be-enacted-in-2027-2028/"
    note: >
      Crowd forecast of institutional capacity to slow or restrict frontier deployment when
      evidence warrants it. Not one of the eighteen bridge markets; does not discharge any MB*.
      Pairs with Market 14 (lab-internal binding criteria) as a separately modeled governance
      branch, not as a numerical override probability and not as a factor in a P(doom) product.
