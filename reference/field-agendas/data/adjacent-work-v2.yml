# Adjacent field work for field hub v2 — not matrix rows.
# Surfaces consciousness / welfare / nonperson sources against MB* cruxes
# without filling evidence.yml or matrix.yml. Bearer admission stays inside MB3.
# Regenerate: cd site && npm run sync:field-v2

intro: >-
  Theory and policy work on AI consciousness, sentience, and welfare — near
  the question of who values apply to (bearer maps; ch18): when a process is
  digital, simulated, or otherwise unfamiliar, who might still deserve moral
  consideration, and what can we conservatively rule out?
  These notes are not coverage-matrix cells. Filling a matrix cell requires
  a sourced agenda contribution under field-map curation rules; listing
  here only records related work the live hub should make visible.

firewall: >-
  MB1 (boundary / candidate process) is an upstream dependency of bearer
  inference, not a problem these sources solve. Do not read this list as
  evidence that consciousness or welfare researchers discharge Embedded
  Agency. Self-modeling, introspection, and global-workspace-like
  architecture are candidate indicators under some theories — not
  consciousness tests and not automatic Inner Alignment (MB7) coverage.

phenomenalityNote: >-
  A certified nonperson / non-subjecthood result does not license
  unconstrained treatment of a process that may still be valenced or
  otherwise morally relevant under a different property. Phenomenality
  and subjecthood stay distinct.

items:
  - id: nonperson-predicate
    title: Nonperson predicate
    carrier: Yudkowsky / MIRI lineage
    bridges: [MB3]
    type: C
    summary: >-
      One-sided, abstaining exclusion certificate for computations outside a
      morally relevant class (mindcrime / simulated persons). TSA generalizes
      the form to bundle-specific conservative bearer exclusion; it does not
      supply a theory of consciousness or moral patienthood, and does not
      mean MIRI developed TSA's bearer-map framework.
    sources:
      - label: Nonperson Predicates (LessWrong)
        url: https://www.lesswrong.com/posts/wqDRRx9RqwKLzWt7R/nonperson-predicates
      - label: Nonperson predicate (tag)
        url: https://www.lesswrong.com/w/nonperson-predicate
    book: ch18 § recognizing new bearers; bib yudkowsky2008nonperson

  - id: butlin-2023-indicators
    title: Consciousness indicators (theory-derived)
    carrier: Butlin et al. (2023)
    bridges: [MB3]
    type: T
    summary: >-
      Derives computational indicator properties from several scientific
      theories of consciousness rather than treating behavioral self-report
      as sufficient. Candidate evidence providers for bearer inference —
      not a solved consciousness test.
    sources:
      - label: arXiv:2308.08708
        url: https://arxiv.org/abs/2308.08708
    book: ch18; bib butlin2023consciousnessai

  - id: long-2024-ai-welfare
    title: Taking AI welfare seriously
    carrier: Long et al. (2024)
    bridges: [MB3, MB11]
    type: C
    summary: >-
      Assessment and organizational preparation under uncertainty about
      future AI moral patienthood. MB3 for the bearer-relevance question;
      MB11 only for the deployment-policy / precaution strand — not a claim
      that welfare work certifies deployment safety.
    sources:
      - label: arXiv:2411.00986
        url: https://arxiv.org/abs/2411.00986
    book: ch18 short welfare cite list; bib long2024aiwelfare

  - id: butlin-2025-responsible
    title: Principles for responsible AI consciousness research
    carrier: Butlin & Lappas (2025)
    bridges: [MB11]
    type: C
    summary: >-
      Links uncertain consciousness research to responsible research and
      deployment practice. Neighborhood of MB11 precaution under moral-status
      uncertainty; not discharge of deployment safety.
    sources:
      - label: arXiv:2501.07290
        url: https://arxiv.org/abs/2501.07290
    book: bib butlin2025responsibleconsciousness

  - id: cimc
    title: California Institute for Machine Consciousness
    carrier: CIMC
    bridges: [MB3]
    type: C
    summary: >-
      Independent research agenda on phenomenal consciousness in artificial
      systems (theoretical + empirical / experimental computational
      philosophy). Candidate theory neighborhood for bearer-property
      evidence — not boundary discovery (MB1) and not a TSA framework axiom.
    sources:
      - label: cimc.ai
        url: https://cimc.ai/
    book: field note only; verify claims against CIMC's own pages

  - id: anthropic-model-welfare
    title: Exploring model welfare (short cite)
    carrier: Anthropic
    bridges: [MB3, MB11]
    type: P
    summary: >-
      Lab statement treating possible model experience/welfare as an open
      research question. Short cite only — not an introspection or
      global-workspace narrative, and not evidence that current models are
      conscious.
    sources:
      - label: Exploring Model Welfare
        url: https://www.anthropic.com/news/exploring-model-welfare
    book: ch18 short welfare cite list; bib anthropic2025modelwelfare
