slug: ai-futures-forecasting-cluster
title: AI Futures / forecasting cluster
type: Forecasting / strategy
carrier: AI Futures Project (AI 2027); Epoch AI; Metaculus; FRI
overview: >-
  The AI Futures and forecasting cluster produces explicit scenario narratives, timeline
  estimates, and shared prediction infrastructure for tracking advanced AI development.
  Its work informs policy urgency and schedule-shaped governance stress tests without
  claiming to resolve alignment mechanism questions. Forecasts interact with [Goodhart
  Selection](/cards/mb6-selection-and-basin-stability/) mainly as timing cues for
  deployment ecology, not as technical discharge of typed bridges.
primaryArtifact: >-
  The cluster produces explicit scenario narratives (notably [AI
  2027](https://ai-2027.com/)), timeline estimates, and shared prediction infrastructure
  for tracking AI development trajectories.
signatureVocabulary: >-
  Shared vocabulary includes [AI 2027](https://ai-2027.com/)-style scenarios,
  [timelines](https://epoch.ai/), [TAI](https://epoch.ai/) thresholds, automation of R&D,
  and structured scenario planning for policy and strategy audiences.
statedIntent: >-
  Inform high-stakes decisions with explicit, trackable forecasts about when and how
  advanced AI capabilities may arrive.
primaryCrux: >-
  Schedule uncertainty (when things happen) can dominate mechanism uncertainty (what fails
  first)—the book uses these forecasts mainly as schedule cues, not as technical findings
  about alignment mechanisms.
bookBridges:
  - MB6
contributes: >-
  Schedule-shaped stress tests for governance and deployment planning (App F)—how
  [Goodhart Selection](/cards/mb6-selection-and-basin-stability/) pressures might unfold
  under compressed timelines without claiming to resolve selection mechanics.
bookSeparates: >-
  A macro scenario about capability arrival does not imply discharge of any typed bridge
  in the measurement spine; forecasting informs urgency, not
  [Corrigibility](/cards/mb4-correction-legitimacy/) or [Inner
  Alignment](/cards/mb7-hidden-capability-and-access/) verdicts.
manuscriptHooks:
  - App C Plan A
  - App F governance-schedule deferred
