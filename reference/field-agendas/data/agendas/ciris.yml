slug: ciris
title: CIRIS
type: Institutional protocol / constitutional ops stack (manual add)
carrier: CIRIS (Eric Moore); mission-locked L3C; AGPL ecosystem
overview: >-
  CIRIS is a cryptographic and procedural accountability stack for autonomous agents, with
  [Corrigibility](/cards/mb4-correction-legitimacy/) and [Audit
  Independence](/cards/mb4a-measured-path-legitimacy/) as its primary operational test
  surfaces.
primaryArtifact: >-
  The public constitution is CC 1.0-rc2 (Accord 1.3-RC2 plus CEG, one version line). The
  sibling checkout also has unpublished CC 1.0-rc3. Runtime still loads Accord 1.2b.
  Shipped code: [CIRISAgent](https://github.com/CIRISAI/CIRISAgent) 2.9.x (phone and
  self-host), [Verify](https://github.com/CIRISAI/CIRISVerify),
  [Lens](https://github.com/CIRISAI/CIRISLens), and [Proxy](https://github.com/CIRISAI/CIRISProxy).
signatureVocabulary: >-
  Core terms include [Verify](https://github.com/CIRISAI/CIRISVerify) (authenticity
  checks), [Lens](https://github.com/CIRISAI/CIRISLens) (triage rather than final
  verdict), [H3ERE](https://ciris.ai/how-it-works/) (the 11-step conscience pipeline),
  [Agent](/cards/agent-without-anthropomorphism/), [Wise
  Authority](https://ciris.ai/how-it-works/), deferral and emergency
  [shutdown](/cards/subsumption-shutdown/), [Coherence
  Ratchet](https://ciris.ai/constitution/), M-1 principles-as-identity, signed traces, and
  NEW-04 compositional limits.
statedIntent: >-
  Public copy sells a private phone assistant plus a signed post-quantum mesh as the
  answer to superalignment. Engineer-facing text still offers accountability in validated
  sub-ASI scope, not a program to prevent ASI outright. The two registers are not bound by
  a precedence rule.
primaryCrux: >-
  CIRIS bets on named identity: if [Verify](https://github.com/CIRISAI/CIRISVerify) and
  [Lens](https://github.com/CIRISAI/CIRISLens) report green on a certified occurrence,
  does that imply [Corrigibility](/cards/mb4-correction-legitimacy/) on the real
  intervening loop—[composite agency](/cards/composite-agency/), tools, memory, and
  incentives included?
bookBridges:
  - MB1
  - MB4
  - MB4a
  - MB6
  - MB7
  - MB9
  - MB11
contributes: >-
  Engineer-facing non-claims ([Verify](https://github.com/CIRISAI/CIRISVerify) certifies
  authenticity, not ethics; [Lens](https://github.com/CIRISAI/CIRISLens) triages
  rather than delivering verdicts); unit-tested prohibition, conscience, and proxy
  fail-closed layers (50/50 smoke battery); a domain-bounded MH-3 hard-fail contrast; and
  the sharpest falsifier shape for named-identity versus [composite
  agency](/cards/composite-agency/).
bookSeparates: >-
  Signed protocol logs do not imply that the represented reasoning produced the action,
  nor that the action is honest, safe, or beneficial. Green attestation does not imply
  correction uptake. A signed agent record does not imply the real agent. Unpublished CC
  1.0-rc3 demotes Part VI as a warrant for ethics; published CC 1.0-rc2 and the
  agent-loaded Accord 1.2b still sell the older entailment.
reviewStatus: >-
  July smoke battery: 50 of 50 selected unit tests passed (prohibitions, conscience
  helpers, proxy fail-closed, verify types). Integration testing, hardware attestation,
  and adversarial gaming have not been run. August review: storefront and published CC
  fuse identity, pipeline, and traces into “safer / more ethical”; unpublished rc3 Part VI
  refuses that fusion; HARM-1 inverts the MH-3 pipeline-vs-prompt ordering. Composite
  [boundary discovery](/cards/boundary-discovery/) counterexample (Verify+Lens green,
  Wise-Authority-blind composite) remains open.
manuscriptHooks:
  - "`experiments/TODO.md`"
  - "toy T-9 `boundary_decouple`"
  - lab LS-28
  - MB1/MB4 cards
  - Accord Book IX compositional limits (NEW-04)
  - "`~/repos/ciris/review/findings/`"
