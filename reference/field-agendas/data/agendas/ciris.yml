slug: ciris
title: CIRIS
type: Institutional protocol / constitutional ops stack (manual add)
carrier: CIRIS (Eric Moore); mission-locked L3C; AGPL ecosystem
overview: >-
  CIRIS is a cryptographic and procedural accountability stack for autonomous agents, with
  [Corrigibility](/cards/mb4-correction-legitimacy/) and [Audit
  Independence](/cards/mb4a-measured-path-legitimacy/) as its primary operational test
  surfaces.
primaryArtifact: >-
  The shipped stack centers on the Accord constitution (1.3-RC2 plus CEG) and the
  CIRISAgent, [Verify](https://ciris.ai/architecture/),
  [Lens](https://ciris.ai/architecture/), and Proxy components.
signatureVocabulary: >-
  Core terms include [Verify](https://ciris.ai/architecture/) (authenticity checks),
  [Lens](https://ciris.ai/architecture/) (triage rather than final verdict),
  [Agent](/cards/agent-without-anthropomorphism/), [Wise
  Authority](https://ciris.ai/architecture/), deferral and emergency
  [shutdown](/cards/subsumption-shutdown/), [Coherence
  Ratchet](https://ciris.ai/architecture/), M-1 principles-as-identity, signed traces, and
  NEW-04 compositional limits.
statedIntent: >-
  Provide cryptographic and procedural accountability for autonomous agents in validated
  sub-ASI scope today, and serve as a candidate ASI alignment protocol only after
  release-candidate gates (CRE, red-team, Book IX validation)— explicitly not a program to
  prevent ASI outright.
primaryCrux: >-
  CIRIS bets on named identity: if [Verify](https://ciris.ai/architecture/) and
  [Lens](https://ciris.ai/architecture/) report green on a certified occurrence, does that
  imply [Corrigibility](/cards/mb4-correction-legitimacy/) on the real intervening
  loop—[composite agency](/cards/composite-agency/), tools, memory, and incentives
  included?
bookBridges:
  - MB1
  - MB4
  - MB4a
  - MB6
  - MB7
  - MB9
  - MB11
contributes: >-
  Honest operational disclaimers ([Verify](https://ciris.ai/architecture/) certifies
  authenticity, not ethics; [Lens](https://ciris.ai/architecture/) triages rather than
  delivering verdicts); unit-tested prohibition, conscience, and proxy fail-closed layers
  (50/50 smoke battery); and the sharpest falsifier shape for named-identity versus
  [composite agency](/cards/composite-agency/).
bookSeparates: >-
  Green attestation does not imply correction uptake; a signed agent record does not imply
  the real agent; Book IX geometry is aspirational rather than identical to shipped policy
  enforcement.
reviewStatus: >-
  The smoke battery passed 50 of 50 tests (prohibitions, conscience helpers, proxy
  fail-closed behavior, verify types). Integration testing, hardware attestation, and
  adversarial gaming have not been run. A key open task is a CIRIS-shaped composite
  [boundary discovery](/cards/boundary-discovery/) counterexample:
  [Verify](https://ciris.ai/architecture/) and [Lens](https://ciris.ai/architecture/)
  green while a Wise-Authority-blind composite evades correction.
manuscriptHooks:
  - "`experiments/TODO.md`"
  - "toy T-9 `boundary_decouple`"
  - lab LS-28
  - MB1/MB4 cards
  - Accord Book IX compositional limits (NEW-04)
