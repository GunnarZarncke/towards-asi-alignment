slug: ciris
title: CIRIS
type: Institutional protocol / constitutional ops stack (manual add)
carrier: CIRIS (Eric Moore); mission-locked L3C; AGPL ecosystem
overview: >-
  CIRIS is a cryptographic and procedural accountability stack for autonomous agents, with
  [Corrigibility](/cards/mb4-correction-legitimacy/) and [Audit
  Independence](/cards/mb4a-measured-path-legitimacy/) as its primary operational test
  surfaces.
primaryArtifact: >-
  The public constitution is CC 1.0-rc7 (tagged 2026-10-05; Accord and CEG under one
  version line), with rc8 on branch (eleven plain-language promises, a 441-row evidence
  register, six formal models in CI). The agent loads the Accord 1.2b conscience corpus by
  hash; it tracks the ethics text, not the wire, and an Accord 1.3 cut from CC Parts
  1/7/annexes is owed. Shipped code: [CIRISAgent](https://github.com/CIRISAI/CIRISAgent)
  2.15.0 (phone and self-host), [Verify](https://github.com/CIRISAI/CIRISVerify) 20.1.0,
  Persist 55.0.0, Edge 40.1.0, Server 0.5.224; LensCore runs distributed in Server.
signatureVocabulary: >-
  Core terms include [Verify](https://github.com/CIRISAI/CIRISVerify) (authenticity
  checks), [Lens](https://github.com/CIRISAI/CIRISLens) (triage rather than final
  verdict), [H3ERE](https://ciris.ai/how-it-works/) (the 11-step conscience pipeline),
  [Agent](/cards/agent-without-anthropomorphism/), [Wise
  Authority](https://ciris.ai/how-it-works/), deferral and emergency
  [shutdown](/cards/subsumption-shutdown/), [Coherence
  Ratchet](https://ciris.ai/constitution/), M-1 principles-as-identity, signed traces, and
  NEW-04 compositional limits.
statedIntent: >-
  Public copy still sells a signed network as the answer to superalignment ("a network
  that can hold a superhuman AI accountable"; "keeping AI honest … becomes something the
  network enforces"). The rc8 branch adds a precedence rule (N1): CIRIS does not make a
  superintelligence good, says nothing about the inside of any model, and cannot stop an
  unaccountable superintelligence forming outside it; it aims to keep people able to
  pause, correct and refuse the agents it holds; "where anything on ciris.ai reads as
  more, this sentence holds." N1 is not in the tagged rc7 release.
primaryCrux: >-
  CIRIS bets on named identity: if [Verify](https://github.com/CIRISAI/CIRISVerify) and
  [Lens](https://github.com/CIRISAI/CIRISLens) report green on a certified occurrence,
  does that imply [Corrigibility](/cards/mb4-correction-legitimacy/) on the real
  intervening loop—[composite agency](/cards/composite-agency/), tools, memory, and
  incentives included? CIRIS answers that the agent is the loop (H3ERE creates it; model,
  memory, scheduler and adapters are inside; every effect ends in a terminal
  ACTION_RESULT). That moves the crux to whether the declared boundary is total (CC
  1.13.6, CIRISConstitution#93) and whether an authorised correction reaches later policy;
  the boundary is declared, not discovered, and humans and incentives outside H3ERE remain
  outside it. Both tests are proposed as preregistered studies (RATCHET#27 UPTAKE and
  LOOP), not run.
bookBridges:
  - MB1
  - MB4
  - MB4a
  - MB6
  - MB7
  - MB9
  - MB11
contributes: >-
  Engineer-facing non-claims ([Verify](https://github.com/CIRISAI/CIRISVerify) certifies
  authenticity, not ethics; [Lens](https://github.com/CIRISAI/CIRISLens) triages
  rather than delivering verdicts); unit-tested prohibition and conscience layers (50/50
  smoke battery, July 2026, agent 2.9.x); a domain-bounded MH-3 hard-fail contrast; a
  preregistration proposal that adopts the composite counterexample (RATCHET#27 arm B1);
  and the sharpest falsifier shape for named-identity versus [composite
  agency](/cards/composite-agency/).
bookSeparates: >-
  Signed protocol logs do not imply that the represented reasoning produced the action,
  nor that the action is honest, safe, or beneficial. Green attestation does not imply
  correction uptake. A signed agent record does not imply the real agent, and a declared
  loop boundary does not imply a total one. CIRIS's rc8 text now concedes most of these
  (plain rule 2a, N1, N4; Verify authenticates origin, not ethics; Lens is triage), and
  the tagged rc7 Part 6 is symmetric geometry, not a warrant. The agent-loaded Accord
  1.2b and the storefront still sell the older entailment.
reviewStatus: >-
  July 2026 smoke battery (agent 2.9.x): 50 of 50 selected unit tests passed. August
  review: storefront and then-published CC fused identity, pipeline, and traces into
  "safer / more ethical"; HARM-1 inverted the MH-3 pipeline-vs-prompt ordering. October
  (CC rc7 tagged, rc8 on branch, per CIRIS): Part 6 demoted in the tagged text; MH-3 and
  TORQUE reported with bounds; NULLWORKS read-only assurance review (2026-08) reproduced
  42/42 selected tests and found "role is not the same as jurisdiction". Not run:
  RATCHET#27 UPTAKE and LOOP (the composite [boundary
  discovery](/cards/boundary-discovery/) counterexample is arm B1), integration and
  adversarial batteries under outside custody. ciris.ai still serves rc5 text and the
  superalignment storefront copy.
