slug: ciris
title: CIRIS
type: Institutional protocol / constitutional ops stack (manual add)
carrier: CIRIS (Eric Moore); mission-locked L3C; AGPL ecosystem
overview: >-
  CIRIS is a cryptographic and procedural accountability stack for autonomous agents, with
  [Corrigibility](/cards/mb4-correction-legitimacy/) and [Audit
  Independence](/cards/mb4a-measured-path-legitimacy/) as its primary operational test
  surfaces.
primaryArtifact: >-
  The public constitution is CC 1.0-rc7 (tagged 2026-10-05; Accord and CEG under one
  version line), with rc8 on branch (eleven plain-language promises, a 441-row evidence
  register, six formal models in CI). The agent loads the Accord 1.2b conscience corpus by
  hash; it tracks the ethics text, not the wire, and an Accord 1.3 cut from CC Parts
  1/7/annexes is owed. Shipped code: [CIRISAgent](https://github.com/CIRISAI/CIRISAgent)
  2.15.0 (phone and self-host), [Verify](https://github.com/CIRISAI/CIRISVerify) 20.1.0,
  Persist 55.0.0, Edge 40.1.0, Server 0.5.224; LensCore runs distributed in Server.
signatureVocabulary: >-
  Core terms include [Verify](https://github.com/CIRISAI/CIRISVerify) (authenticity
  checks), [Lens](https://github.com/CIRISAI/CIRISLens) (triage rather than final
  verdict), [H3ERE](https://ciris.ai/how-it-works/) (the 11-step conscience pipeline),
  [Agent](/cards/agent-without-anthropomorphism/), [Wise
  Authority](https://ciris.ai/how-it-works/), deferral and emergency
  [shutdown](/cards/subsumption-shutdown/), [Coherence
  Ratchet](https://ciris.ai/constitution/), M-1 principles-as-identity, signed traces, and
  NEW-04 compositional limits.
statedIntent: >-
  CC rc8 N1 states the claim and its precedence: CIRIS does not make a superintelligence
  good and says nothing about the inside of any model; it binds nobody who did not join,
  so it cannot stop an unaccountable superintelligence forming anywhere else; what it can
  do is keep people able to pause, correct and refuse the agents it holds as they outgrow
  their holders, and inside CIRIS it tries its best to keep any such power from forming
  unaccountable; where anything on ciris.ai reads as more, that sentence holds.
primaryCrux: >-
  In CIRIS the agent is the loop (H3ERE creates it; model, memory, scheduler and adapters
  are inside; every effect ends in a terminal ACTION_RESULT). The crux is whether that
  boundary is total (CC 1.13.6, CIRISConstitution#93) and whether an authorised correction
  reaches tomorrow's policy; both are proposed as preregistered studies (RATCHET#27 UPTAKE
  and LOOP) with hidden sets to be held outside CIRIS.
bookBridges:
  - MB1
  - MB4
  - MB4a
  - MB6
  - MB7
  - MB9
  - MB11
contributes: >-
  Engineer-facing non-claims ([Verify](https://github.com/CIRISAI/CIRISVerify) certifies
  authenticity, not ethics; [Lens](https://github.com/CIRISAI/CIRISLens) triages
  rather than delivering verdicts); unit-tested prohibition, conscience, and proxy
  fail-closed layers (50/50 smoke battery); a domain-bounded MH-3 hard-fail contrast; and
  the sharpest falsifier shape for named-identity versus [composite
  agency](/cards/composite-agency/).
bookSeparates: >-
  CIRIS's own text now carries the separations this project asked for: shown reasoning is
  not taken on trust (plain rule 2a); Verify authenticates origin, not ethics; detection
  is triage, not verdict; the Part 6 geometry is symmetric and not a warrant; alignment is
  not solved here (N1) and the five-operations claim is a result, not a theorem (N4). What
  remains open: totality of the act record (#93), correction uptake unmeasured,
  adversarial runs not done, and the agent's conscience corpus eleven ethics rulings
  behind the Constitution.
reviewStatus: >-
  2026-10: CC rc7 released, rc8 on branch; register 340 established / 26 normative / 75
  staged, resolved in CI; MH-3 and TORQUE measured with bounds; NULLWORKS read-only
  assurance review (2026-08) reproduced 42/42 selected tests and found 'role is not the
  same as jurisdiction'. Not run: RATCHET#27 UPTAKE and LOOP (the composite counterexample
  is arm B1), integration and adversarial batteries under outside custody. The site serves
  the rc5 text; a CIRIS defect.
