slug: clr-cooperation-conflict
title: CLR (cooperation / conflict)
type: Research org
carrier: Center on Long-Term Risk
overview: >-
  CLR researches cooperation under AI competition, [s-risks](https://longtermrisk.org/),
  and multipolar failure modes, including [Cooperative AI
  Foundation](https://www.cooperativeai.com/) work. Its conflict-and-cooperation framing
  asks how multi-agent dynamics behave when cooperation breaks down under strategic
  pressure. The agenda engages [Goodhart
  Selection](/cards/mb6-selection-and-basin-stability/) and [Acausal
  Coordination](/cards/mb7d-acausal-coordination/) as measurement cousins to narrative
  multipolar stories.
primaryArtifact: >-
  Research and grantmaking on cooperation under AI competition,
  [s-risks](https://longtermrisk.org/), and multipolar failure modes, including
  [Cooperative AI Foundation](https://www.cooperativeai.com/) work.
signatureVocabulary: >-
  Key terms include cooperation, conflict, [s-risks](https://longtermrisk.org/),
  [multipolar](https://arxiv.org/abs/2006.04948) failure, and
  [CAIF](https://www.cooperativeai.com/) ([Cooperative AI
  Foundation](https://www.cooperativeai.com/)).
statedIntent: >-
  Reduce worst-case outcomes that arise when AI systems compete or come into conflict with
  one another.
primaryCrux: >-
  How do multi-agent failure modes behave under strategic pressure—especially when
  cooperation breaks down?
bookBridges:
  - MB6
  - MB7d
contributes: >-
  Conflict-and-cooperation framing for alignment research, plus [Cooperative AI
  Foundation](https://www.cooperativeai.com/) work on building cooperative AI under
  competitive pressure.
bookSeparates: >-
  Typed measurement of [Goodhart Selection](/cards/mb6-selection-and-basin-stability/) and
  [Acausal Coordination](/cards/mb7d-acausal-coordination/) differs from narrative
  multipolar stories that lack the same measurement discipline.
manuscriptHooks:
