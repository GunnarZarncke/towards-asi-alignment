slug: davidad-guaranteed-safe-ai-gsai
title: davidad / Guaranteed-Safe AI (GSAI)
type: Research program (manual add — thin on map)
carrier: "David Dalrymple et al.; adjacent: LawZero, BAIF (map)"
overview: >-
  [Guaranteed-Safe AI](https://arxiv.org/abs/2405.06624) seeks formally grounded safety
  guarantees relative to an explicit specification and world model, treating open-world
  coverage as the central engineering wall.
primaryArtifact: >-
  [GSAI](https://arxiv.org/abs/2405.06624) and Open Agency specifications, plus a
  constructivist safety-case methodology for formally guaranteed systems.
signatureVocabulary: >-
  Key terms include [guaranteed safe](https://arxiv.org/abs/2405.06624), [open
  agency](https://arxiv.org/abs/2405.06624), [world
  model](https://arxiv.org/abs/2405.06624), [specification
  coverage](https://arxiv.org/abs/2405.06624), and [Scientist AI](https://lawzero.org/en).
statedIntent: >-
  Engineer AI systems with formal safety guarantees relative to an explicit specification
  and world model.
primaryCrux: >-
  Can we enumerate all safety-relevant phenomena in an open world, or will specification
  coverage always leave gaps ([Grounding Drift](/cards/mb9-grounding-certificate/))?
bookBridges:
  - MB9
  - MB11
contributes: >-
  Treats coverage and specification completeness as the central open wall for formally
  guaranteed safe systems.
bookSeparates: >-
  This project emphasizes [grounding viability](/cards/grounding-viability/) and conservative
  grounding (no silent gaps) rather than demanding full completeness of the specification;
  [Deployment Safety](/cards/mb11-deployment-safety/) is treated as a cousin agenda, not
  an identical target.
manuscriptHooks:
  - "ch43, dynamical guarantee"
  - App B MB9
