  researchers.
signatureVocabulary: >-
  Core program names include [SPAR](https://sparai.org/),
  [Pathfinder](https://pathfinder.kairos-project.org/), university-group organizing, and
  [Global Challenges Project](https://www.globalchallengesproject.org/) (GCP) workshops.
statedIntent: >-
  Accelerate talent into AI safety through structured programs, campus organizing, and
  mentored research placements.
primaryCrux: >-
  Like other training agendas, program throughput and participant quality do not imply
  resolution of technical alignment cruxes; the bottleneck is still mechanism discovery,
  not talent discovery.
