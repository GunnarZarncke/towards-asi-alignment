slug: kairos-field-building
title: Kairos (field-building)
type: Training / field-building org
carrier: Kairos
overview: >-
  Kairos operates SPAR mentored research, Pathfinder career programs, Global Challenges
  Project workshops, and Generator Residency placements for emerging AI safety
  researchers. Like other field-building agendas, program throughput accelerates talent
  discovery rather than mechanism discovery. Participants seed early work across subfields
  while the [Field hub](/field/) tracks which technical cruxes—such as [composite
  agency](/cards/composite-agency/)—remain open.
primaryArtifact: >-
