slug: kosoy-infra-bayesianism-lta
title: "Kosoy / infra-Bayesianism & LTA"
type: Researcher lineage
carrier: Vanessa Kosoy (+ Appel; logical-induction neighborhood via Garrabrant)
overview: >-
  Vanessa Kosoy's [learning-theoretic
  agenda](https://www.alignmentforum.org/posts/5bd75cc58225bf0670375575/the-learning-theoretic-ai-alignment-research-agenda)
  (LTA) aims to create a general mathematical theory of intelligent agents, so that
  alignment claims can be proved or rigorously conjectured relative to stated
  assumptions. Frequentist guarantees (regret bounds) are a *standard of
  understanding* in that theory.
  [Nonrealizability](/cards/subsumption-grounding-drift/) (the true environment is
  not in the hypothesis class) and inner [daemons](https://www.alignmentforum.org/posts/ZwshvqiqCvXPsZEct/the-learning-theoretic-agenda-status-2023)
  are among the *problems* the theory is built to treat.
  [Infra-Bayesianism](https://www.lesswrong.com/w/infra-bayesianism) is a major
  constructive layer for deep uncertainty—not the whole agenda.
  [Infra-Bayesian physicalism](https://www.lesswrong.com/posts/gHgs2e2J5azvGFatb/infra-bayesian-physicalism-a-formal-theory-of-naturalized)
  (later also Formal Computational Realism) adds a physicalist/computational-realist
  ontology; the [bridge transform](https://www.lesswrong.com/posts/gHgs2e2J5azvGFatb/infra-bayesian-physicalism-a-formal-theory-of-naturalized)
  is a core construction of that layer, with a role independent of outer alignment.
  [Physicalist Superimitation](https://www.alignmentforum.org/posts/ZwshvqiqCvXPsZEct/the-learning-theoretic-agenda-status-2023)
  (PSI; formerly [PreDCA](https://www.alignmentforum.org/w/predca); later also
  Computational Superimitation) is a hypothesized protocol *on top of* that
  stack: identify the user as an agent in the physicalist ontology and
  *superimitate* their values (learn them and pursue them substantially better).
  The 2022 PreDCA writeup centered a “precursor” pointer; later PSI formulations
  do not treat precursor as central.
primaryArtifact: >-
  The [learning-theoretic
  agenda](https://www.alignmentforum.org/posts/5bd75cc58225bf0670375575/the-learning-theoretic-ai-alignment-research-agenda),
  the [Infra-Bayesianism sequence](https://www.lesswrong.com/w/infra-bayesianism),
  [infra-Bayesian
  physicalism](https://www.lesswrong.com/posts/gHgs2e2J5azvGFatb/infra-bayesian-physicalism-a-formal-theory-of-naturalized),
  and the [Physicalist Superimitation](https://www.alignmentforum.org/posts/ZwshvqiqCvXPsZEct/the-learning-theoretic-agenda-status-2023)
  protocol (formerly [PreDCA](https://www.alignmentforum.org/w/predca)).
signatureVocabulary: >-
  Key terms include the [learning-theoretic
  agenda](https://www.alignmentforum.org/posts/5bd75cc58225bf0670375575/the-learning-theoretic-ai-alignment-research-agenda),
  [infra-Bayesianism](https://www.lesswrong.com/w/infra-bayesianism),
  [infra-Bayesian
  physicalism](https://www.lesswrong.com/posts/gHgs2e2J5azvGFatb/infra-bayesian-physicalism-a-formal-theory-of-naturalized)
  / Formal Computational Realism, the bridge transform, regret bounds,
  nonrealizability, daemons, and [Physicalist
  Superimitation](https://www.alignmentforum.org/posts/ZwshvqiqCvXPsZEct/the-learning-theoretic-agenda-status-2023)
  / [PreDCA](https://www.alignmentforum.org/w/predca) / Computational Superimitation.
statedIntent: >-
  Create a general mathematical theory of intelligent agents, and—as one
  hypothesized application, not the agenda’s main motivation—a protocol that
  reliably learns and acts on the user’s values (Physicalist Superimitation).
primaryCrux: >-
  Can a learning-theoretic theory of intelligent agents be built tightly enough
  to license alignment claims under stated assumptions, including
  misspecification, inner daemons, and recursive self-improvement? For
  Physicalist Superimitation: can agent detection and user identification pick
  out the intended user (including under simulation hypotheses), and does
  superimitation of inferred values stay well-defined when the world-model
  ontology is wrong?
bookBridges:
  - MB1
  - MB2
  - MB3
  - MB5
  - MB7
  - MB9
contributes: >-
  Model-class misspecification and grain-of-truth analysis; regret-bounded
  agents; inner daemons; [infra-Bayesian
  physicalism](https://www.lesswrong.com/posts/gHgs2e2J5azvGFatb/infra-bayesian-physicalism-a-formal-theory-of-naturalized)
  and the bridge transform as a physicalist layer; [Physicalist
  Superimitation](https://www.alignmentforum.org/posts/ZwshvqiqCvXPsZEct/the-learning-theoretic-agenda-status-2023)
  as a sibling outer-alignment protocol (superimitation after agent detection
  and user identification), reached through a different formal path than
  [CIRL](/cards/subsumption-cirl/)-style pointing.
bookSeparates: >-
  This project maps LTA’s problems onto [Embedded
  Agency](/cards/mb1-boundary-estimator-soundness/), [Value
  Learning](/cards/mb2-bundle-identifiability/), [Value
  Referent](/cards/mb3-bearer-import/), [Tiling](/cards/mb5-successor-ontology-shift/),
  [Inner Alignment](/cards/mb7-hidden-capability-and-access/), and [Grounding
  Drift](/cards/mb9-grounding-certificate/), with [Acausal
  Coordination](/cards/mb7d-acausal-coordination/) as a logical-induction
  neighborhood cousin—it does not treat LTA as a replacement ontology. On the
  outer endpoint, PSI is a peer proposal for learning and acting on the user’s
  values. This project *names separately* three checks it still wants: whether
  inferred values remain [usable directions of control after
  transformation](/cards/value-bundle-transport/) (not only preserved labels),
  whether they keep applying to the [right persons or
  processes](/cards/bearer-persistence/), and whether a [correction
  process](/cards/correction-channel-integrity/) stays open. Kosoy’s protocol is
  meant to address usable control (superimitation of inferred user values).
  Whether those three remain separately checkable after PSI, or whether the
  protocol already discharges them, is an open disagreement—not a claim that PSI
  is missing those pieces in her terms.
