slug: kosoy-infra-bayesianism-lta
title: "Kosoy / infra-Bayesianism & LTA"
type: Researcher lineage
carrier: Vanessa Kosoy (+ Appel; logical-induction neighborhood via Garrabrant)
overview: >-
  Vanessa Kosoy's [learning-theoretic
  agenda](https://www.alignmentforum.org/posts/5bd75cc58225bf0670375575/the-learning-theoretic-ai-alignment-research-agenda)
  (LTA) builds a mathematical theory of intelligence and alignment grounded in regret
  bounds, daemons, and [nonrealizability](/cards/subsumption-grounding-drift/).
  [Infra-Bayesianism](https://www.lesswrong.com/w/infra-bayesianism) and [infra-Bayesian
  physicalism](https://www.lesswrong.com/posts/gHgs2e2J5azvGFatb/infra-bayesian-physicalism-a-formal-theory-of-naturalized)
  are major constructive layers—not the whole agenda. The outer-alignment strand
  [Physicalist
  Superimitation](https://www.alignmentforum.org/posts/ZwshvqiqCvXPsZEct/the-learning-theoretic-agenda-status-2023)
  (formerly [PreDCA](https://www.alignmentforum.org/w/predca)) proposes precursor-utility
  pointing via the bridge transform. Its walls map onto [Embedded
  Agency](/cards/mb1-boundary-estimator-soundness/), [Value
  Learning](/cards/mb2-bundle-identifiability/), [Value
  Referent](/cards/mb3-bearer-import/), [Inner
  Alignment](/cards/mb7-hidden-capability-and-access/), and [Grounding
  Drift](/cards/mb9-grounding-certificate/) without replacing this project's
  System–bundle–correction ontology.
primaryArtifact: >-
  The [learning-theoretic
  agenda](https://www.alignmentforum.org/posts/5bd75cc58225bf0670375575/the-learning-theoretic-ai-alignment-research-agenda),
  the [Infra-Bayesianism sequence](https://www.lesswrong.com/w/infra-bayesianism), and the
  [Physicalist Superimitation / PreDCA](https://www.alignmentforum.org/w/predca)
  outer-alignment protocol built on [infra-Bayesian
  physicalism](https://www.lesswrong.com/posts/gHgs2e2J5azvGFatb/infra-bayesian-physicalism-a-formal-theory-of-naturalized).
signatureVocabulary: >-
  Key terms include [infra-Bayesianism](https://www.lesswrong.com/w/infra-bayesianism),
  the [learning-theoretic
  agenda](https://www.alignmentforum.org/posts/5bd75cc58225bf0670375575/the-learning-theoretic-ai-alignment-research-agenda),
  [PreDCA](https://www.alignmentforum.org/w/predca) / [Physicalist
  Superimitation](https://www.alignmentforum.org/posts/ZwshvqiqCvXPsZEct/the-learning-theoretic-agenda-status-2023),
  imprecise probability, [nonrealizability](/cards/subsumption-grounding-drift/), daemons,
  and the bridge transform.
statedIntent: >-
  Build a mathematical theory of intelligence and alignment—regret-bounded agents under
  deep uncertainty, with a constructive outer-alignment endpoint (precursor-utility
  assistance).
primaryCrux: >-
  Can learning-theoretic and infra-Bayesian frameworks type real alignment
  failures—misspecification, inner daemons, recursive self-improvement—and does
  precursor-utility pointing survive simulation and ontology ambiguity?
bookBridges:
  - MB1
  - MB2
  - MB3
  - MB5
  - MB7
  - MB9
contributes: >-
  Model-class misspecification and grain-of-truth analysis; regret-bounded agents; inner
  daemons; [infra-Bayesian
  physicalism](https://www.lesswrong.com/posts/gHgs2e2J5azvGFatb/infra-bayesian-physicalism-a-formal-theory-of-naturalized)
  and the bridge transform; [PreDCA](https://www.alignmentforum.org/w/predca) as a sibling
  outer-alignment endpoint reached through a different formal path than
  [CIRL](/cards/subsumption-cirl/)-style pointing.
bookSeparates: >-
  This work does not replace this project's System–bundle–correction ontology; its walls
  map onto [Embedded Agency](/cards/mb1-boundary-estimator-soundness/), [Value
  Learning](/cards/mb2-bundle-identifiability/), [Value
  Referent](/cards/mb3-bearer-import/), [Tiling](/cards/mb5-successor-ontology-shift/),
  [Inner Alignment](/cards/mb7-hidden-capability-and-access/), and [Grounding
  Drift](/cards/mb9-grounding-certificate/), with [Acausal
  Coordination](/cards/mb7d-acausal-coordination/) as a logical-induction neighborhood
  cousin. The PreDCA/PSI endpoint alone is not sufficient;
  [value-bundle-transport](/cards/value-bundle-transport/),
  [bearer-persistence](/cards/bearer-persistence/), and the correction process remain
  load-bearing.
manuscriptHooks:
  - App B intervention map (logical induction / infra-Bayesian cluster)
