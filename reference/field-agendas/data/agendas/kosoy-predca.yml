slug: kosoy-predca
title: Kosoy / PreDCA
type: Researcher lineage (outer-alignment strand)
carrier: Vanessa Kosoy
overview: >-
  [PreDCA](https://www.alignmentforum.org/w/predca) (precursor detection, classification,
  and assistance) is Kosoy's outer-alignment framework built on [infra-Bayesian
  physicalism](https://www.lesswrong.com/w/infra-bayesianism), targeting assistance to an
  aggregate of causal precursors. It offers a sibling outer-alignment endpoint reached
  through a different formal path than [CIRL](/cards/subsumption-cirl/)-style pointing.
  The endpoint alone does not discharge [value-bundle
  transport](/cards/value-bundle-transport/) or
  [bearer-persistence](/cards/bearer-persistence/) under optimization.
primaryArtifact: >-
  [PreDCA](https://www.alignmentforum.org/w/predca) (precursor detection, classification,
  and assistance)—an outer-alignment framework built on [infra-Bayesian
  physicalism](https://www.lesswrong.com/w/infra-bayesianism).
signatureVocabulary: >-
  Key terms include [PreDCA](https://www.alignmentforum.org/w/predca), [precursor
  agents](https://www.alignmentforum.org/posts/vanessa-kosoy-s-predca-distilled), and
  [infra-Bayesian physicalism](https://www.lesswrong.com/w/infra-bayesianism) as a
  constructive layer.
statedIntent: >-
  Pursue outer alignment by assisting an aggregate of causal precursors (the human user).
primaryCrux: >-
  Does precursor-utility pointing survive simulation and ontology ambiguity?
bookBridges:
