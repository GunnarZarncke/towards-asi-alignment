  - MB8
contributes: >-
  A sibling outer-alignment endpoint; an assistance-game cousin reached through a
  different formal path.
bookSeparates: >-
  The endpoint alone is not sufficient;
  [value-bundle-transport](/cards/value-bundle-transport/),
  [bearer-persistence](/cards/bearer-persistence/), and the correction process remain
  load-bearing.
