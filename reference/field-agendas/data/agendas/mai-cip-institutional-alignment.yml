slug: mai-cip-institutional-alignment
title: MAI + CIP (institutional alignment)
type: Research org cluster
carrier: >-
  Meaning Alignment Institute (Joe Edelman et al.); Collective Intelligence Project (Divya
  Siddarth, Saffron Huang et al.)
overview: >-
  MAI and CIP pursue full-stack alignment through thick values, alignment assemblies, and
  collective [constitutional
  AI](https://www.anthropic.com/research/constitutional-ai-harmlessness-from-ai-feedback)—aligning
  AI–institution systems rather than model behavior in isolation. The agenda asks whether
  deliberative processes stay identifiable and contestable under strategic pressure and AI
  mediation. Legitimate institutional output does not imply [correction-channel
  integrity](/cards/correction-channel-integrity/) or institutional-selection-gating that
  survives optimization.
primaryArtifact: >-
  Full-Stack Alignment research, alignment assemblies, collective [constitutional
  AI](https://www.anthropic.com/research/constitutional-ai-harmlessness-from-ai-feedback),
  and thick-value / institutional design programmes.
signatureVocabulary: >-
  Key terms include full-stack alignment, thick values, alignment assemblies, deliberative
  alignment, and collective [constitutional
  AI](https://www.anthropic.com/research/constitutional-ai-harmlessness-from-ai-feedback).
statedIntent: >-
  Align AI–institution systems and legitimate value aggregation—not model behavior in
  isolation.
primaryCrux: >-
  Can thick values and deliberative processes stay identifiable, contestable, and robust
  under strategic pressure and AI mediation?
bookBridges:
  - MB2
  - MB4a
  - MB6
  - MB8
contributes: >-
  Institutional amplification as a failure mode; operational deliberative alignment;
  counterfactual value commitments distinguished from surface preferences.
bookSeparates: >-
  A legitimate process does not imply [correction-channel
  integrity](/cards/correction-channel-integrity/); consensus output does not imply
  [bearer-persistence](/cards/bearer-persistence/) under optimization.
manuscriptHooks:
  - ch04 value bundles adjacent
  - App C institutional translation
