slug: miri
title: MIRI
type: Research org / advocacy
carrier: Machine Intelligence Research Institute
overview: >-
  MIRI studies [agent foundations](https://intelligence.org/)—the theoretical problems
  that arise when building highly capable AI—and has increasingly emphasized policy
  advocacy for pause and [off-switch](/cards/subsumption-shutdown/) measures when
  technical solutions look insufficient.
primaryArtifact: >-
  The [Agent Foundations](https://intelligence.org/) technical agenda (including [Embedded
  Agency](/cards/mb1-boundary-estimator-soundness/) work) and policy or pause outreach,
  notably the 2024 strategy update.
signatureVocabulary: >-
  Core terms include [embedded agency](/cards/mb1-boundary-estimator-soundness/),
  [corrigibility](/cards/mb4-correction-legitimacy/),
  [tiling](/cards/mb5-successor-ontology-shift/), [Vingean
  reflection](https://intelligence.org/files/VingeanReflection.pdf), [value
  learning](/cards/mb2-bundle-identifiability/), [hard
  pause](https://intelligence.org/2024/01/04/miri-2024-mission-and-strategy-update/), and
  [off-switch](/cards/subsumption-shutdown/).
statedIntent: >-
  Steer transformative AI away from extinction risk by framing alignment as an
  agent-foundations problem and prioritizing policy measures such as pause and
  [off-switch](/cards/subsumption-shutdown/) when technical progress stalls.
primaryCrux: >-
  There may be no clean cut between an AI and its environment ([Embedded
  Agency](/cards/mb1-boundary-estimator-soundness/));
  [corrigibility](/cards/mb4-correction-legitimacy/) may be anti-natural; and successor
  systems may not inherit trust under ontology change
  ([Tiling](/cards/mb5-successor-ontology-shift/)).
bookBridges:
  - MB1
  - MB4
  - MB5
  - MB8
contributes: >-
  Canonical problem statements for [embedded
  agency](/cards/mb1-boundary-estimator-soundness/) and
  [corrigibility](/cards/mb4-correction-legitimacy/), plus a decision-theoretic lineage
  that shaped much of the field's early vocabulary.
bookSeparates: >-
  This project treats [boundary discovery](/cards/boundary-discovery/) as an operational bet
  on [Embedded Agency](/cards/mb1-boundary-estimator-soundness/), and distinguishes
  trajectory-level [correction-channel integrity](/cards/correction-channel-integrity/)
  from a single-bit shutdown mechanism.
manuscriptHooks:
  - App B MB1/MB4/MB5 notes
  - "ch07, ch25, ch28"
links:
