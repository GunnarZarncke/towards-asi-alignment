slug: neglected-approaches-portfolio
title: Neglected approaches portfolio
type: Research portfolio cluster (AE Studio–led)
overview: >-
  AE Studio's *Neglected Approaches* strategy (Berg, Carauleanu, Rosenblatt; Dec 2023 / Jan 2024)
  treats alignment as a vast, still largely unexplored space where dominant agendas may sit on local
  maxima. The bet is **many low-probability, high-upside shots on goal**: parallel pursuit of creative,
  plausible directions underused by the field, especially where AE's BCI, neuroscience, and
  consulting-scale engineering stack is a comparative advantage. AE bootstrapped from a profitable
  consultancy reinvesting toward human-agency technologies (originally BCI-first); shortening
  timelines shifted emphasis toward direct technical alignment while keeping the portfolio logic. The
  published ten-direction menu is explicitly **evolving first-pass guesses**, not a fixed official
  agenda—and many items are community-wide neglected ideas AE may not be best placed to implement alone.
carrier: >-
  AE Studio (lead: consultancy-funded alignment team); portfolio affiliates include aintelope (Gunnar
  Zarncke / UAD), Steven Byrnes (brain-like safety), Heitzig human-power objective line, SOO programme
  (Marc Carauleanu et al.)
primaryArtifact: >-
  Neglected-approaches portfolio strategy; AI Safety Interventions breadth map; object-level lines
  including UAD/agency-detect, prosociality reverse-engineering (SOO, theory of mind, attention
  schema), BCI value-mapping / RLNF, provably safe architectures, neuroscience×mech-interp,
  field-building, safety-business incubation, consulting-scale project execution
signatureVocabulary: >-
  neglected approaches, many shots on goal, human agency, BCI, RLNF, prosociality
  reverse-engineering, self-other overlap (SOO), UAD, brain-like AGI safety, human-power objective,
  AI Safety Interventions
statedIntent: >-
  Improve exploratory coverage of alignment by funding and executing a diversified set of plausible
  neglected technical and institutional directions—aiming for superintelligent AI that at minimum does
  not destroy humanity and ideally increases agency and flourishing
primaryCrux: >-
  Which neglected routes survive unified optimization pressure—and which portfolio bets compound vs.
  diffuse effort?
bookBridges:
  - MB1 (partial)
  - MB2
  - MB4
  - MB6 (partial)
  - MB7 (partial)
contributes: >-
  Portfolio meta-strategy and intervention catalog (`zarncke2025interventions`); Heitzig human-power
  outer target; UAD/agency-detect boundary discovery; Byrnes social-cognition / homeostatic hypotheses;
  SOO deception-reduction line; AE ten-direction menu (prosociality, TAI→BCI→researchers, value mapping,
  RLNF, provably safe architectures, field-building, safety businesses, consultancy scale-up,
  neuroscience×interp, neglected policy)
bookSeparates: >-
  Portfolio breadth ⇏ single discharge path; any one outer objective still needs adversarial-verifiability
  argument (App B MB4 note)
manuscriptHooks:
