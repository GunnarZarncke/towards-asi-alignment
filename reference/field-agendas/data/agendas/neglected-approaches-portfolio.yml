slug: neglected-approaches-portfolio
title: Neglected approaches portfolio
type: Research portfolio cluster (AE Studio–led)
carrier: >-
  AE Studio (lead: consultancy-funded alignment team); portfolio affiliates include
  aintelope (Gunnar Zarncke / UAD), Steven Byrnes (brain-like safety), Heitzig human-power
  objective line, SOO programme (Marc Carauleanu et al.)
overview: >-
  AE Studio's *Neglected Approaches* strategy (Berg, Carauleanu, Rosenblatt; Dec 2023 /
  Jan 2024) treats alignment as a vast, still largely unexplored space where dominant
  agendas may sit on local maxima. The bet is **many low-probability, high-upside shots on
  goal**: parallel pursuit of creative, plausible directions underused by the field,
  especially where AE's BCI, neuroscience, and consulting-scale engineering stack is a
  comparative advantage. AE bootstrapped from a profitable consultancy reinvesting toward
  human-agency technologies (originally BCI-first); shortening timelines shifted emphasis
  toward direct technical alignment while keeping the portfolio logic. The published
  ten-direction menu is explicitly **evolving first-pass guesses**, not a fixed official
  agenda—and many items are community-wide neglected ideas AE may not be best placed to
  implement alone.
primaryArtifact: >-
  The portfolio publishes a neglected-approaches strategy and an [AI Safety
  Interventions](https://www.lesswrong.com/posts/6Sf9KMMDMFSauDe85/ai-safety-interventions)
  breadth map, plus object-level lines including
  [UAD](https://www.lesswrong.com/posts/pXYosC3eoS9GrDRAw/unsupervised-agent-discovery)
  and agency-detect, prosociality reverse-engineering (SOO, theory of mind, attention
  schema), BCI value-mapping and RLNF, provably safe architectures, neuroscience crossed
  with [mechanistic interpretability](https://www.anthropic.com/research), field-building,
  safety-business incubation, and consulting-scale project execution.
signatureVocabulary: >-
  Recurring terms include [neglected
  approaches](https://ae.studio/essays/ae-studios-alignment-agenda-the-neglected-approaches-approach),
  many shots on goal, human agency, BCI, [RLNF](https://ae.studio/alignment), prosociality
  reverse-engineering, [self-other overlap](https://arxiv.org/abs/2412.16325)
  ([SOO](https://arxiv.org/abs/2412.16325)),
  [UAD](https://www.lesswrong.com/posts/pXYosC3eoS9GrDRAw/unsupervised-agent-discovery),
  [brain-like AGI
  safety](https://www.lesswrong.com/posts/4basF9w9jaPZpoC8R/intro-to-brain-like-agi-safety-1-what-s-the-problem-and-why/),
  [human-power objective](https://arxiv.org/abs/2508.00159), and the [AI Safety
  Interventions](https://www.lesswrong.com/posts/6Sf9KMMDMFSauDe85/ai-safety-interventions)
  catalog.
statedIntent: >-
  Improve exploratory coverage of alignment by funding and executing a diversified set of
  plausible neglected technical and institutional directions—aiming for superintelligent
  AI that at minimum does not destroy humanity and ideally increases agency and
  flourishing.
primaryCrux: >-
  Which neglected routes survive unified optimization pressure—and which portfolio bets
  compound versus diffuse effort across incompatible outer targets?
bookBridges:
  - MB1
  - MB2
  - MB4
  - MB6
  - MB7
contributes: >-
  Portfolio meta-strategy and an intervention catalog (`zarncke2025interventions`);
  Heitzig's human-power outer target;
  [UAD](https://www.lesswrong.com/posts/pXYosC3eoS9GrDRAw/unsupervised-agent-discovery)
  and agency-detect [boundary discovery](/cards/boundary-discovery/); Byrnes's
  social-cognition and homeostatic hypotheses; the SOO deception-reduction line; and AE's
  ten-direction menu spanning prosociality, TAI-to-BCI-to-researchers pipelines, value
  mapping, RLNF, provably safe architectures, field-building, safety businesses,
  consultancy scale-up, neuroscience crossed with interpretability, and neglected policy.
bookSeparates: >-
  Portfolio breadth does not imply a single discharge path through the measurement spine;
  any one outer objective still needs its own adversarial-verifiability argument for
  [Corrigibility](/cards/mb4-correction-legitimacy/) and [correction-channel
  integrity](/cards/correction-channel-integrity/).
manuscriptHooks:
  - App B intervention map source
  - ch04/ch15/ch25 adjacent
