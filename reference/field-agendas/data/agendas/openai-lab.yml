slug: openai-lab
title: OpenAI (safety)
type: Capabilities lab + alignment/eval stack
carrier: OpenAI safety, preparedness, and alignment teams
overview: >-
  OpenAI trains frontier models under a public Preparedness Framework and ships
  alignment methods used across the field: RLHF, process supervision,
  deliberative/spec-grounded training, weak-to-strong generalization, and
  anti-scheming work (often with Apollo).
primaryArtifact: >-
  The [Preparedness
  Framework](https://openai.com/safety/preparedness/), RLHF and instruction-following
  stacks, [deliberative alignment](https://openai.com/index/deliberative-alignment/),
  [weak-to-strong generalization](https://arxiv.org/abs/2312.09390), and joint
  anti-scheming evaluations with Apollo.
signatureVocabulary: >-
  Recurring terms include [Preparedness
  Framework](https://openai.com/safety/preparedness/), [RLHF](https://arxiv.org/abs/1706.03741),
  deliberative alignment, spec-grounded training, [process
  supervision](https://arxiv.org/abs/2305.20050), [weak-to-strong
  generalization](https://arxiv.org/abs/2312.09390), and anti-scheming training.
statedIntent: >-
  Build generally capable systems and keep them steerable under a staged risk
  framework, including by automating parts of alignment research.
primaryCrux: >-
  Do lab methods and the Preparedness Framework keep pace with capability
  growth, including under [strategic opacity](/cards/strategic-opacity/) and
  [Inner Alignment](/cards/mb7-hidden-capability-and-access/), or do they mainly
  produce on-distribution compliance?
bookBridges:
  - MB2
  - MB6
  - MB7
  - MB11
contributes: >-
  Industry-standard preference fine-tuning, process supervision, weak-to-strong
  as an existence proof that a strong model can exceed a weak supervisor's
  labels, deliberative alignment, and a public capability-threshold framework.
bookSeparates: >-
  A Preparedness gate is not a preservation-layer certificate ([Deployment
  Safety](/cards/mb11-deployment-safety/)). Weak-to-strong and spec reasoning do
  not imply [correction-channel integrity](/cards/correction-channel-integrity/)
  or that reduced observed scheming is reduced scheming rather than concealment.
