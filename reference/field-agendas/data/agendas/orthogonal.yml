slug: orthogonal
title: Orthogonal
type: Research org
carrier: Orthogonal (Tamsin Leake)
overview: >-
  Orthogonal is an agent-foundations research community advancing formal alignment work
  through Discord and papers. It asks whether community-organized research can discharge
  the same formal walls as established agent-foundations lineages—[embedded
  agency](/cards/mb1-boundary-estimator-soundness/),
  [corrigibility](/cards/mb4-correction-legitimacy/), and related obstructions. Active
  work engages [Embedded Agency](/cards/mb1-boundary-estimator-soundness/) and
  [Corrigibility](/cards/mb4-correction-legitimacy/) as typed targets.
primaryArtifact: >-
  An agent-foundations research community (Discord plus papers) advancing formal alignment
  work.
signatureVocabulary: >-
  Key terms include [agent foundations](https://intelligence.org/), formal alignment, and
  embedded agents.
statedIntent: >-
  Advance formal agent-foundations alignment research.
primaryCrux: >-
  Can a community-organized research program discharge the same formal walls as MIRI and
  CHAI—[embedded agency](/cards/mb1-boundary-estimator-soundness/),
  [corrigibility](/cards/mb4-correction-legitimacy/), and related obstructions?
bookBridges:
  - MB1
  - MB2
  - MB4
contributes: >-
  An active agent-foundations research community working on the Embedded Agency
  cut and MIRI/CHAI corrigibility as walls to close, plus QACI as a proposed
  formal goal.
bookSeparates: >-
  [Embedded Agency](/cards/mb1-boundary-estimator-soundness/) is the same cut
  problem Orthogonal inherits from MIRI; this map bets a measured cut can be
  sound, they bet the formal obstruction must be closed.
  [Corrigibility](/cards/mb4-correction-legitimacy/) here is whether the
  correction process stays intact; Orthogonal's wall is MIRI/CHAI type-signature
  corrigibility. QACI is a peer outer target ([Value
  Learning](/cards/mb2-bundle-identifiability/)), not a corrigibility result.
