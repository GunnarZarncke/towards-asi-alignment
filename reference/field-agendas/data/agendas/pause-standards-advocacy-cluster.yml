slug: pause-standards-advocacy-cluster
title: Pause / standards advocacy cluster
type: Advocacy coalition
carrier: "PauseAI, FLI, ControlAI, Encode, Stop AI (distinct tactics, shared vocabulary)"
overview: >-
  The pause and standards advocacy cluster—PauseAI, FLI, ControlAI, Encode, and
  allies—pursues policy campaigns, moratorium advocacy, and verified-slowdown narratives
  to reduce extinction risk from advanced AI. Its primary lever is schedule and selection
  ecology rather than mechanism discharge. Advocacy can shape [Goodhart
  Selection](/cards/mb6-selection-and-basin-stability/) basin transitions without
  resolving the full bridge stack from [embedded
  agency](/cards/mb1-boundary-estimator-soundness/) through successor gaming.
primaryArtifact: >-
  Policy campaigns, SB 53 / RAISE-style bills, and ControlAI's Narrow Path advocacy
  programme.
signatureVocabulary: >-
  Key terms include [pause](https://pauseai.info/),
  [moratorium](https://futureoflife.org/open-letter/pause-giant-ai-experiments/),
  standards, [off-switch](/cards/subsumption-shutdown/) priority, and verified slowdown.
statedIntent: >-
  Change policy and public narrative to reduce extinction risk from advanced AI.
primaryCrux: >-
  Can advocacy create enforceable slowdown without collateral governance failure?
bookBridges:
  - MB6
  - MB8
contributes: >-
  Schedule shapes for governance stress tests (Appendix F deferred section).
bookSeparates: >-
  A pause or standards handle does not discharge the full alignment bridge stack from
  [Embedded Agency](/cards/mb1-boundary-estimator-soundness/) through [Successor
  Gaming](/cards/mb10-successor-forgeability/); it mainly shapes [Goodhart
  Selection](/cards/mb6-selection-and-basin-stability/) basin transition conditions, with
  [Extrapolated Volition](/cards/mb8-cev-process-convergence/) as a secondary route.
manuscriptHooks:
  - App C MIRI hard-pause vs Plan A
  - ch38 conductive artifacts
