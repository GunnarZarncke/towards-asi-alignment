  [singular learning](https://www.timaeus.ai/) ([Timaeus](https://www.timaeus.ai/)).
statedIntent: >-
  Pursue alignment approaches that can be automated and checked with high confidence.
primaryCrux: >-
  Can formal and automated pipelines scale to superintelligent alignment?
