statedIntent: >-
  Preserve human-correctable value-bearing processes under capability growth, ontology
  shift, successor replacement, and selection pressure—stated as a measurement program
  rather than a single training recipe.
primaryCrux: >-
  Can typed bridges compose under an explicit adversarial-verifiability antecedent, or do
  standard non-converses block naive closure arguments?
