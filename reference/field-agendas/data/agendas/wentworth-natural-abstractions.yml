slug: wentworth-natural-abstractions
title: Wentworth / natural abstractions
type: Researcher lineage
carrier: John Wentworth (+ LessWrong NAH cluster)
overview: >-
  John Wentworth's natural-abstractions lineage develops the [Natural Abstraction
  Hypothesis](https://www.alignmentforum.org/users/John+Wentworth), [selection
  theorems](https://www.alignmentforum.org/users/John+Wentworth), and a compression-based
  theory of agency. It asks whether the abstractions that survive optimization align with
  value-relevant structure at scale. Convergent macro-variables can inform [Value
  Learning](/cards/mb2-bundle-identifiability/) targets but do not discharge
  [Tiling](/cards/mb5-successor-ontology-shift/) transport on their own.
primaryArtifact: >-
  The lineage centers on the [Natural Abstraction
  Hypothesis](https://www.alignmentforum.org/users/John+Wentworth), [selection
  theorems](https://www.alignmentforum.org/users/John+Wentworth) that predict which
  abstractions survive optimization, and a compression-based theory of agency.
signatureVocabulary: >-
  Signature terms include [natural
  abstractions](https://www.alignmentforum.org/users/John+Wentworth), [selection
  theorems](https://www.alignmentforum.org/users/John+Wentworth), [natural
  latents](https://www.alignmentforum.org/users/John+Wentworth), and agency as
  compression—the idea that useful macro-variables emerge reliably from messy
  micro-dynamics.
statedIntent: >-
  Develop a mathematical theory of abstractions and agency that could constrain what
  alignment targets are even learnable under optimization pressure.
primaryCrux: >-
  Do [natural abstractions](https://www.alignmentforum.org/users/John+Wentworth)—the
  variables that survive selection—align with value-relevant structure when systems are
  trained or deployed at scale?
bookBridges:
  - MB2
  - MB3
  - MB1
contributes: >-
  The [Natural Abstraction
  Hypothesis](https://www.alignmentforum.org/users/John+Wentworth) acts as a falsifier for
  low-dimensional value stories: if the wrong latents are natural, naive [Value
  Learning](/cards/mb2-bundle-identifiability/) and [Value
  Referent](/cards/mb3-bearer-import/) targets may misfire even when surface training
  looks successful (see ch17 WWCTV).
bookSeparates: >-
  The book types bundle geometry and ontology-shift transport separately;
  natural-abstraction convergence is informative but is not promoted to a load-bearing
  spine assumption—[Tiling](/cards/mb5-successor-ontology-shift/) still needs its own
  discharge argument.
manuscriptHooks:
  - ch17
  - App B shard/NAH row
links:
