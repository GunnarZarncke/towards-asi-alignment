# Field matrix bridge nouns + semantic crux wording (MB* keys unchanged).
# Source of truth for Field hub matrix headers and MB card field-agree/differ copy.
# Site MB card titles: metadata/bridges.yml (keep in sync on noun/cruxWording).
# Regenerate: cd site && npm run sync:field-agendas

bridges:
  - key: MB1
    noun: Embedded Agency
    cruxWording: A measured agent–environment cut is sound enough that the certified unit is the real control locus.
    leanAxiom: MB1_estimator_soundness
    cardSlug: mb1-boundary-estimator-soundness
    fieldAgree: MIRI embedded agency; CIRIS named-identity bet (ops form).
    fieldDiffer: Obstruction (MIRI) vs recoverability/discovery (TSA); Wentworth convergent structure vs estimator soundness.
  - key: MB2
    noun: Value Learning
    cruxWording: Evidence identifies a stable intended value/objective structure (not surface training compliance alone).
    leanAxiom: MB2_bundle_identifiability
    cardSlug: mb2-bundle-identifiability
    fieldAgree: MIRI value learning; CHAI pointing/CIRL; outer alignment “right target.”
    fieldDiffer: ELK = latent-readout slice; PreDCA/QACI = peer outer targets; book splits referent to MB3.
  - key: MB3
    noun: Value Referent
    cruxWording: Who or what values apply to survives substrate and representation change.
    leanAxiom: MB3_bearer_import
    cardSlug: mb3-bearer-import
    fieldAgree: Thin (CEV “whom”; some PreDCA population talk).
    fieldDiffer: Field usually folds into pointing; book types referent transport separately.
  - key: MB4
    noun: Corrigibility
    cruxWording: Correction that holds now continues to preserve the correction process under pressure.
    leanAxiom: MB4_correction_legitimacy
    cardSlug: mb4-correction-legitimacy
    fieldAgree: Desire to accept/assist correction; Christiano dynamical reading closest to trajectory form.
    fieldDiffer: MIRI/CHAI shutdown-utility homograph; book splits audit-path legitimacy as MB4a.
    legendNote: "Corrigibility (MIRI/CHAI) vs dynamical corrigibility (Christiano) vs MB4/MB4a split."
  - key: MB4a
    noun: Audit Independence
    cruxWording: The designated measured correction/audit path is legitimate and uncaptured.
    leanAxiom: MB4a_measured_path_legitimacy
    cardSlug: mb4a-measured-path-legitimacy
    fieldAgree: CIRIS WA independence; trusted-monitor / judge-capture cousins.
    fieldDiffer: No field headline; often lumped into corrigibility; green Verify ⇏ real-loop integrity.
  - key: MB5
    noun: Tiling
    cruxWording: Full value/bearer transport under ontology shift yields successor safety.
    leanAxiom: MB5_ontology_shift_successor_audit
    cardSlug: mb5-successor-ontology-shift
    fieldAgree: MIRI tiling / Vingean reflection / ontology identification.
    fieldDiffer: Book separates successor audit gaming as MB10; natural abstractions ease but do not discharge.
    legendNote: "MB5 = transport holds; MB10 = successor certification checklist not forgeable."
  - key: MB6
    noun: Goodhart Selection
    cruxWording: Socio-technical selection supports a basin that preserves correction, rather than selecting proxy-satisfying systems that hollow it out.
    leanAxiom:
      - MB6a_percolation_evidence_to_basin_stability
      - MB6b_basin_stability_to_correction_integrity
    cardSlug: mb6-selection-and-basin-stability
    fieldAgree: Goodhart-as-selector; gradual disempowerment narrative; governance/pause on selection handles.
    fieldDiffer: Demski “selection vs control” homograph; CLR multipolar = different layer; thin in model-centric agendas.
    legendNote: "Goodhart Selection (deployment ecology) ≠ Demski selection (inside-optimizer search)."
  - key: MB7
    noun: Inner Alignment
    cruxWording: Hidden productive control is bounded and oversight stays adversarially robust (access, filter coverage, cost of faking).
    leanAxiom:
      - MB7a_access_model_soundness
      - MB7b_filter_family_coverage
      - MB7c_hidden_biq_to_adversarial_robustness
    cardSlug: mb7-hidden-capability-and-access
    fieldAgree: Hubinger inner/mesa; Redwood control; Apollo scheming; scalable-oversight ceiling.
    fieldDiffer: Field binary vs book split; do not merge with MB10 Successor Gaming.
    legendNote: "Inner Alignment splits into MB7a–c (access, filter, cost of faking) plus MB7d (acausal coordination); MB10 = successor certification channel."
  - key: MB7a
    noun: Access-Model Soundness
    cruxWording: An adequate access model makes boundary discovery robust under adversarial hiding.
    leanAxiom: MB7a_access_model_soundness
    cardSlug: mb7a-access-model-soundness
    fieldAgree: Embedded-agency subsystem worry; Redwood access/handle assumptions.
    fieldDiffer: Often lumped into inner alignment; book types access-model soundness before filter coverage.
  - key: MB7b
    noun: Filter Coverage
    cruxWording: The oversight filter family has adequate resolution to bound what audits miss.
    leanAxiom: MB7b_filter_family_coverage
    cardSlug: mb7b-filter-coverage
    fieldAgree: AI Control capability gap; debate/amplification ceiling under opacity.
    fieldDiffer: Field “hidden capability” is one wall; MB7b is only the filter-coverage subchannel.
  - key: MB7c
    noun: Bounded Hidden Capability
    cruxWording: Bounded hidden productive control plus correction integrity supports adversarially robust oversight.
    leanAxiom: MB7c_hidden_biq_to_adversarial_robustness
    cardSlug: mb7c-bounded-hidden-capability
    fieldAgree: Certification-under-manipulation; cost-of-faking monitored signal.
    fieldDiffer: Not MB4 corrigibility; MB7c closes the inner-alignment chain to adversarial robustness.
  - key: MB7d
