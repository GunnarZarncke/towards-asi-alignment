# Alignment lifecycle axis for field map v2 (orthogonal to bridge dependency graph).
# Regenerate: cd site && npm run sync:field-v2

intro: >-
  Each bridge and open crux sits at a stage in the alignment lifecycle —
  orthogonal to the dependency graph above. The axis asks when a handoff
  must hold: from stating the target, through building and measuring the
  system, to certifying and preserving alignment under change.

bridgeAssignmentNote: >-
  Live MB bridges (MB1–MB11) mostly tag identify, certify, and preserve
  handoffs: whether measurement, oversight, or long-run dynamics support
  discharge once a target and deployable system are in view. Assignment does
  not mirror dependency edges — for example MB11 assembles many antecedents in
  the graph above while sitting in the certify lifecycle role, and MB4 in
  preserve while MB4a is certify.

gapsNote: >-
  Specify and construct look sparse because those stages were underrepresented
  in the original MB matrix. MB8 (CEV) was the only specify-tagged bridge; it
  is retired and factorizes as Alignment Target (specify) plus Target
  Realization (construct). Open spine interfaces fill those roles; field
  outer-alignment work often spans specify and identify without mapping to a
  single MB column.

phases:
  specify:
    label: Specify
    summary: >-
      State the alignment target or constitutional rule the system is
      supposed to serve — what counts as success before construction or
      certification arguments apply.
  construct:
    label: Construct
    summary: >-
      Build (or show buildable) a system that robustly tracks that target.
      Distinct from identifying what the target is or certifying that
      evidence licenses tracking.
  identify:
    label: Identify
    summary: >-
      Measure and identify the real control locus, value structure, and
      access boundaries — what is actually in the loop, not what the
      specification claims.
  certify:
    label: Certify
    summary: >-
      Oversight, audits, and safety-case evidence license that the deployed
      system meets claimed properties — including resistance to hidden
      capability and checklist gaming.
  preserve:
    label: Preserve
    summary: >-
      Maintain correction integrity, value/bearer transport, and basin
      stability under pressure, substrate change, successor handoffs, and
      long-run selection.
