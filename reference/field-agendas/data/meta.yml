status: >-
  field reference (2026-08-02 MB11 matrix pass) — clustered from [AISafety.com
  map](https://www.aisafety.com/map) (~352 listings → 25 matrix agendas after
  independence merges; 30 agenda records incl. field-building off-matrix).
  includes **Links** (official sites; map listings roll up in the clustering
  table). **Coverage matrix** below maps agenda × bridge cells to numbered,
  typed, sourced evidence. **Not** manuscript canon.  
inclusionTest: >-
  An **agenda** row requires: (1) carrier org/program/person, (2) 3–7 signature
  terms, (3) stated intent to shape research/deployment/policy, (4) primary
  artifact (curriculum, constitution, technical agenda, eval suite, policy
  platform).


  **Not agendas (reference only):** funding pools (LTFF, SFF, Open
  Philanthropy), coworking hubs (LISA, Constellation, Meridian), resource
  directories (AISafety.com, AI Watch), individual blogs/newsletters unless they
  define a research lineage.


  **Training programs** (BlueDot, MATS, Apart, Kairos, seminar-style curricula)
  are one agenda **type** among others — vocabulary feeds the inter-agenda
  glossary; no per-curriculum index rows.
coverageIntro: >-
  The **coverage matrix** catalogs **sourced evidence that an agenda advances a
  bridge crux**, independent of whether TSA adopts that agenda's constructive
  bet or ontology.


  - **`Book treatment`** on each [agenda row](#agendas) states how *Towards
  Superintelligence Alignment* handles the agenda (substantive, peer,
  borderline, exclude-by-reference, etc.).

  - **Empty matrix cells (`—`)** mean no catalog entry in this pass — not "out
  of book scope" and not a claim the agenda is silent on the crux.

  - **Lean spine** carries bridges **`MB1`–`MB11`** incl. **`MB4a`**; App B
  crosswalk prose currently lists **`MB1`–`MB10`** only (App B update deferred).
spineTranslation: >-
  A filled cell means **field evidence on a crux**, not **automatic discharge to
  `Safe`**. After the 2026-08-02 Lean review
  ([`drafts/field-claim-formalization-and-bridge-review-plan.md`](../../drafts/field-claim-formalization-and-bridge-review-plan.md)),
  partial field claims map in three ways — **no new `MB*` column was added**:


  | Mode | Meaning | Examples |

  |---|---|---|

  | **Direct bridge** | Field work maps to a numbered bridge the spine consumes
  | **MB4a**, **MB8**, **MB11** columns |

  | **Ambient cousin** | Evidence on existing columns; validity stays those
  bridges + defeaters | Kosoy misspec on **MB1**/**MB9**
  (`Nonrealizability.lean`; falsifiers in `Defeaters.lean`) |

  | **Catalog / side channel** | Field crux neighborhood; not a safety-case
  discharge path | Kosoy regret on **MB2** (≠ **MB11**/`RiskGap`;
  `RegretSafety.lean`); LI on **MB5**/**MB7d** (exclude-by-reference) |
doNotInfer: >-
  Kosoy **MB1**/**MB9** ⇒ misspec solved; Kosoy **MB2** ⇒ regret ⇒ **`Safe`**;
  CIRIS **MB4a** ⇒ correction integrity without coverage/no-bypass
  (`CompositePathBypass.lean`); any **MB9** tag ⇒ off-class safety.
kosoyDiagnostic: >-
  infra-Bayesianism/LTA advances **MB1–MB9** cousins, not a missing **MB11**.
  PreDCA is a **peer outer target** on **MB2/MB3**, not a separate bridge.
  **MB2** (LTA/regret) is a value-learning cousin — **MB11** stays **—** for
  Kosoy.
