status: >-
  field reference (2026-08-02 MB11 matrix pass) — clustered from [AISafety.com
  map](https://www.aisafety.com/map) (~352 listings → 25 matrix agendas after
  independence merges; 31 agenda records incl. field-building off-matrix).
  includes **Links** (official sites; map listings roll up in the clustering
  table). **Coverage matrix** below maps agenda × bridge cells to numbered,
  typed, sourced evidence. **Not** manuscript canon.  
inclusionTest: >-
  An **agenda** row requires: (1) carrier org/program/person, (2) 3–7 signature
  terms, (3) stated intent to shape research/deployment/policy, (4) primary
  artifact (curriculum, constitution, technical agenda, eval suite, policy
  platform).


  **Not agendas (reference only):** funding pools (LTFF, SFF, Open
  Philanthropy), coworking hubs (LISA, Constellation, Meridian), resource
  directories (AISafety.com, AI Watch), individual blogs/newsletters unless they
  define a research lineage.


  **Training programs** (BlueDot, MATS, Apart, Kairos, seminar-style curricula)
  are one agenda **type** among others — vocabulary feeds the inter-agenda
  glossary; no per-curriculum index rows.
coverageIntro: >-
  The **coverage matrix** catalogs **sourced evidence that an agenda touches a
  bridge crux**, independent of whether TSA adopts that agenda's constructive
  bet or ontology. Each catalog entry may carry **stance** (`direction`,
  `weight`) — whether the source mainly **advances** or **complicates**
  discharge on that crux (see [stance legend](#stance-marks) below).


  - **`Book treatment`** on each [agenda row](#agendas) states how *Towards
  Superintelligence Alignment* handles the agenda (substantive, peer,
  borderline, exclude-by-reference, etc.).

  - **Empty matrix cells (`—`)** mean no catalog entry in this pass — not "out
  of book scope" and not a claim the agenda is silent on the crux.

  - **Lean spine** carries bridges **`MB1`–`MB11`** incl. **`MB4a`**; App B
  crosswalk prose currently lists **`MB1`–`MB10`** only (App B update deferred).
directionLegend: >-
  Stance marks prefix tags on a +3 (+++, advances discharge) to −3 (−−−, complicates it) scale, with ± when direction is unclear.
weightRubric: |-
  | Weight | Meaning |
  |---|---|
  | **1** | Illustrative — early framing, partial result, or sibling evidence exists elsewhere |
  | **2** | Substantive — credible field contribution on this crux |
  | **3** | Landmark — agenda-defining or strongest known directional evidence on this crux |
stanceMarksTable: |-
  | Mark | direction | weight |
  |---|---|---|
  | `+` | support | 1 |
  | `++` | support | 2 |
  | `+++` | support | 3 |
  | `±` | unclear | — |
  | `−` | challenge | 1 |
  | `−−` | challenge | 2 |
  | `−−−` | challenge | 3 |
  | *(none)* | untagged legacy | — |
spineTranslation: >-
  A filled cell means **field evidence on a crux**, not **automatic discharge to
  `Safe`**. After the 2026-08-02 Lean review
  ([`drafts/attic/field-claim-formalization-and-bridge-review-plan.md`](../../drafts/attic/field-claim-formalization-and-bridge-review-plan.md)),
  partial field claims map in three ways — **no new `MB*` column was added**:


  | Mode | Meaning | Examples |

  |---|---|---|

  | **Direct bridge** | Field work maps to a numbered bridge the spine consumes
  | **MB4a**, **MB11** columns |

  | **Ambient cousin** | Evidence on existing columns; validity stays those
  bridges + defeaters | Kosoy misspec on **MB1**/**MB9**
  (`Nonrealizability.lean`; falsifiers in `Defeaters.lean`) |

  | **Catalog / side channel** | Field crux neighborhood; not a safety-case
  discharge path | Kosoy regret on **MB2** (≠ **MB11**/`RiskGap`;
  `RegretSafety.lean`); LI on **MB5**/**MB7d** (exclude-by-reference) |

  **Retired matrix bridge:** **MB8** (CEV) — gravestone card only;
  factorizes as **AlignmentTarget** / **Target Realization**, not a live
  process-preservation route to correction.
doNotInfer: >-
  Kosoy **MB1**/**MB9** ⇒ misspec solved; Kosoy **MB2** ⇒ regret ⇒ **`Safe`**;
  CIRIS **MB4a** ⇒ correction integrity without coverage/no-bypass
  (`CompositePathBypass.lean`); any **MB9** tag ⇒ off-class safety.
kosoyDiagnostic: >-
  One Kosoy lineage: LTA (mathematical theory of intelligent agents) plus
 infra-Bayesianism and Physicalist Superimitation / PreDCA as an outer-alignment
  strand—not separate agendas. Advances **MB1–MB9** cousins, not a missing
  **MB11**. PreDCA/PSI is a **peer outer target** on **MB2/MB3**, not a separate
  bridge. **MB2** (LTA/regret) is a value-learning cousin — **MB11** stays **—**
  for Kosoy.
openSpineInterfaces: >-
  **Target Realization** (`ConstructionCrux` in `AlignmentConstruction.lean`) —
  construct lifecycle; not an `MB*` column. Live: `/cards/alignment-lifecycle/`.
typeLettersTable: |-
  | Letter | Type |
  |---|---|
  | **C** | conceptual |
  | **T** | theory (formalization) |
  | **S** | simulations |
  | **P** | practical (applications) |
  | **D** | empirical (software) |
  | **E** | empirical (other) |
  | **O** | other |
matrixIntro: >-
  Column headers use **field nouns**; **MB*** keys are spine identifiers only.
  Each linked bridge card states the crux, where agendas agree or diverge, and
  homograph splits. [App B
  (companion)](https://towards-alignment.com/cards/chapters/appb/) · [Lean
  spine](https://towards-alignment.com/lean/) · source:
  [`reference/field-agendas/data/bridges.yml`](data/bridges.yml).
