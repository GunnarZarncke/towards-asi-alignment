# Open spine interfaces — not MB matrix columns (Krym Phase 6 / field v2).
# Regenerate: cd site && npm run sync:field-v2

openSpineInterfaces:
  - id: alignment-target
    title: Alignment Target
    lifecycleRole: specify
    status: open
    leanModule: AlignmentProofSpine/AlignmentConstruction
    leanProp: TargetSpecifiable
    leanDefs:
      - ConstitutionalRule
      - constitutionalTarget
      - SpecWellFormedness
      - SpecifyCrux
      - TargetSort
      - cevConstitution
      - caiConstitution
      - gsaiConstitution
      - institutionalConstitution
    bookChapters:
      - ch28
      - ch01
    conceptCard: /cards/alignment-target/
    summary: >-
      State a coherent alignment target (constitutional rule → AlignmentTarget).
      Open specify-phase crux; not an MB bridge column. Retired MB8 (CEV)
      factorizes here; outer-alignment, constitutional-AI, and open-world
      specification debates (GSAI completeness cousins) attach in this
      neighborhood — distinct from MB2 identification of values in a deployed
      system.
    dependsOn: []
    notABridge: true
  - id: target-realization
    title: Target Realization
    lifecycleRole: construct
    status: open
    leanModule: AlignmentProofSpine/AlignmentConstruction
    leanProp: ConstructionCrux
    leanDefs:
      - Realizes
      - TargetRealizable
      - CertifiedAsRealizing
      - ConstructionBet
      - SpecifyConstructPair
      - cevConstructionBet
      - caiConstructionBet
      - gsaiConstructionBet
      - institutionalConstructionBet
    bookChapters:
      - ch33
      - ch01
    conceptCard: /cards/target-realization/
    summary: >-
      Given target P, can we construct a system A that robustly tracks P?
      Open field crux; not an MB bridge. Certification schemas do not supply
      construction (see fin_certification_without_construction). Pause/recover
      (`DeploymentOk`) is a regime on certification timing, not a construct method.

    dependsOn: []
    notABridge: true
