# Spec sheet source — regenerate: cd site && npm run sync:product-comparison
# Columns are roster slugs; marks: yes | some | dash

intro: >-
  Aligned ASI is not a product anyone ships. Some programs do ship something you can use.

features:
  - id: ships-usable-product
    label: Ships a usable product
    gloss: Something a user or lab can run or buy today, even if alignment is unsolved.
  - id: breadth
    label: Breadth
    gloss: One artifact covers many agendas or problem clusters, not one lineage.
  - id: long-form-argument
    label: Long-form argument
    gloss: A readable through-line (book, sequence, survey) with a thesis.
  - id: living-communal-canon
    label: Communal
    gloss: A skeleton others are invited to fill; authorship is not one lab.
  - id: formalization
    label: Formalization
    gloss: Mathematical or machine-checked structure for claims or specs.
    deepLink: /lean/
  - id: translation
    label: Translation
    gloss: Maps other field programs into its terms without pretending to absorb them.
    deepLink: /cards/chapters/appB/
  - id: public-knowledge-site
    label: Public knowledge site
    gloss: A maintained web layer (wiki, cards, paths), not only PDFs and posts.
  - id: constructive-theory
    label: Constructive theory
    gloss: A way to build or guarantee — agent theory, training recipe, or spec stack.

columns:
  miri:
    shortName: MIRI
    bestFor: Agent-foundations problem statements and the LW/AF explainer canon.
    skipIf: You need a shipped AI product or a constructive training recipe.
  redwood-research:
    shortName: Redwood
    bestFor: Control and intentional-subversion evals under deployment pressure.
    skipIf: You wanted a general theory of values or institutions.
  chai-russell:
    shortName: CHAI
    bestFor: Assistance games, beneficial-AI framing, and Berkeley alignment hub.
    skipIf: You need bundle geometry or selection as a load-bearing layer.
  christiano-lineage:
    shortName: Christiano
    bestFor: Scalable oversight protocols (debate, amplification) and ELK framing.
    skipIf: You treat readout as correction uptake without a separate check.
  davidad-guaranteed-safe-ai-gsai:
    shortName: GSAI
    bestFor: Open-world specification coverage and guaranteed-safe formalism.
    skipIf: You want conservative grounding instead of completeness claims.
  anthropic-lab:
    shortName: Anthropic
    bestFor: Frontier models under RSP, constitutional AI, and MI tooling (Goodfire stack).
    skipIf: You need a preservation-layer certificate, not a lab scaling policy.
  google-deepmind-safety:
    shortName: DeepMind
    bestFor: Frontier models plus DeepMind safety research and eval infrastructure.
    skipIf: You wanted a single-author theory manuscript.
  apollo-research:
    shortName: Apollo
    bestFor: Scheming and deception evals before deployment.
    skipIf: You need correction-channel integrity certified, not detected opacity.
  metr:
    shortName: METR
    bestFor: Capability evals and frontier risk reporting for labs.
    skipIf: You need a constructive alignment theory or value transport story.
  resolution:
    shortName: Resolution
    bestFor: Automation-first high-confidence alignment research (Timaeus line).
    skipIf: You need adversarial verifiability priced before automation claims land.
  neglected-approaches-portfolio:
    shortName: Neglected
    bestFor: Cataloguing underexplored intervention routes across the field.
    skipIf: You want one coherent constructive bet.
  orthogonal:
    shortName: Orthogonal
    bestFor: Community agent-foundations research (embedded agency, corrigibility).
    skipIf: You need lab-scale eval infrastructure or a book-length spine.
  wentworth-natural-abstractions:
    shortName: Wentworth
    bestFor: Natural abstractions, selection theorems, and compression-based agency.
    skipIf: You need bearer maps or institutional selection typed separately.
  kosoy-infra-bayesianism-lta:
    shortName: Kosoy
    bestFor: Learning-theoretic agent theory and infra-Bayesian constructive layers.
    skipIf: You want bundle transport and correction channel as separately checkable.
  ciris:
    shortName: CIRIS
    bestFor: Shipped accountability stack with signed traces and fail-closed ops layers.
    skipIf: You need composite-agency boundary coverage, not named-identity attestation.
  govai:
    shortName: GovAI
    bestFor: Governance research, AISI-adjacent eval institutes, and policy translation.
    skipIf: You need a technical constructive alignment recipe.
  pause-standards-advocacy-cluster:
    shortName: Pause
    bestFor: Moratorium and standards advocacy when mechanism progress stalls.
    skipIf: You wanted a measurement decomposition or training method.
  arc-alignment-research-center:
    shortName: ARC
    bestFor: ELK and formal scalable-oversight research hosted at ARC.
    skipIf: You treat latent readout as full inner-alignment discharge.
  clr-cooperation-conflict:
    shortName: CLR
    bestFor: Cooperation under competition, s-risks, and multipolar structural risk.
    skipIf: You need typed deployment-leverage measurement, not narrative multipolar stories.
  ai-futures-forecasting-cluster:
    shortName: Forecast
    bestFor: Scenario timelines and shared prediction infrastructure for urgency.
    skipIf: You need mechanism-level bridge discharge, not schedule cues.
  conjecture-cognitive-emulation:
    shortName: Conjecture
    bestFor: Cognitive-emulation controllability framing (historical CoEm line).
    skipIf: You need a live product line — Conjecture is winding down.
  safeguarded-ai-aria-zeroth-heron:
    shortName: Safeguarded
    bestFor: Whole-system formal assurance, proof certificates, and runtime action control.
    skipIf: You need correction uptake on the live loop, not a green certificate.
  mai-cip-institutional-alignment:
    shortName: MAI/CIP
    bestFor: Thick values, assemblies, and institutional full-stack alignment design.
    skipIf: You need adversarial verifiability under optimization on the measured object.
  this-project-towards-superintelligence-alignment-tsa:
    shortName: TSA
    bestFor: Seeing which unsolved handoff you are on and how programs differ in what they ship.
    skipIf: You wanted a training recipe or a guaranteed-safe builder.
  iliad-textbook-from-the-future:
    shortName: Iliad
    defaultVisible: true
    bestFor: Joining a communal theory TOC and field-building megaproject.
    skipIf: You need a closed single-author argument today.

