- id: news-takeaway-et4-secret-loyalties-jul-2026
  prompt: A process-compliance score made a secretly loyal reviewer look more compliant. What should you
    check instead (or as well)?
  options:
  - id: take
    text: "What the system does inside the workflow that gives it power, including outcomes"
    correct: true
  - id: d0
    text: "What template the compliance PDF used compared with last year's audit packet"
    correct: false
  - id: d1
    text: What wording the reviewer used to sound extra-compliant on the scored form
    correct: false
  - id: d2
    text: What footnote text would state a secret loyalty the auditor never actually reads
    correct: false
  explanation: "A light process proxy can rank a bad actor as extra-compliant. Do not stop at whether\
    \ outputs look compliant; test the deployments the workflow actually authorizes, with directional\
    \ outcome checks."
  source:
    href: /cards/chapter/ch10/
    label: Chapter 10 — Agency Under Strategic Opacity
