- id: news-takeaway-anthropic-risk-report-aug-2026
  prompt: A public risk rating of “low” is published while a stronger model is already used internally.
    What does the public rating fail to settle?
  options:
  - id: take
    text: Whether that rating applies to the internal use that already has power
    correct: true
  - id: d0
    text: Whether a weaker public product can still carry a truthful low rating
    correct: false
  - id: d1
    text: "Whether the rated public SKU reused last year's eval suite as the whole case"
    correct: false
  - id: d2
    text: Whether the report appendix listed the same eval names as the model card
    correct: false
  explanation: "A public product rating can be true of a weaker surface (code, research, other agents\
    \ may already be on a stronger internal loop). The decision that matters is whether that loop is already\
    \ running with weaker checks."
  source:
