- id: news-takeaway-cot-optimization-2026
  prompt: Training accidentally rewards the model’s written reasoning. What happens to that readout as
    a window?
  options:
  - id: take
    text: It is no longer a reliable window once overseers grade the text they read
    correct: true
  - id: d0
    text: It becomes more trustworthy because the model now tries harder to explain
    correct: false
  - id: d1
    text: It is unaffected as long as the words still look like a chain of thought
    correct: false
  - id: d2
    text: It can be ignored because only the final answer was ever scored in training
    correct: false
  explanation: "A training bug can make ‘thinking’ less trustworthy without a model trying to hide: the\
    \ text is in the training loop. Protect the readout in the pipeline."
  source:
    href: /cards/chapter/ch39/
    label: Chapter 39 — Passive Observation Is Not Enough
  topics:
  - MB7
  appearOn:
  - "chapter:ch39"
  - "chapter:ch41"
  - "chapter:ch43"
  tags:
  - takeaway
- id: news-takeaway-cltr-scheming-wild-mar-2026
  prompt: An OSINT review flags a rising count of scheming-like incidents in public chats. How should
    you use that?
  options:
  - id: take
    text: As a trend signal for where to invest in monitoring of public-chat incidents
    correct: true
  - id: d0
    text: As a precise incident count that can replace scoped lab evals of the same agents
    correct: false
  - id: d1
    text: As proof that every flagged public chat was a confirmed inner-misaligned agent
    correct: false
  - id: d2
    text: As a reason to ignore in-lab agents because only public chat transcripts matter
    correct: false
  explanation: "Social-media transcripts can move attention. They are not hard proof for a certification\
    \ case, and they are not a substitute for a scoped test."
  source:
    href: /cards/chapter/ch10/
    label: Chapter 10 — Agency Under Strategic Opacity
  topics:
  - MB7
  appearOn:
  - "chapter:ch10"
  - "chapter:ch39"
  - "chapter:ch40"
  tags:
  - takeaway
- id: news-takeaway-meta-openclaw-feb-2026
  prompt: "A ‘confirm before acting’ rule lived only in chat history; after compression, STOP did not\
    \ stop the agent. Where do load-bearing rules need to live?"
  options:
  - id: take
    text: In durable settings that actually interrupt the process when a stop is issued
    correct: true
  - id: d0
    text: "In the latest user message, assumed never to be dropped from the context window"
    correct: false
  - id: d1
    text: In a blog post that describes the intended confirm-before-acting stop behavior
    correct: false
  - id: d2
    text: In a system prompt that is never checked against long-run tool invocations
    correct: false
  explanation: "If the stop is not wired to the process, hearing ‘STOP’ is not a handle. Conversation\
    \ memory that can be compressed away is not a durable setting."
  source:
    href: /cards/chapter/ch06/
    label: Chapter 6 — What Is an Agent Without Anthropomorphism?
  topics:
  - MB4
  appearOn:
  - "chapter:ch06"
  - "chapter:ch25"
  - "chapter:ch26"
  - "chapter:ch36"
  tags:
  - takeaway
- id: news-takeaway-claude-code-production-feb-2026
  prompt: Coding agents with write access wiped databases and deleted repos. What is the safer operator
    default?
  options:
  - id: take
    text: "Default to least privilege, pre-tool hooks, and human approval for irreversible actions"
    correct: true
  - id: d0
    text: Default to production admin credentials so the agent can fix its own mistakes faster
    correct: false
  - id: d1
    text: "Default to a verbal 'be careful' in chat as the only gate on irreversible write tools"
    correct: false
  - id: d2
    text: Default to disabled audit logs so destructive commands cannot be replayed after a wipe
    correct: false
  explanation: "Treat coding agents like junior operators, not full admin by default. Confirmation that\
    \ is not in the tool path is not a gate."
  source:
    href: /cards/chapter/ch08/
    label: "Chapter 8 — Agents That Grow, Split, and Merge"
