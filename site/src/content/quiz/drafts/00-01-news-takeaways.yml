- id: news-takeaway-jailbreak-disclosure-aug-2026
  prompt: A lab publishes pre-deployment safety tests. What else do you need before treating those tests
    as a closed safety claim?
  options:
  - id: take
    text: Whether an independent researcher can report a bypass to someone who can fix it
    correct: true
  - id: d0
    text: Whether the lab published a pre-deployment test PDF before the release date
    correct: false
  - id: d1
    text: "Whether the test battery reused last quarter's items under the same scoring rubric"
    correct: false
  - id: d2
    text: "Whether an independent writeup appeared the same week as the lab's test PDF"
    correct: false
  explanation: "Self-graded, NDA-bound, or missing report routes mean the test can fail in the world without\
    \ a correction channel. Transparent severity grading belongs with that route, not on the keyed line."
  source:
    href: /cards/chapter/ch27/
    label: Chapter 27 — Correction Channels under Adversarial Pressure
  topics:
  - MB4
  appearOn:
  - "chapter:ch27"
  - "chapter:ch33"
  - "chapter:ch38"
  - "chapter:ch39"
  tags:
  - takeaway
- id: news-takeaway-ai2040-plan-a-jul-2026
  prompt: "A detailed slowdown scenario lists verification, transparency, and compute tracking. How should\
    \ you use it?"
  options:
  - id: take
    text: As a wishlist of outer handles; ask which stay usable under competitive pressure
    correct: true
  - id: d0
    text: "As proof that this project's micro lab simulations already happened in the world"
    correct: false
  - id: d1
    text: "As a calendar of when superintelligence will arrive, replacing other evidence"
    correct: false
  - id: d2
    text: As a reason to skip verification because the scenario dates are already settled
    correct: false
  explanation: A recommended deal is not a lab result and not a confirmed timeline. The test is which
    handles still bind when racing.
  source:
    href: /cards/chapter/ch13/
    label: Chapter 13 — The Coordination Bottleneck
