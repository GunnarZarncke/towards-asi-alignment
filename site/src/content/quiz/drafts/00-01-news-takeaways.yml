- id: news-takeaway-openai-pacing-aug-2026
  prompt: A lab delays a large training run and spends extra compute on monitoring. What does that still
    fail to settle?
  options:
  - id: take
    text: Whether alignment is a go/no-go target or only a pillar beside the monitor
    correct: true
  - id: d0
    text: Whether extra monitor compute was spent instead of more training FLOPs
    correct: false
  - id: d1
    text: Whether the public note used pause rather than delay in the compute writeup
    correct: false
  - id: d2
    text: Whether the hold was announced in a public note rather than only internally
    correct: false
  explanation: "A real delay is a pacing handle. It is not proof that the monitor is the alignment target,\
    \ or that dropping flagged trajectories is not training against the alarm."
  source:
    href: /cards/chapter/ch13/
    label: Chapter 13 — The Coordination Bottleneck
  topics:
  - MB6
  appearOn:
  - "chapter:ch13"
