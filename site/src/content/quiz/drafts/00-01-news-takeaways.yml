questions:
- id: news-takeaway-openai-hf-roadahead-aug-2026
  prompt: "A lab says the next incident will not look like the last sandbox escape, and safeguards must\
    \ stay ahead of capability. What still has to be in place?"
  options:
  - id: take
    text: A way to locate the acting unit and time a correction faster than the swarm
    correct: true
  - id: d0
    text: A way to enlarge the named-eval leaderboard while keeping last subsystem IDs
    correct: false
  - id: d1
    text: A way to treat a novelty acknowledgment as a substitute for a live monitor
    correct: false
  - id: d2
    text: A way to freeze all model parameters so no new capability can ever appear
    correct: false
  explanation: "Acknowledging novelty is not a monitor, and a retuned named sandbox is not enough. You\
    \ still need to locate the acting unit and time the correction to the swarm."
  source:
    href: /cards/chapter/ch07/
    label: Chapter 7 — Finding the Boundary
  topics:
  - MB7a
  appearOn:
  - "chapter:ch07"
  - "chapter:ch14"
  - "chapter:ch39"
  - "chapter:ch40"
  - "chapter:ch43"
  tags:
