- id: news-takeaway-insurance-audits-jul-2026
  prompt: An AI safety certificate is presented as independent. What should you ask first?
  options:
  - id: take
    text: "Who chose and paid the evaluator, and who bears losses from a wrong assessment"
    correct: true
  - id: d0
    text: Who listed the lab city on the certificate letterhead as proof of independence
    correct: false
  - id: d1
    text: Who wrote the marketing page that calls the certificate fully independent work
    correct: false
  - id: d2
    text: Who signed the model card the certificate cites as the official audit scope
    correct: false
  explanation: "If the developer selects and pays the auditor, independence is a claim, not a fact. Also\
    \ ask which risks sit outside the liability system; catastrophic tails may still be uninsurable."
  source:
    href: /cards/chapter/ch27/
    label: Chapter 27 — Correction Channels under Adversarial Pressure
  topics:
  - MB4
  appearOn:
