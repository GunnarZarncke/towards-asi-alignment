- id: news-takeaway-microsoft-open-weights-jul-2026
  prompt: "A coalition letter treats widely shared weights as leadership, and also warns that modified\
    \ copies escape developer control. What follows?"
  options:
  - id: take
    text: Treat open weights and limited access as options that need copy-tracking evidence
    correct: true
  - id: d0
    text: Treat open weights as the settled default so post-release tests can be made weaker
    correct: false
  - id: d1
    text: Treat limited access as automatically aligned because modified copies cannot exist
    correct: false
  - id: d2
    text: "Treat the letter's economics as proof that modified copies stay traceable forever"
    correct: false
  explanation: "The letter's own warning is the hard part: untraceable copies. Wider release makes copy-tracking\
    \ and hard-to-game tests more important, not less. Release policy is a claim that needs tests, not\
    \ a slogan or a default."
  source:
    href: /cards/chapter/ch12/
    label: Chapter 12 — Capability Growth Is Boundary Expansion
  topics:
  - MB6
  appearOn:
  - "chapter:ch12"
  - "chapter:ch30"
  - "chapter:ch33"
