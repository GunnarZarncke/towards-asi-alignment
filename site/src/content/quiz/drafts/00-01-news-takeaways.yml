- id: news-takeaway-metr-frontier-risk-may-2026
  prompt: "Independent testers looked at agents used inside labs, not only public releases. What do safety\
    \ cases need that model cards miss?"
  options:
  - id: take
    text: "Independent assessment of in-lab agent overreach, deception, and monitor bypass"
    correct: true
  - id: d0
    text: "Independent assessment of the public model's listed parameter count on the card"
    correct: false
  - id: d1
    text: Independent assessment of whether the lab homepage mentions safety in the nav
    correct: false
  - id: d2
    text: Independent assessment of a vendor-written summary of intended use on the card
    correct: false
  explanation: "Starting a rogue deployment can look possible while keeping it going does not. The in-lab\
    \ agent under task pressure is the object, not only the public product."
  source:
    href: /cards/chapter/ch39/
    label: Chapter 39 — Passive Observation Is Not Enough
  topics:
  - MB7
  appearOn:
  - "chapter:ch39"
  - "chapter:ch42"
  - "chapter:ch44"
  tags:
  - takeaway
- id: news-takeaway-mythos-withheld-apr-2026
  prompt: "Capability jumps, especially in cyber. What kind of release choice does that call for?"
  options:
  - id: take
    text: "A release choice of an explicit go/no-go: trusted partners or limited access"
    correct: true
  - id: d0
    text: A release choice of automatic public deployment because a jump proves alignment
    correct: false
  - id: d1
    text: A release choice of automatic withholding of all notes so no one can evaluate
    correct: false
  - id: d2
    text: A release choice of automatic open weights because scrutiny replaces a gate
    correct: false
  explanation: "Withholding a preview is a real choice. The load-bearing part is that it is a choice,\
    \ not a default ship."
  source:
    href: /cards/chapter/ch12/
    label: Chapter 12 — Capability Growth Is Boundary Expansion
