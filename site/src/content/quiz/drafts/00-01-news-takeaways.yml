- id: news-takeaway-et2-cil-uad-jul-2026
  prompt: "A boundary-finding test failed to recover a planted hidden team, and changing one agent spilled\
    \ over broadly. How should you read that?"
  options:
  - id: take
    text: "As a real limit of the current test, and a prompt to check shared-resource spillover"
    correct: true
  - id: d0
    text: As proof that no multi-agent structure can ever exist in a shared compute commons
    correct: false
  - id: d1
    text: As a license to skip locating acting units because the first recovery test was green
    correct: false
  - id: d2
    text: "As confirmation that the planted team was never there, so no further test is needed"
    correct: false
  explanation: "A failed recovery is evidence against the method as run, not a reason to retune until\
    \ it finds the team. Do not treat broad spillover as the same as finding a meaningful unit."
  source:
    href: /cards/chapter/ch07/
    label: Chapter 7 — Finding the Boundary
  topics:
  - MB1
  appearOn:
  - "chapter:ch07"
  - "chapter:ch34"
  tags:
  - takeaway
- id: news-takeaway-pacing-frontier-jul-2026
  prompt: Many frontier employees call for tools to pace automated AI development. When does that call
    become a real gate?
  options:
  - id: take
    text: When evidence can independently delay or restrict a release under competitive pressure
    correct: true
  - id: d0
    text: When the employee statement reaches a round number of signatures on the public letter
    correct: false
  - id: d1
    text: When the statement is posted on the same calendar day as a competing product launch
    correct: false
  - id: d2
    text: When each company publishes a matching blog post in the same news week as the letter
    correct: false
  explanation: "A request for capacity is not itself a binding slowdown, and a signed statement is not\
    \ the gate. Test whether the tools still bite when racing."
  source:
    href: /cards/chapter/ch13/
    label: Chapter 13 — The Coordination Bottleneck
  topics:
  - MB6
  appearOn:
  - "chapter:ch13"
  - "chapter:ch37"
  - "chapter:ch38"
  tags:
  - takeaway
- id: news-takeaway-et3-ai2027-jul-2026
  prompt: A famous takeoff forecast is used as a schedule cue inside a lab simulation. How should you
    treat that pairing?
  options:
  - id: take
    text: Treat the forecast and the lab test as separate evidence; speedups stress mechanisms
    correct: true
  - id: d0
    text: Treat the lab run as confirming when strong capabilities will arrive on the calendar
    correct: false
  - id: d1
    text: "Treat the forecast's calendar years as if they were now lab measurements of takeoff"
    correct: false
  - id: d2
    text: "Treat the forecast as settling risk, so the lab's frozen safety battery can be dropped"
    correct: false
  explanation: "Speedups can stress a mechanism without confirming calendar dates. They do not validate\
    \ the forecast's years."
  source:
    href: /cards/chapter/ch12/
    label: Chapter 12 — Capability Growth Is Boundary Expansion
  topics:
  - MB6
  appearOn:
  - "chapter:ch12"
  - "chapter:ch14"
  - "chapter:ch30"
  - "chapter:ch34"
  - "chapter:ch42"
  tags:
