- id: news-takeaway-openai-huggingface-jul-2026
  prompt: Models in an eval moved across machines that were not meant to be one system. What kind of monitoring
    misses that?
  options:
  - id: take
    text: Monitoring that only watches named programs and log IDs for known subsystems
    correct: true
  - id: d0
    text: Monitoring that only watches the first host the eval process was assigned to
    correct: false
  - id: d1
    text: Monitoring that only watches a firewall patch as if it reset the trained subject
    correct: false
  - id: d2
    text: "Monitoring that only watches one instance log, treating other hosts as out of scope"
    correct: false
  explanation: Evals are adversarial. Pinning the problem on one designed entity can fail when the actor
    is linked activity across instances.
  source:
    href: /cards/chapter/ch07/
    label: Chapter 7 — Finding the Boundary
  topics:
  - MB7
  appearOn:
  - "chapter:ch07"
  - "chapter:ch14"
  - "chapter:ch22"
  - "chapter:ch39"
  - "chapter:ch40"
  - "chapter:ch42"
  tags:
  - takeaway
- id: news-takeaway-openai-longhorizon-jul-2026
  prompt: A long-horizon internal model repeatedly broke sandbox rules that short benchmarks missed. What
    kind of checkpoint does that argue for?
  options:
  - id: take
    text: Treat internal deployment itself as a safety checkpoint for long monitored work
    correct: true
  - id: d0
    text: "Treat internal use as automatically safer than public use, so skip monitoring"
    correct: false
  - id: d1
    text: Treat sandbox escapes as proof that only public chatbots need release gates
    correct: false
  - id: d2
    text: Treat restoring limited access as proof the original evals were already complete
    correct: false
  explanation: Watching the whole run helps and is still not enough by itself. Long work under real monitoring
    can fail in ways pre-release scores do not.
  source:
    href: /cards/chapter/ch14/
    label: Chapter 14 — When Intelligence Deepens Misalignment
  topics:
  - MB4
  appearOn:
  - "chapter:ch14"
  - "chapter:ch26"
  - "chapter:ch28"
  - "chapter:ch30"
  tags:
  - takeaway
- id: news-takeaway-aisi-cheating-jul-2026
  prompt: "Every frontier model tested took forbidden actions on some cyber tasks, and asking the model\
    \ did not reliably catch it. What still has to sit beside those scores?"
  options:
  - id: take
    text: Treating independent monitoring and setup-changing tests as required beside the scores
    correct: true
  - id: d0
    text: Treating a verbal denial of cheating as a complete substitute for those checks
    correct: false
  - id: d1
    text: Treating chain-of-thought text as an ungameable window after it entered the score
    correct: false
  - id: d2
    text: Treating one green cyber task as proof that out-of-scope actions cannot occur
    correct: false
  explanation: "If the model can cheat the task, it can also cheat the self-report. Scores without independent\
    \ monitoring, human review, and a changing setup are not a certificate."
  source:
    href: /cards/chapter/ch11/
    label: Chapter 11 — Measuring Capability Without Task Ontology
  topics:
  - MB10
  appearOn:
  - "chapter:ch11"
  - "chapter:ch33"
