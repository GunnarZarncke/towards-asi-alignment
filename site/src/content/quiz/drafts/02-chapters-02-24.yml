questions:
- id: bostrom-superintelligence-author
  prompt: 'Who authored Superintelligence: Paths, Dangers, Strategies (2014)?'
  options:
  - id: bostrom
    text: Nick Bostrom
    correct: true
  - id: russell
    text: Stuart Russell
    correct: false
  - id: yudkowsky
    text: Eliezer Yudkowsky
    correct: false
  - id: legg
    text: Shane Legg
    correct: false
  - id: amodei
    text: Dario Amodei
    correct: false
  explanation: Nick Bostrom's Superintelligence (2014) popularized long-horizon AGI risk for policy and research audiences.
  source:
    href: /cards/chapter/ch02/
    label: Chapter 2 — From Artificial Intelligence to Artificial Civilization
  topics:
  - MB11
  appearOn:
  - chapter:ch02
- id: legg-hutter-agi-definition
  prompt: What does the Legg-Hutter (2007) formalization treat as the core of general intelligence?
  options:
  - id: env-performance
    text: "Expected performance across environments, weighted by complexity"
    correct: true
  - id: benchmark-scores
    text: Fixed scores on a single standardized benchmark suite of tasks
    correct: false
  - id: social-reasoning
    text: Human-like social and emotional reasoning as the measured core
    correct: false
  - id: turing-test
    text: Passing a conversational imitation test as the measured core
    correct: false
  - id: memorization
    text: Raw memorization of training data as the measured core skill
    correct: false
  explanation: Legg and Hutter (2007) linked algorithmic intelligence to Kolmogorov complexity and defined AGI in measurable terms.
  source:
    href: /cards/chapter/ch02/
    label: Chapter 2 — From Artificial Intelligence to Artificial Civilization
  topics:
  - MB7c
  appearOn:
  - chapter:ch02
- id: russell-human-compatible-book
  prompt: What alignment formulation does Russell's Human Compatible (2019) advocate instead of maximizing a fixed utility function?
  options:
  - id: assistance-games
    text: Assistance games where the agent infers and helps with preferences
    correct: true
  - id: fixed-utility
    text: Hard-coded fixed utility maximization with no preference inference
    correct: false
  - id: pure-imitation
    text: Pure behavioral cloning with no preference inference from humans
    correct: false
  - id: rule-list
    text: A fixed list of deontological rules with no residual uncertainty
    correct: false
  - id: random-exploration
    text: Unconstrained random exploration of actions without a preference model
    correct: false
  explanation: Russell's Human Compatible argues assistance-game formulations beat fixed-utility maximization for aligned AI.
  source:
    href: /cards/chapter/ch03/
    label: Chapter 3 — Alignment as a Dynamical Guarantee
  topics:
  - MB2
  appearOn:
  - chapter:ch03
- id: omohundro-basic-ai-drives
  prompt: What does Omohundro's "Basic AI Drives" thesis claim about sufficiently advanced optimizers?
  options:
  - id: convergent-instrumental
    text: They tend toward convergent instrumental subgoals such as self-preservation
    correct: true
  - id: terminal-only
    text: They treat terminal goals as fully overriding any instrumental reasoning
    correct: false
  - id: programmed-only
    text: They only ever exhibit drives that were explicitly programmed in them
    correct: false
  - id: scale-away
    text: They drop instrumental drives automatically once they scale enough
    correct: false
  - id: auto-aligned
    text: They become aligned automatically once intelligence crosses a threshold
    correct: false
  explanation: Omohundro (2008) argued sufficiently advanced optimizers tend toward convergent instrumental subgoals regardless of terminal values.
  source:
    href: /cards/chapter/ch03/
    label: Chapter 3 — Alignment as a Dynamical Guarantee
  topics:
  - MB6
  appearOn:
  - chapter:ch03
- id: yudkowsky-cev-paper
  prompt: Who introduced Coherent Extrapolated Volition (CEV) as a proposed alignment target?
  options:
  - id: yudkowsky
    text: Eliezer Yudkowsky
    correct: true
  - id: russell
    text: Stuart Russell
    correct: false
  - id: bostrom
    text: Nick Bostrom
    correct: false
  - id: christiano
    text: Paul Christiano
    correct: false
  - id: soares
    text: Nate Soares
    correct: false
  explanation: 'Yudkowsky (2004) proposed CEV: aggregate what humans would want if they knew more, thought longer, and were more the people they wished to be.'
  source:
    href: /cards/chapter/ch04/
    label: Chapter 4 — Why Fixed Values Are the Wrong Target
  topics:
  - MB8
  appearOn:
  - chapter:ch04
- id: ng-russell-irl-origin
  prompt: Who introduced inverse reinforcement learning as inferring reward functions from observed behavior? (Select all that apply.)
  options:
  - id: ng
    text: Andrew Ng
    correct: true
  - id: russell
    text: Stuart Russell
    correct: true
  - id: christiano
    text: Paul Christiano
    correct: false
  - id: ziebart
    text: Brian Ziebart
    correct: false
  - id: hadfield
    text: Dylan Hadfield-Menell
    correct: false
  - id: amodei
    text: Dario Amodei
    correct: false
  explanation: Ng and Russell (ICML 2000) formalized IRL; the field later showed many reward functions fit the same behavior.
