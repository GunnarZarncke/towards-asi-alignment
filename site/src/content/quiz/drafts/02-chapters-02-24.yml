    href: /cards/chapter/ch04/
    label: Chapter 4 — Why Fixed Values Are the Wrong Target
  topics:
  - MB2
  appearOn:
  - chapter:ch04
- id: armstrong-low-impact-agents
  prompt: What design goal did Armstrong, Sandberg, and Bostrom (2012) formalize in "Thinking Inside the Box"?
  options:
  - id: low-impact
    text: Agents that pursue goals while minimizing environmental side effects
    correct: true
  - id: max-explore
    text: Agents that maximize environment exploration regardless of side effects
    correct: false
  - id: adversarial-robust
    text: Agents that pursue adversarial robustness against gradient attacks only
    correct: false
  - id: saliency-only
    text: Agents that pursue interpretability through input saliency maps alone
    correct: false
  - id: debate-oversight
    text: Agents that treat multi-agent debate as the sole alignment mechanism
    correct: false
  explanation: Armstrong, Sandberg, and Bostrom (2012) asked agents to minimize side effects while pursuing goals — a precursor to impact measures.
  source:
    href: /cards/chapter/ch05/
    label: Chapter 5 — Assumptions, Scope, and Failure Coverage
  topics:
  - MB9
  appearOn:
  - chapter:ch05
- id: leike-scalable-agent-alignment
  prompt: What alignment approach did Leike et al. (2018) outline for scaling oversight to superhuman agents?
  options:
  - id: reward-modeling
    text: Scalable oversight via learned reward models and human feedback
    correct: true
  - id: self-play-only
    text: Pure self-play with no human feedback and no reward modeling
    correct: false
  - id: unsupervised-only
    text: "Unsupervised pretraining alone, without any preference data"
    correct: false
  - id: formal-verify
    text: Complete formal verification of every neural network weight
    correct: false
  - id: constitutional-only
    text: Constitutional AI with no reward-model training from humans
    correct: false
  explanation: Leike et al. (2018) outlined scalable oversight via learned reward models — the DeepMind line parallel to Christiano's RLHF work.
  source:
    href: /cards/chapter/ch05/
    label: Chapter 5 — Assumptions, Scope, and Failure Coverage
  topics:
  - MB4
  appearOn:
  - chapter:ch05
- id: hutter-aixi-formalism
  prompt: What is AIXI in Hutter's formalism?
  options:
  - id: ideal-rl-agent
    text: An idealized universal RL agent bounded only by computability
    correct: true
  - id: brain-model
    text: "A biologically realistic model of the human brain's learning"
    correct: false
  - id: nn-architecture
    text: A specific deep neural network architecture for language tasks
    correct: false
  - id: game-equilibrium
    text: A Nash equilibrium concept for agents in repeated-game play
    correct: false
  - id: cert-protocol
    text: A practical deep-RL agent with no universal mixture prior
    correct: false
  explanation: Hutter (2000s) defined AIXI as an idealized RL agent; it clarifies what "intelligence" means without anthropomorphic assumptions.
  source:
    href: /cards/chapter/ch06/
    label: Chapter 6 — What Is an Agent Without Anthropomorphism?
  topics:
  - MB1
  appearOn:
  - chapter:ch06
- id: park-deceptive-alignment-survey
  prompt: What phenomenon does the 2024 "Deceptive Alignment" survey primarily synthesize evidence for?
  options:
  - id: strategic-misrep
    text: Models strategically misrepresent objectives during evaluation
    correct: true
  - id: hardware-fail
    text: Models honestly report objectives throughout training and tests
    correct: false
  - id: atari-hack
    text: Unintended reward hacking without strategic misrepresentation
    correct: false
  - id: benchmark-contam
    text: Dataset contamination that only mimics strategic misrepresentation
    correct: false
  - id: full-interpret
    text: Full layer interpretability that rules out misrepresentation
    correct: false
  explanation: Park et al. (2024) reviewed conditions under which models might strategically misrepresent objectives during training and evaluation.
  source:
    href: /cards/chapter/ch06/
    label: Chapter 6 — What Is an Agent Without Anthropomorphism?
  topics:
  - MB7
  appearOn:
  - chapter:ch06
- id: pearl-do-calculus
  prompt: Who developed the do-calculus for identifying causal effects from observational data?
  options:
  - id: pearl
    text: Jude Pearl
    correct: true
  - id: rubin
    text: Donald Rubin
    correct: false
  - id: granger
    text: Clive Granger
    correct: false
  - id: friston
    text: Karl Friston
    correct: false
  - id: spirtes
