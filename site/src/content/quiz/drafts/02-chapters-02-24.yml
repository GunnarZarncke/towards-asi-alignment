    label: Chapter 7 — Finding the Boundary
  topics:
  - MB1
  appearOn:
  - chapter:ch07
- id: jaderberg-population-based-training
  prompt: What mechanism does Population Based Training (PBT) use during deep RL training?
  options:
  - id: pop-evolve
    text: Evolving populations that copy weights and replace underperformers
    correct: true
  - id: curriculum
    text: Single-agent curriculum learning with fully fixed hyperparameters
    correct: false
  - id: distillation
    text: Knowledge distillation from one frozen teacher throughout training
    correct: false
  - id: offline-bayes
    text: Offline Bayesian hyperparameter search with no weight sharing
    correct: false
  - id: adversarial-only
    text: Adversarial self-play with no explicit population-level structure
    correct: false
  explanation: Jaderberg et al. (2017) showed training populations can split, merge, and adapt — a field precedent for grow/split/merge dynamics.
  source:
    href: /cards/chapter/ch08/
    label: Chapter 8 — Agents That Grow, Split, and Merge
  topics:
  - MB10
  appearOn:
  - chapter:ch08
- id: burns-weak-to-strong
  prompt: What question did OpenAI's 2023 "Weak-to-Strong Generalization" work empirically test?
  options:
  - id: weak-supervise-strong
    text: "Whether weaker supervisors can align stronger, more capable models"
    correct: true
  - id: vision-scaling
    text: Whether scaling laws hold for standard computer-vision models
    correct: false
  - id: eliminate-halluc
    text: Whether RLHF eliminates all hallucinations in language models
    correct: false
  - id: debate-beats-amp
    text: Whether debate always beats iterated amplification in practice
    correct: false
  - id: grokking-llm
    text: Whether grokking occurs in large language-model pretraining runs
    correct: false
  explanation: Burns et al. (2023) tested whether GPT-4-scale supervision can control more capable successors — central to successor-alignment debates.
  source:
    href: /cards/chapter/ch08/
    label: Chapter 8 — Agents That Grow, Split, and Merge
  topics:
  - MB10
  appearOn:
  - chapter:ch08
