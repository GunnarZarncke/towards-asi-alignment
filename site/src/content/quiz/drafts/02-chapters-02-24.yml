  topics:
  - MB1
  appearOn:
  - chapter:ch07
- id: garrabrant-cartesian-frames
  prompt: What problem do Cartesian Frames aim to address in embedded agency?
  options:
  - id: naive-cut
    text: Naive agent-environment cuts that fail once agents are embedded
    correct: true
  - id: gpu-memory
    text: Clean Cartesian cuts that remain valid once agents are embedded
    correct: false
  - id: reward-sparse
    text: Agent-environment cuts that hold only for disembodied oracles
    correct: false
  - id: social-choice
    text: Embedded cuts that fail only in multi-agent social choice
    correct: false
  - id: scaling-plateau
    text: Embedded cuts that fail only when language-model scaling plateaus
    correct: false
  explanation: Garrabrant (2021) proposed Cartesian Frames as an alternative to naive agent–environment cuts in embedded settings.
